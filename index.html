<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/BvwTjXgv/image-359e594e.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Aniocean· Stream Anime, Movies & TV-Show</title>
  <meta name="description" content="Watch the latest anime, movies, and TV series for free on Aniocean. Discover new releases effortlessly with real-time search and multi-language subs.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:opsz,wght@14..32,400..700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-body: #0a1929;
      --bg-header: #0f2440;
      --bg-card: #132f4c;
      --bg-surface: #1a3a5c;
      --bg-popup: #102a44;
      --text-primary: #ffffff;
      --text-secondary: #b0c7e3;
      --text-muted: #94a3b8;
      --text-widget-title: #a2c4de;
      --btn-primary: #2b6cb0;
      --btn-primary-hover: #1d4e89;
      --btn-primary-text: #ffffff;
      --btn-secondary: #334e68;
      --btn-secondary-hover: #243b53;
      --popup-btn: #5c6ac4;
      --popup-btn-text: #ffffff;
      --popup-btn-hover: #4955b5;
      --genre-tag-bg: #4c51bf;
      --link-accent: #ed64a6;
      --accent-gold: #ecc94b;
      --accent-blue: #4299e1;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.16);
      --font-title: 'Archivo Black', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-meta: 'Poppins', sans-serif;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --radius-circle: 50%;
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
      --transition-fast: 0.18s ease;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-body);
      font-family: var(--font-body);
      color: var(--text-primary);
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    img { max-width: 100%; display: block; }
    button, .btn-heart, .btn-watch { cursor: pointer; font-family: inherit; }

    /* ── HERO SLIDER ── */
    .hero-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    .slides-container {
      display: flex;
      transition: transform 0.55s ease-in-out;
      height: 100%;
    }
    .slide {
      min-width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 0 5%;
      overflow: hidden;
      animation: kenburns 12s ease-in-out infinite alternate;
      /* Sharpen images for better clarity on desktop */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    /* Special handling for anime poster images - focus on upper portion */
    .slide[data-anime="true"] {
      background-position: center 20%;
    }
    
    /* ════════════════════════════════════════════════════════════
       ANILIST BANNER DISPLAY - Default Size (No Stretch!)
       Anilist banners are ~1000x380px (wide but short)
       Show at natural aspect ratio, no vertical stretching
       ════════════════════════════════════════════════════════════ */
    .slide[data-image-source*="anilist"] {
      background-size: auto 100%;        /* Fit width, maintain aspect ratio */
      background-repeat: no-repeat;
      background-position: center top;   /* Align to top */
      animation: kenburns-banner 14s ease-in-out infinite alternate;
    }
    
    /* Gradient overlay for area below Anilist banner (fills empty space) */
    .slide[data-image-source*="anilist"]::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60%;  /* Cover lower portion where banner doesn't reach */
      background: linear-gradient(
        to top,
        var(--bg-body) 0%,
        rgba(10, 25, 41, 0.95) 30%,
        rgba(10, 25, 41, 0.7) 60%,
        transparent 100%
      );
      z-index: 1;
      pointer-events: none;
    }
    
    /* Subtle Ken Burns effect for banners (horizontal pan only) */
    @keyframes kenburns-banner {
      0%   { background-size: auto 100%; transform: translateX(0); }
      100% { background-size: auto 105%; transform: translateX(-2%); }  /* Gentle right pan */
    }
    
    /* Anime slide enhancement for non-Anilist sources (TMDB/Jikan fallback) */
    .slide-anime:not([data-image-source*="anilist"]) {
      filter: contrast(1.05) saturate(1.1);
    }
    .slide::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(to top, var(--bg-body) 0%, transparent 22%),
        linear-gradient(to right, rgba(10,25,41,0.55) 0%, rgba(10,25,41,0.15) 45%, rgba(10,25,41,0.55) 100%);
      z-index: 1;
    }
    @keyframes kenburns {
      0%   { background-size: cover; transform: scale(1); }
      100% { background-size: cover; transform: scale(1.05); }
    }
    .slide-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin-bottom: 6%;
      background: rgba(15, 36, 64, 0.38);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-lg);
      padding: clamp(14px, 2.5vw, 28px);
      box-shadow: var(--shadow-lg);
    }
    .slide-title {
      font-family: var(--font-title);
      font-size: clamp(18px, 4.5vw, 38px);
      margin-bottom: 6px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .slide-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }
    .meta-badge {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: clamp(0.55rem, 1.4vw, 0.72rem);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(4px);
    }
    .slide-synopsis {
      font-size: clamp(0.55rem, 1.4vw, 0.82rem);
      color: rgba(255,255,255,0.78);
      margin-bottom: 14px;
      line-height: 1.45;
      max-height: 60px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .slide-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-watch {
      background: var(--btn-primary);
      color: #fff;
      padding: clamp(8px, 1.5vw, 12px) clamp(14px, 2.5vw, 26px);
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all var(--transition-fast);
    }
    .btn-watch:hover {
      background: var(--btn-primary-hover);
      transform: scale(1.02);
    }
    .btn-heart-slide {
      width: clamp(32px, 5vw, 44px);
      height: clamp(32px, 5vw, 44px);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-medium);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      color: #fff;
      font-size: clamp(0.8rem, 2vw, 1.2rem);
    }
    .btn-heart-slide:hover {
      background: rgba(255,255,255,0.2);
    }
    .slider-nav {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 4px 16px;
      z-index: 5;
      border: 1px solid var(--border-subtle);
    }
    .slider-arrow {
      background: none;
      border: none;
      color: #fff;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .slider-arrow:hover {
      color: var(--btn-primary);
    }
    .slide-counter {
      font-size: clamp(0.65rem, 1.5vw, 0.85rem);
      color: rgba(255,255,255,0.85);
    }
    .slider-dots {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 5;
    }
    .dot {
      width: clamp(5px, 0.8vw, 7px);
      height: clamp(5px, 0.8vw, 7px);
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      cursor: pointer;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* ── GRID & CARD ── */
    .card-title {
      font-size: 0.875rem; font-weight:600; color:#fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .card-meta-sm { font-size:0.75rem; font-weight:500; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-info-grid .card-title { font-size:0.85rem; }
    .card-info-grid .card-meta-sm { font-size:0.7rem; }
    .badge { font-size:0.625rem; font-weight:700; text-transform:uppercase; }
    /* Status badge - PINK color - TOP LEFT POSITION */
    .poster-status-badge { position:absolute; top:6px; left:6px; background:linear-gradient(135deg, rgba(236,72,153,0.9), rgba(244,114,182,0.9)); color:#fff; font-size:0.6rem; padding:2px 6px; border-radius:3px; z-index:2; font-weight:600; backdrop-filter:blur(4px); }
    
    /* Genre tags on cards */
    .card-genres { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
    .genre-tag { font-size:0.55rem; padding:1px 5px; border-radius:3px; background:rgba(99,102,241,0.18); color:#a5b4fc; border:1px solid rgba(99,102,241,0.25); white-space:nowrap; font-weight:500; }
    .genre-tag:nth-child(n+5) { display:none; } /* Max 4 genres visible */
    .poster-rating-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:var(--accent-gold); font-size:0.6rem; padding:2px 5px; border-radius:3px; z-index:2; display:flex; align-items:center; gap:3px; }

    /* ── LAYOUT (scrolls together) ── */
    .main-layout { display:flex; gap:20px; max-width:1920px; margin:0 auto; align-items:flex-start; }
    .main-content { flex:1; min-width:0; padding:0 20px 20px; max-width:calc(100% - 380px); }
    .sidebar-right { flex:0 0 420px; width:420px; padding:0 12px 0 0; position:relative; }
    @media (min-width:1600px) {
      .sidebar-right { flex:0 0 460px; width:460px; }
      .main-content { max-width:calc(100% - 480px); }
    }
    .section { margin:30px 0; }
    .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
    .section-title { font-family:var(--font-title); font-size:1.35rem; color:var(--text-widget-title); }
    .section-controls { display:flex; align-items:center; gap:8px; }
    .view-all { font-size:0.75rem; font-weight:600; color:var(--link-accent); border:1px solid var(--link-accent); border-radius:var(--radius-pill); padding:5px 12px; white-space:nowrap; transition:all var(--transition-fast); }
    .view-all:hover { background:rgba(237,100,166,0.15); }
    .scroll-arrow { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid var(--border-medium); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:1rem; }
    .scroll-arrow:hover { background:rgba(255,255,255,0.14); }
    @media (max-width:1024px) { .scroll-arrow { display:none; } }

    .horizontal-scroll { display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:8px; }
    .horizontal-scroll::-webkit-scrollbar { display:none; }
    .show-card-horiz { flex:0 0 auto; width:165px; cursor:pointer; transition:transform var(--transition-fast); }
    .show-card-horiz:hover { transform:translateY(-4px); }
    .card-poster { width:100%; aspect-ratio:3/4.5; background-size:cover; background-position:center; border-radius:var(--radius-md); position:relative; overflow:hidden; margin-bottom:6px; background-color:var(--bg-card); }
    .play-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity var(--transition-fast); border-radius:var(--radius-md); }
    .play-overlay svg { width:36px; height:36px; fill:#fff; }
    .show-card-horiz:hover .play-overlay, .show-card-grid:hover .play-overlay { opacity:1; }
    .ranking-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); color:#fff; font-weight:700; font-size:0.7rem; padding:2px 7px; border-radius:4px; z-index:2; }
    .quality-badge { position:absolute; top:6px; left:6px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.62rem; padding:2px 5px; border-radius:3px; z-index:2; font-weight:600; }
    .score-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:var(--accent-gold); font-size:0.65rem; padding:2px 5px; border-radius:3px; z-index:2; font-weight:600; display:flex; align-items:center; gap:3px; }
    
    /* No Image placeholder - vertically stacked text */
    .card-poster.no-image::before { content:'No'; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); color:#94a3b8; font-size:0.75rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; z-index:1; user-select:none; }
    .card-poster.no-image::after { content:'Image'; position:absolute; top:55%; left:50%; transform:translate(-50%,-50%); color:#94a3b8; font-size:0.7rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; z-index:1; user-select:none; }

    /* NEW ON ANIOCEAN SECTION - Balanced rows */
    .new-aniocean-grid { 
      display:grid; 
      grid-template-columns:repeat(7, 1fr); 
      gap:12px;
      /* Ensure complete rows only */
    }
    @media (max-width: 1600px) {
      .new-aniocean-grid { grid-template-columns:repeat(6, 1fr); }
    }
    @media (max-width: 1200px) {
      .new-aniocean-grid { grid-template-columns:repeat(6, 1fr); }
    }
    @media (max-width: 992px) {
      .new-aniocean-grid { grid-template-columns:repeat(5, 1fr); }
    }
    @media (max-width: 768px) {
      .new-aniocean-grid { grid-template-columns:repeat(3, 1fr); gap:10px; }
    }
    @media (max-width: 520px) {
      .new-aniocean-grid { grid-template-columns:repeat(2, 1fr); }
    }
    
    .aniocean-card {
      position: relative;
      cursor: pointer;
      transition: transform var(--transition-fast);
      display: flex;
      flex-direction: column;
    }
    .aniocean-card:hover {
      transform: translateY(-4px);
    }
    .aniocean-poster {
      position: relative;
      aspect-ratio: 3/4.5;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
    }
    .aniocean-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Score Badge - Top Right */
    .aniocean-badge-score {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      color: var(--accent-gold, #fbbf24);
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .aniocean-badge-score i {
      font-size: 0.65rem;
    }
    
    /* Sub/Dub Badges Container - Bottom Left */
    .aniocean-badge-lang {
      position: absolute;
      bottom: 6px;
      left: 6px;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    
    /* Individual Language Badge */
    .aniocean-lang-badge {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      letter-spacing: 0.3px;
    }
    .aniocean-lang-badge i {
      font-size: 0.6rem;
    }
    
    /* Sub Badge - Cyan/Blue theme (matches site accent) */
    .aniocean-lang-badge.sub-badge {
      background: rgba(6, 182, 212, 0.85);
      color: #ffffff;
      border: 1px solid rgba(34, 211, 238, 0.9);
    }
    
    /* Dub Badge - Purple/Violet theme (complementary) */
    .aniocean-lang-badge.dub-badge {
      background: rgba(139, 92, 246, 0.85);
      color: #ffffff;
      border: 1px solid rgba(167, 139, 250, 0.9);
    }
    
    /* Title Section - Below Poster (not overlaid) */
    .aniocean-title-section {
      padding: 8px 4px 2px;
      text-align: center;
    }
    .aniocean-meta {
      font-size: 0.62rem;
      color: var(--text-muted, #94a3b8);
      margin-bottom: 3px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .aniocean-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Grid containers with balanced rows - New Releases section */
    .grid-container { 
      display:grid; 
      grid-template-columns:repeat(7, 1fr); 
      gap:14px;
    }
    /* Large desktop (>1800px): 7 cols × 6 rows = 42 shows */
    @media (max-width:1800px) { .grid-container { grid-template-columns:repeat(7, 1fr); gap:12px; } }
    /* Desktop (1400-1800px): 6 cols × 6 rows = 36 shows */
    @media (max-width:1600px) { .grid-container { grid-template-columns:repeat(6, 1fr); } }
    /* Medium desktop (1200-1400px): 6 cols */
    @media (max-width:1400px) { .grid-container { grid-template-columns:repeat(6, 1fr); } }
    /* Small desktop/large tablet (992-1200px): 5 cols */
    @media (max-width:1200px) { .grid-container { grid-template-columns:repeat(5, 1fr); } }
    /* Tablet (768-992px): 4 cols */
    @media (max-width:992px) { .grid-container { grid-template-columns:repeat(4, 1fr); gap:10px; } }
    /* Tablet portrait (600-768px): 3 cols */
    @media (max-width:768px) { .grid-container { grid-template-columns:repeat(3, 1fr); gap:10px; } }
    /* Mobile landscape (520-600px): 3 cols */
    @media (max-width:600px) and (orientation:landscape) { .grid-container { grid-template-columns:repeat(3, 1fr); } }
    /* Mobile landscape (<520px): 2 cols */
    @media (max-width:520px) and (orientation:landscape) { .grid-container { grid-template-columns:repeat(2, 1fr); } }
    /* Mobile portrait (<520px): 2 cols */
    @media (max-width:520px) and (orientation:portrait) { .grid-container { grid-template-columns:repeat(2, 1fr); } }
    @media (max-width:520px) { .grid-container { grid-template-columns:repeat(2, 1fr); } }
    .show-card-grid { border-radius:var(--radius-md); overflow:hidden; cursor:pointer; transition:transform var(--transition-fast); position:relative; }
    .show-card-grid:hover { transform:translateY(-3px); }
    .show-card-grid .card-poster {
      aspect-ratio: 3/4.5;
      border-radius: 0;
      margin-bottom: 0;
    }
    .card-info-grid {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 8px 8px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      color: #fff;
      pointer-events: none;
    }

    /* Sliding Toggle Tabs with Glider Effect */
    .toggle-tabs {
      display: flex;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: var(--radius-pill, 50px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      gap: 0;
    }
    .toggle-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 16px;
      border-radius: var(--radius-pill, 50px);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s ease-in-out;
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-secondary, #94a3b8);
      white-space: nowrap;
    }
    .toggle-tab:hover {
      color: #e2e8f0;
    }
    .toggle-tab.active {
      color: #ffffff;
      font-weight: 600;
    }
    /* Glider/Slider Background */

    /* ── POPULAR ANIME LIST (Miruro-style improved) ── */
    .pa-list { display:flex; flex-direction:column; gap:5px; }
    .pa-row {

    /* LEFT SIDE: dark overlay that fades to transparent right — Miruro look */

        rgba(10,18,28,0.0) 100%);

      function infoUrl(show) {

        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

        let type = 'anime';
        let prefixId = id;

        if (id.startsWith('jikan-')) {
          type = 'anime';
          prefixId = id.replace(/^jikan-(?:air-|up-|comp-|tr-|pop-)?/, 'jikan-');
        } else if (id.startsWith('tmdb-mv-') || id.startsWith('tmdb-movie-') || id.startsWith('tmdb-up-')) {
          type = 'movie';
          const numeric = id.replace(/^tmdb-(?:mv|movie|up)-/, '');
          prefixId = `tmdb-movie-${numeric}`;
        } else if (id.startsWith('tmdb-tv-') || id.startsWith('tmdb-tvpop-') || (id.startsWith('tmdb-comp-') && !id.includes('movie'))) {
          type = 'tv';
          const numeric = id.replace(/^tmdb-(?:tv|tvpop|comp)-/, '');
          prefixId = `tmdb-tv-${numeric}`;
        } else if (/^\d+$/.test(id)) {
          type = 'anime';
          prefixId = `jikan-${id}`;

        const base = `/info/${type}/${prefixId}`;
        return slug ? `${base}/${slug}` : base;

      const GENRE_MAP = {

            return { ok: true, data: json.data || json };

        } catch(e) { /* proxy down — fall through */ }
        // 2) Direct Anikoto fallback
        try {
          const res = await fetch(`${ANIKOTO_API}${endpoint}`, {
            headers: { Accept: 'application/json' }

          if (!res.ok) return { ok: false, data: [] };
          const json = await res.json();
          return { ok: true, data: json.data || json };

      async function fetchTMDB(endpoint, params='') {

      async function fetchJikan(endpoint, params='', retries=2) {
        const qs = params ? `?${params}` : '';
        // 1) Universal proxy — cached 5 min at CF edge, absorbs 429s server-side
        try {
          const res = await fetch(`${ANIUMI_PROXY}/jikan/${endpoint}${qs}`, {
            headers: { Accept: 'application/json' },
            signal: AbortSignal.timeout(10000)
          });
          if (res.ok) return await res.json();
          if (res.status === 429) {
            // Proxy also rate-limited — wait and retry once via proxy
            await new Promise(r => setTimeout(r, 2000));
            try {
              const r2 = await fetch(`${ANIUMI_PROXY}/jikan/${endpoint}${qs}`, {
                headers: { Accept: 'application/json' },
                signal: AbortSignal.timeout(10000)
              });
              if (r2.ok) return await r2.json();
            } catch(e) {}
          }
        } catch(e) { /* proxy down — fall through to direct */ }
        // 2) Direct Jikan with retry (safety net — longer backoff to respect rate limits)
        const directUrl = `${JIKAN_BASE}/${endpoint}${qs}`;
        for (let attempt = 1; attempt <= retries; attempt++) {
          try {
            const res = await fetch(directUrl, { signal: AbortSignal.timeout(12000) });
            if (res.ok) return await res.json();
            if (res.status === 429) {
              await new Promise(r => setTimeout(r, attempt * 2500));
              continue;
            }
            return { data: [] };
          } catch(e) {
            if (attempt === retries) { return { data: [] }; }
            await new Promise(r => setTimeout(r, attempt * 2000));
          }
        }
        return { data: [] };
      }

      /* ── ANILIST GRAPHQL API ── */

      const ANILIST_ENDPOINT = 'https://graphql.anilist.co';

      const ANILIST_ANIME_FIELDS = `

        bannerImage
        averageScore
        meanScore
        popularity
        trending
        genres
        tags { name rank }
        studios(isMain: true) { nodes { name } }
        nextAiringEpisode { airingAt timeUntilAiring episode }
        source
        countryOfOrigin
        isAdult
        siteUrl
      `;
      
      async function fetchAniList(query, variables = {}) {
        // Try direct AniList API first (fast, reliable)
        try {
          const res = await fetch(ANILIST_ENDPOINT, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ query, variables }),
            signal: AbortSignal.timeout(15000)
          });
          if (res.ok) {
            const json = await res.json();
            if (json.data) return json.data;
            console.warn('[AniList] GraphQL error:', json.errors);
            return null;
          }
        } catch(e) {
          console.warn('[AniList] Direct fetch failed:', e);
        }
        
        // Fallback via proxy
        try {
          const res = await fetch(`${ANIUMI_PROXY}/anilist`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables }),
            signal: AbortSignal.timeout(15000)
          });
          if (res.ok) {

                backdrop: anilistResult.bannerImage,
                backdrop_orig: anilistResult.bannerImage,
                backdrop_mobile: anilistResult.bannerImage,
                poster: getJikanFallbackImage(anime).poster,  // Keep Jikan poster for info card
                source: anilistResult.source,
                confidence: anilistResult.confidence,
                anilistId: anilistResult.anilistId
              };
            } else {
              console.log(`[Hero Image] ❌ No Anilist banner for "${title}" (result: ${JSON.stringify(anilistResult)})`);
            }
          } catch(e) {
            console.error(`[Hero Image] 💥 Error in Anilist lookup for "${title}":`, e);
          }
          
          // STEP 2: Try safe TMDB search (secondary - has backdrops!)
          try {
            const tmdbResult = await safeTmdbBackdropSearch(title, year, episodes);
            
            if (tmdbResult) {
              console.log(`[Hero Image] ✅ TMDB backdrop found for "${title}" (${tmdbResult.confidence}% match)`);
              return {
                ...tmdbResult,
                poster: getJikanFallbackImage(anime).poster,  // Keep Jikan poster for info card
              };
            } else {
              console.log(`[Hero Image] ❌ No TMDB match for "${title}"`);
            }
          } catch(e) {
            console.error(`[Hero Image] 💥 Error in TMDB search for "${title}":`, e);
          }
          
          // STEP 3: Fall back to Jikan large image (final fallback)
          console.log(`[Hero Image] ⚠️ Using Jikan fallback for "${title}"`);
          return getJikanFallbackImage(anime);
        };

        // ── 4a) Map TMDB slides ─────────────────────────────────────────
        const tmdbSlides = top13Tmdb.map(t => ({
          id:             `tmdb-tv-${t.id}`,
          title:          t.name || t.original_name || 'Unknown',
          source:         'tmdb',
          type:           'TV Show',
          genres:         [],
          themes:         [],
          score:          t.vote_average ? Number(t.vote_average).toFixed(1) : 'N/A',
          year:           (t.first_air_date||'').slice(0,4) || '',
          duration:       '',
          episodes:       '?',
          synopsis:       (t.overview||'').slice(0,320),
          backdrop:       `https://image.tmdb.org/t/p/w1280${t.backdrop_path}`,
          backdrop_orig:  `https://image.tmdb.org/t/p/original${t.backdrop_path}`,
          backdrop_mobile:`https://image.tmdb.org/t/p/w780${t.backdrop_path}`,
          poster:         t.poster_path ? `https://image.tmdb.org/t/p/w500${t.poster_path}` : '',
          certification:  'TV-14',
          studio:         '',
          tmdb_id:        t.id,
          status_color:   '#818cf8',
          status_label:   '● Ongoing',
          infoHref:       `/info/tv/tmdb-tv-${t.id}/${(t.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}`,
        }));

        // ── 4b) Map Jikan slides with HYBRID IMAGE RESOLUTION ─────────
        // Use the image resolution pipeline: Anilist Banner → TMDB Backdrop → Jikan Fallback
        console.log(`[Hero Image] Starting hybrid image resolution for ${top20Jikan.length} anime...`);
        
        // Resolve images for all anime in parallel (with concurrency limit)
        const jikanSlidesWithImages = await Promise.all(
          top20Jikan.map(async (a) => {
            const slugify = t => (t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
            const genres = (a.genres || []).map(g => g.name).filter(Boolean);
            const themes = (a.themes || []).map(t => t.name).filter(Boolean);
            const year = (a.airing_start || '').slice(0, 4) || new Date().getFullYear().toString();
            
            // ⭐ USE HYBRID PIPELINE for best quality image!
            const imageData = await resolveAnimeImage(a);
            
            return {
              id:             `jikan-${a.mal_id}`,
              title:          a.title || 'Unknown Anime',
              source:         'jikan',  // Metadata source is still Jikan
              type:           a.type || 'Anime',
              genres:         genres,
              themes:         themes,
              score:          a.score ? Number(a.score).toFixed(1) : 'N/A',
              year:           year,
              duration:       '',
              episodes:       a.episodes ? String(a.episodes) : '?',
              synopsis:       (a.synopsis || '').slice(0, 320),
              // Hybrid resolved images!
              backdrop:       imageData.backdrop,
              backdrop_orig:  imageData.backdrop_orig,
              backdrop_mobile:imageData.backdrop_mobile,
              poster:         imageData.poster,  // Keep Jikan poster for info card
              certification:  a.rating || 'TV-14',
              studio:         a.producers?.[0]?.name || '',
              mal_id:         a.mal_id,
              anilist_id:     imageData.anilistId || null,
              tmdb_image_id:  imageData.tmdbId || null,
              image_source:   imageData.source,  // Track which source provided the image
              image_confidence: imageData.confidence,
              status_color:   '#38bdf8',  /* Sky blue - matches site theme! */
              status_label:   '● Airing Now',
              infoHref:       `/info/anime/jikan-${a.mal_id}/${slugify(a.title)}`,
            };
          })
        );
        
        // Filter out any slides without valid images
        const jikanSlides = jikanSlidesWithImages.filter(s => s.backdrop || s.backdrop_mobile);
        
        // Log image source distribution
        const imageSources = {};
        jikanSlides.forEach(s => {
          imageSources[s.image_source] = (imageSources[s.image_source] || 0) + 1;
        });
        console.log(`[Hero Image] Resolution complete:`, imageSources);

        // ── 5) Merge: ANIME FIRST pattern ──────────────────────────────
        // Total: 20 Jikan + 13 TMDB = 33 slides
        // Pattern: Anime starts first, then alternates (Anime+TMDB)
        // After all 13 TMDB used, continue with remaining Jikan only
        const merged = [];
        let tmdbIdx = 0, jikanIdx = 0;
        
        // Phase 1: Alternate starting with ANIME FIRST
        while (jikanIdx < jikanSlides.length && tmdbIdx < tmdbSlides.length) {
          // Always start with Anime on odd positions (0,2,4...)
          if ((merged.length % 2 === 0 || tmdbIdx >= tmdbSlides.length) && jikanIdx < jikanSlides.length) {
            merged.push(jikanSlides[jikanIdx++]);
          }
          // Then add TMDB on even positions (1,3,5...)
          if (tmdbIdx < tmdbSlides.length && (merged.length % 2 === 1)) {
            merged.push(tmdbSlides[tmdbIdx++]);
          }
        }
        
        // Phase 2: Add remaining Jikan after TMDB is exhausted (positions 27-33)
        while (jikanIdx < jikanSlides.length && merged.length < 33) {
          merged.push(jikanSlides[jikanIdx++]);
        }
        
        heroData = merged.slice(0, 33); // Ensure exactly 33 or fewer

        // ── 6) Cache in sessionStorage for 5 hours ────────────────────
        try {
          sessionStorage.setItem(HERO_CACHE_KEY, JSON.stringify({ data: heroData, ts: Date.now() }));
        } catch(e) {}

        console.log(`[Hero] ${tmdbSlides.length} TMDB + ${jikanSlides.length} Jikan = ${heroData.length} total slides`);
        renderHero();
        if (window.AniCache && heroData.length > 0) {
          // Trim to essential fields only — keep payload small for DB storage
          const heroForDB = heroData.map(s => ({
            id: s.id, title: s.title,
            source: s.source, type: s.type,
            genres: s.genres || [], themes: s.themes || [],
            score: s.score, year: s.year, duration: s.duration,
            episodes: s.episodes, synopsis: s.synopsis,
            backdrop: s.backdrop, backdrop_orig: s.backdrop_orig || s.backdrop,
            backdrop_mobile: s.backdrop_mobile || s.backdrop,
            poster: s.poster, certification: s.certification,
            studio: s.studio || '', mal_id: s.mal_id || null,
            tmdb_id: s.tmdb_id || null, anilist_id: s.anilist_id || null,
            infoHref: s.infoHref || null,
            status_color: s.status_color, status_label: s.status_label,
          }));
          window.AniCache.set({ cacheKey:'index:hero_slider', pageSource:'index',
            section:'hero_slider', data: heroForDB, itemCount: heroForDB.length }).catch(()=>{});
        }
      }
      function renderHero() {
        const container = document.getElementById('slidesContainer');
        const slugify = t => (t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
        container.innerHTML = heroData.map((s,i) => {
          const allTags = [...(s.genres||[]).slice(0,3), ...(s.themes||[]).slice(0,1)];
          const isAnime = s.source === 'jikan' || s.mal_id;
          const infoHref = s.infoHref || (isAnime
            ? `/info/anime/jikan-${s.mal_id}/${slugify(s.title)}`
            : `/info/tv/tmdb-tv-${s.tmdb_id}/${slugify(s.title)}`);
          const watchHref = isAnime ? `/watch/${s.id}` : `/watch/${s.id}`;
          const statusColor = s.status_color || 'var(--accent-blue)';
          const statusLabel = s.status_label || '● Airing';
          return `
          <div class="slide${isAnime ? ' slide-anime' : ''}" data-index="${i}"${isAnime ? ' data-anime="true"' : ''}${s.image_source ? ` data-image-source="${s.image_source}"` : ''}
            style="background-image:url('${s.backdrop||s.poster}');"
            data-bg-mobile="${s.backdrop_mobile||s.poster}"
            data-bg-desktop="${s.backdrop||s.poster}"
            data-bg-orig="${s.backdrop_orig||s.backdrop||s.poster}">
            <div class="slide-content">
              <h1 class="slide-title">${s.title}</h1>
              <div class="slide-meta">
                <span class="meta-badge">${s.type||'TV'}</span>
                <span class="meta-badge" style="color:${statusColor};border-color:${statusColor};">${statusLabel}</span>
                ${s.year ? `<span class="meta-badge"><i class="fas fa-calendar-alt"></i> ${s.year}</span>` : ''}
                ${s.duration ? `<span class="meta-badge"><i class="fas fa-clock"></i> ${s.duration}</span>` : ''}
                ${s.episodes && s.episodes !== '?' ? `<span class="meta-badge"><i class="fas fa-play"></i> ${s.episodes} eps</span>` : ''}
                ${s.studio ? `<span class="meta-badge">${s.studio}</span>` : ''}
                ${allTags.map(g => `<span class="meta-badge">${g}</span>`).join('')}
                <span class="meta-badge"><i class="fas fa-star" style="color:var(--accent-gold)"></i> ${s.score}</span>
              </div>
              <p class="slide-synopsis">${(s.synopsis||'').slice(0,280)}</p>
              <div class="slide-actions">
                <a href="${watchHref}" class="btn-watch"><i class="fas fa-play"></i> Watch Now</a>
                <a href="${infoHref}" class="btn-heart-slide"><i class="far fa-heart"></i></a>
              </div>
            </div>
          </div>`;
        }).join('');
        // Dots — show max 30 dots (condensed for large sets)
        const totalSlides = heroData.length;
        const showDots = Math.min(totalSlides, 30);
        document.getElementById('sliderDots').innerHTML = Array.from({length:showDots},(_,i) =>
          `<span class="dot${i===0?' active':''}" data-index="${i}"></span>`
        ).join('');
        // Only reset to slide 0 on first render — don't interrupt user mid-scroll
        if (!_heroRendered) {
          currentSlide = 0;
          updateSlidePos();
        } else {
          // Keep current position but clamp to new length
          currentSlide = Math.min(currentSlide, heroData.length - 1);
          updateSlidePos();
        }
        _heroRendered = true;
        document.getElementById('slideCounter').textContent = `${currentSlide+1} / ${totalSlides}`;
        // Apply correct resolution backdrops for current device
        requestAnimationFrame(applyResponsiveBackdrops);
        // Restart auto-advance with a single interval (clear old one first)
        if (_heroInterval) clearInterval(_heroInterval);
        _heroInterval = setInterval(() => goToSlide(currentSlide + 1), 6000);
      }
      // Apply correct backdrop resolution based on screen width
      function applyResponsiveBackdrops() {
        const isDesktop = window.innerWidth >= 768;
        const isLargeDesktop = window.innerWidth >= 1440;
        document.querySelectorAll('#slidesContainer .slide').forEach(el => {
          const url = isLargeDesktop
            ? (el.dataset.bgOrig || el.dataset.bgDesktop)
            : isDesktop
              ? el.dataset.bgDesktop
              : el.dataset.bgMobile;
          if (url) el.style.backgroundImage = `url('${url}')`;
        });
      }
      window.addEventListener('resize', applyResponsiveBackdrops);

      function goToSlide(i) { currentSlide = ((i%heroData.length)+heroData.length)%heroData.length; updateSlidePos(); }
      function updateSlidePos() {
        document.getElementById('slidesContainer').style.transform = `translateX(-${currentSlide*100}%)`;
        // Dots are capped at 30 — highlight the proportionally closest dot
        const dots = document.querySelectorAll('#sliderDots .dot');
        const total = heroData.length;
        dots.forEach((d,idx) => {
          // Map dot index to slide range — each dot represents total/dots.length slides
          const ratio = total / dots.length;
          const active = Math.round(currentSlide / ratio) === idx;
          d.classList.toggle('active', active);
        });
        document.getElementById('slideCounter').textContent = `${currentSlide+1} / ${heroData.length}`;
      }
      document.getElementById('prevSlide').addEventListener('click', ()=>goToSlide(currentSlide-1));
      document.getElementById('nextSlide').addEventListener('click', ()=>goToSlide(currentSlide+1));
      // Auto-advance is started inside renderHero() to avoid stacking intervals

      /* ── TOP AIRING ── */
      async function loadTopAiring() {
        if (window.AniCache) {
          const cached = await window.AniCache.get('index:top_airing');
          if (cached) { renderTopAiring(cached); return; }

        const [tvOnAir, anilistAir] = await Promise.all([

          // AniList: Currently airing anime sorted by popularity
          fetchAniList(`

                  ${ANILIST_ANIME_FIELDS}

        ]);
        
        const tv = (tvOnAir.results||[]).slice(0,20).map(i => ({

                episodes: String(internal.episodes),

        }

        const combined = dedupById([...tv, ...anime], 'id').slice(0,60);

        if (window.AniCache && combined.length) window.AniCache.set({ cacheKey:'index:top_airing',

      document.getElementById('topAiringRight').addEventListener('click',()=> document.getElementById('topAiringScroll').scrollBy({left:400,behavior:'smooth'}));

      /* ── NEW RELEASES ── */
      let allReleases = {all:[], anime:[], movie:[], tv:[]};
      let _newReleasesCache = null; // in-memory for filter toggles
      let currentNewReleasesFilter = 'all'; // tracks active tab (all/anime/movie/tv)

      async function loadNewReleases() {

          const cached = await window.AniCache.get('index:new_releases').catch(()=>null);
          if (cached && cached.all && cached.all.length) {
            _newReleasesCache = cached;
            allReleases = cached;
            if (!currentNewReleasesFilter) currentNewReleasesFilter = 'all';
            renderNewReleases(currentNewReleasesFilter);
            return;
          }
        }
        
        // Calculate target shows for 6 complete rows
        function calcColsForGrid() {
          const w = window.innerWidth;
          if (w <= 520) return 2;
          if (w <= 768) return 4;
          if (w <= 992) return 5;
          if (w <= 1400) return 6;
          if (w <= 1800) return 7;
          return 8;
        }
        const TARGET_ROWS = 6;
        const cols = calcColsForGrid();
        const TARGET_SHOWS = TARGET_ROWS * cols; // 42-48 shows
        
        // Fetch MORE pages to fill 6 rows - Using NEW t-umi proxy + AniList
        const [nowMovies, nowMovies2, onAirTv, onAirTv2, anilistNow] = await Promise.all([

          fetchTMDB('/tv/on_the_air', `page=1`),
          fetchTMDB('/tv/on_the_air', `page=2`),
          // AniList: Current season anime (replacing Jikan seasons/now)
          fetchAniList(`
            query ($perPage: Int) {
              Page(page: 1, perPage: $perPage) {
                media(type: ANIME, status: RELEASING, isAdult: false, sort: [TRENDING_DESC, POPULARITY_DESC]) {
                  ${ANILIST_ANIME_FIELDS}

        // Merge multiple pages for each source
        const allMovies = [...(nowMovies.results||[]), ...(nowMovies2.results||[])]
          .map(i => ({
            id:`tmdb-mv-${i.id}`, title:i.title, poster:tmdbImg(i.poster_path), type:'Movie',
            score:(i.vote_average||0).toFixed(1), details:'1h 45m', cert:'PG-13', quality:'HD'
          })).slice(0, TARGET_SHOWS);
        const allTv = [...(onAirTv.results||[]), ...(onAirTv2.results||[])]

        // Convert AniList data (replacing Jikan seasons/now)

        _newReleasesCache = allReleases;

            const noImageClass = hasPoster ? '' : 'no-image';

                <span class="score-badge"><i class="fas fa-star"></i> ${s.score}</span>
                <div class="play-overlay"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg></div>
              </div>
              <div class="card-info-grid">
                <div class="card-meta-sm">${s.type} · ${s.details} · ${s.cert}</div>
                <div class="card-title">${s.title}</div>
              </div>
            </a>`;
          }
        }).join('');
      }
      document.getElementById('releaseTabs').addEventListener('click', e => {

      /* ── UPCOMING ── */
      let upcomingShows=[];
      async function loadUpcoming() {
        if (window.AniCache) {
          const cached = await window.AniCache.get('index:upcoming').catch(()=>null);
          if (cached && Array.isArray(cached) && cached.length) {
            upcomingShows = cached;
            // Restore popup data
            cached.forEach(s => { if (s.id) window._popupData = window._popupData || {}; });
            renderUpcoming();
            return;
          }
        }
        
        // Dynamic date range for upcoming TV: next 5 months from today (user request!)
        const now = new Date();
        const startDate = new Date(now.getFullYear(), now.getMonth(), 1); // 1st of current month
        const endDate = new Date(now.getFullYear(), now.getMonth() + 5, 0); // last day of 5th month
        const formatDate = (d) => d.toISOString().split('T')[0];
        
        // Using NEW t-umi proxy + AniList (replacing Jikan)
        const [tmdbUp1, tmdbUp2, tmdbUp3, tmdbUpTv1, tmdbUpTv2, tmdbUpTv3, anilistUpcoming] = await Promise.all([
          fetchTMDB('/movie/upcoming', `page=1`),
          fetchTMDB('/movie/upcoming', `page=2`),
          fetchTMDB('/movie/upcoming', `page=3`),
          fetchTMDB('/discover/tv', `first_air_date.gte=${formatDate(startDate)}&first_air_date.lte=${formatDate(endDate)}&sort_by=first_air_date.asc&page=1`),
          fetchTMDB('/discover/tv', `first_air_date.gte=${formatDate(startDate)}&first_air_date.lte=${formatDate(endDate)}&sort_by=first_air_date.asc&page=2`),
          fetchTMDB('/discover/tv', `first_air_date.gte=${formatDate(startDate)}&first_air_date.lte=${formatDate(endDate)}&sort_by=first_air_date.asc&page=3`),
          // AniList: Upcoming anime (replacing Jikan top/anime filter=upcoming)
          fetchAniList(`
            query ($perPage: Int) {
              Page(page: 1, perPage: $perPage) {
                media(type: ANIME, status: NOT_YET_RELEASED, isAdult: false, sort: [POPULARITY_DESC]) {
                  ${ANILIST_ANIME_FIELDS}
                }
              }
            }
          `, { perPage: 40 })
        ]);
        
        // Merge TMDB movie pages
        const allTmdbMovies = [...(tmdbUp1.results||[]), ...(tmdbUp2.results||[]), ...(tmdbUp3.results||[])];
        // Merge TMDB TV pages  
        const allTmdbTV = [...(tmdbUpTv1.results||[]), ...(tmdbUpTv2.results||[]), ...(tmdbUpTv3.results||[])];
        
        // Convert AniList upcoming anime
        const anilistUpAnime = [];
        if (anilistUpcoming?.Page?.media) {
          for (const m of anilistUpcoming.Page.media) {
            if (!m.isAdult) {
              const internal = anilistToInternal(m);
              // Better fallbacks for upcoming anime where some data may be TBA
              const studioName = internal.studio && internal.studio !== '?' ? internal.studio : 'TBA';
              const durValue = internal.duration && internal.duration !== '?' ? internal.duration : 
                (m.format === 'MOVIE' ? '1h 30m' : m.format === 'ONA' ? '24m' : '24m');
              const yearVal = internal.year && internal.year !== '?' ? internal.year : 
                (m.startDate?.year || m.seasonYear || 'TBA');
              
              anilistUpAnime.push({
                id:`anilist-up-${m.id}`,
                title: internal.title,
                original_title: internal.title_jp || internal.title,
                type:'Anime',
                poster: internal.poster,
                score: internal.score,
                genres: internal.genres || [],
                releaseDate: yearVal,
                synopsis: internal.description || 'No synopsis available.',
                certification: internal.rating || 'PG-13',
                studio: studioName,
                duration: durValue,
                year: yearVal,
                episodes: m.episodes || '?',
                format: m.format || 'TV',
                mal_id: internal.mal_id,
                anilist_id: m.id
              });
            }
          }
        }
        
        upcomingShows = dedupById([
          ...allTmdbMovies.slice(0,40).map(i => ({
            id:`tmdb-up-${i.id}`, title:i.title, original_title:i.original_title||i.title,
            type:'Movie', poster:tmdbImg(i.poster_path), score:(i.vote_average||0).toFixed(1),
            genres:(i.genre_ids||[]).map(id=>GENRE_MAP[id]||id), releaseDate:i.release_date||'',
            synopsis:i.overview||'', certification: i.adult?'18+':'PG-13',
            studio:'?', backdrop:tmdbBack(i.backdrop_path), duration:'2h 10m'
          })),
          ...allTmdbTV.slice(0,20).map(i => ({
            id:`tmdb-up-tv-${i.id}`, title:i.name, original_title:i.original_name||i.name,
            type:'TV', poster:tmdbImg(i.poster_path), score:(i.vote_average||0).toFixed(1),
            genres:(i.genre_ids||[]).map(id=>GENRE_MAP[id]||id), releaseDate:i.first_air_date||'',
            synopsis:i.overview||'', certification:'PG-13',
            studio:(i.networks||[])[0]?.name||'?', backdrop:tmdbBack(i.backdrop_path), duration:'45m'
          })),
          ...anilistUpAnime.slice(0,40)
        ], 'id').slice(0,100);
        renderUpcoming();
        if (window.AniCache && upcomingShows.length) window.AniCache.set({ cacheKey:'index:upcoming',
          pageSource:'index', section:'upcoming', data:upcomingShows, itemCount:upcomingShows.length }).catch(()=>{});
      }
      function renderUpcoming() {
        document.getElementById('upcomingScroll').innerHTML = upcomingShows.map(s => {
          // Check for valid poster - show No Image placeholder if missing
          const hasPoster = s.poster && s.poster !== '' && s.poster !== 'null' && s.poster !== 'undefined';
          const posterStyle = hasPoster ? `background-image:url('${s.poster}');` : 'background:linear-gradient(135deg, #1e293b 0%, #334155 100%);';
          const noImageClass = hasPoster ? '' : 'no-image';
          
          return `<a href="${infoUrl(s)}" class="show-card-horiz" onmouseenter="showPopup(event,'${s.id}')" onmouseleave="window.popupTimer=setTimeout(hidePopup,500)">
            <div class="card-poster ${noImageClass}" style="${posterStyle}">
              <span class="poster-status-badge">${s.type || 'HD'}</span>
              <span class="poster-rating-badge"><i class="fas fa-star"></i> ${s.score}</span>
              <div class="play-overlay"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg></div>
            </div>
            <h3 class="card-title">${s.title}</h3>
            <div class="card-meta-sm"><i class="fas fa-star"></i> ${s.score} · ${s.type} · ${s.releaseDate||'TBA'}</div>
          </a>`;
        }).join('');
      }
      document.getElementById('upcomingLeft').addEventListener('click', ()=> document.getElementById('upcomingScroll').scrollBy({left:-400}));
      document.getElementById('upcomingRight').addEventListener('click', ()=> document.getElementById('upcomingScroll').scrollBy({left:400}));

      /* ── COMPLETED (paginated) ── */
      let completedCurrentPage = 1;
      const _compSeenIds = new Set();
      let _completedPagesCache = {};
      async function loadCompleted(page=1) {
        if (window.AniCache && !_completedPagesCache[page]) {
          const cached = await window.AniCache.get('index:recently_completed').catch(()=>null);
          if (cached && cached.pages) _completedPagesCache = { ..._completedPagesCache, ...cached.pages };
        }
        if (_completedPagesCache[page] && _completedPagesCache[page].length) {
          const el = document.getElementById('completedGrid');
          if (el) el.innerHTML = _completedPagesCache[page].map(s => renderCompletedCard(s)).join('');
          renderPagination(page);
          return;
        }
        completedCurrentPage = page;
        
        // Grid col count - must match CSS grid-template-columns!
        function calcCols() {
          const w = window.innerWidth;
          if (w <= 520) return 2;
          if (w <= 600 && window.matchMedia('(orientation: landscape)').matches) return 3;
          if (w <= 768) return 4;
          if (w <= 992) return 5;
          if (w <= 1400) return 6;
          if (w <= 1800) return 7;
          return 8;
        }
        
        // Calculate target: 6 COMPLETE rows × columns
        const TARGET_ROWS = 6;
        const cols = calcCols();
        const TARGET_SHOWS = TARGET_ROWS * cols;  // e.g., 6×7=42, 6×8=48
        
        // Fetch MULTIPLE pages to ensure enough data for 6 rows
        // Using NEW t-umi proxy + AniList (replacing Jikan)
        // TMDB in ASCENDING order (user request!)
        
        const [tv, tv2, tv3, anilistComp] = await Promise.all([
          fetchTMDB('/discover/tv', `sort_by=first_air_date.asc&page=${page}`),       // ASCENDING order!
          fetchTMDB('/discover/tv', `sort_by=first_air_date.asc&page=${page+1}`),     // ASCENDING order!
          fetchTMDB('/discover/tv', `sort_by=first_air_date.asc&page=${page+2}`),     // ASCENDING order!
          // AniList: Recently completed anime (replacing Jikan status=complete)
          fetchAniList(`
            query ($page: Int, $perPage: Int) {
              Page(page: $page, perPage: $perPage) {
                media(type: ANIME, status: FINISHED, isAdult: false, sort: [END_DATE_DESC]) {
                  ${ANILIST_ANIME_FIELDS}
                }
              }
            }
          `, { page: page, perPage: 50 })
        ]);
        
        // Merge multiple TMDB pages (ascending order - oldest first)
        const allTmdbResults = [...(tv.results||[]), ...(tv2.results||[]), ...(tv3.results||[])];
        
        // Convert AniList completed anime
        const anilistItems = [];
        if (anilistComp?.Page?.media) {
          for (const m of anilistComp.Page.media.slice(0, TARGET_SHOWS)) {
            if (!m.isAdult) {
              const internal = anilistToInternal(m);
              anilistItems.push({
                id:`anilist-comp-${m.id}`,
                title: internal.title,
                poster: internal.poster,
                type: internal.type || 'Anime',
                year: String(internal.year),
                score: internal.score,
                quality: 'HD'
              });
            }
          }
        }
        
        // Create items arrays - take enough to fill 6 rows
        const tmdbItems = allTmdbResults.map(i=>({
          id:`tmdb-comp-${i.id}`,title:i.name,poster:tmdbImg(i.poster_path),
          type:'TV',year:(i.first_air_date||'').slice(0,4),
          score:(i.vote_average||0).toFixed(1),quality:'HD'
        })).slice(0, TARGET_SHOWS);
        const interleaved = [];
        for (let i=0; i<Math.max(anilistItems.length,tmdbItems.length); i++) {
          if (i<anilistItems.length) interleaved.push(anilistItems[i]);
          if (i<tmdbItems.length)  interleaved.push(tmdbItems[i]);
        }
        // Trim to exactly 6 complete rows (no incomplete last row!)
        const trimTo = Math.min(Math.floor(interleaved.length/cols)*cols, TARGET_SHOWS);
        const list = interleaved.slice(0, trimTo || TARGET_SHOWS);
        document.getElementById('completedGrid').innerHTML = list.map(s => renderCompletedCard(s)).join('');
        _completedPagesCache[page] = list;
        // Save pages 1 & 2 globally — 5h TTL
        if (window.AniCache && list.length && page <= 2) {
          const existing = await window.AniCache.get('index:recently_completed').catch(()=>null);
          const mergedPages = { ...((existing && existing.pages) || {}), [page]: list };
          window.AniCache.set({ cacheKey:'index:recently_completed', pageSource:'index',
            section:'recently_completed', data:{ pages: mergedPages }, itemCount: list.length }).catch(()=>{});
        }
        renderPagination(page);
      }
      function renderPagination(page) {
        const total = Math.ceil(1000/20);
        const nav = document.getElementById('completedPagination');
        
        // Responsive: Desktop shows 6 pages, Mobile shows 4 pages
        const isMobile = window.innerWidth <= 768;
        const visiblePages = isMobile ? 4 : 6;
        
        let html = `<button ${page===1?'disabled':''} id="compPrev">Previous</button><div style="display:flex;gap:4px;flex-wrap:wrap;">`;
        
        // Calculate visible range centered on current page
        const halfRange = Math.floor(visiblePages / 2);
        let start = Math.max(1, page - halfRange);
        let end = Math.min(total, start + visiblePages - 1);
        
        // Adjust start if we're near the end
        if (end - start + 1 < visiblePages) {
          start = Math.max(1, end - visiblePages + 1);
        }
        
        for (let i=start; i<=end; i++) {
          html += `<button class="${i===page?'active':''}" data-page="${i}">${i}</button>`;
        }
        html += `</div><button ${page>=total?'disabled':''} id="compNext">Next</button>`;
        nav.innerHTML = html;
        document.getElementById('compPrev')?.addEventListener('click', ()=>loadCompleted(page-1));
        document.getElementById('compNext')?.addEventListener('click', ()=>loadCompleted(page+1));
        nav.querySelectorAll('button[data-page]').forEach(b => {
          b.addEventListener('click', ()=>loadCompleted(parseInt(b.dataset.page)));
        });
      }

      /* ── SHARED CARD RENDERERS ── */
      function renderCompletedCard(s) {
        // Check if poster is valid (not empty, not undefined)
        const hasPoster = s.poster && s.poster !== '' && s.poster !== 'null' && s.poster !== 'undefined';
        const posterStyle = hasPoster ? `background-image:url('${s.poster}');` : 'background:linear-gradient(135deg, #1e293b 0%, #334155 100%);';
        const noImageClass = hasPoster ? '' : 'no-image';
        return `<a href="${infoUrl(s)}" class="show-card-grid">
          <div class="card-poster ${noImageClass}" style="${posterStyle}">
            <span class="quality-badge">${s.quality||'HD'}</span>
            <div class="play-overlay"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg></div>
          </div>
          <div class="card-info-grid">
            <div class="card-meta-sm">${s.type} · ${s.year||'?'} · <i class="fas fa-star"></i> ${s.score}</div>
            <div class="card-title">${s.title}</div>
          </div>
        </a>`;
      }
      function renderShowCard(s) {
        return `<a href="${infoUrl(s)}" class="sidebar-list-item" onmouseenter="showPopup(event,'${s.id}')" onmouseleave="window.popupTimer=setTimeout(hidePopup,500)">
          <span class="sidebar-rank">${s.rank||''}</span>
          <img class="sidebar-poster" src="${s.poster}" onerror="this.style.display='none'">
          <div class="sidebar-info"><h4>${s.title}</h4><div class="side-meta"><i class="fas fa-star"></i> ${s.score} · ${s.type}</div></div>
        </a>`;
      }

      /* ── TRENDING ── */
      let trendingData=[];
      let _trendingCache = {};
      async function loadTrending(period='today') {
        const periodKey = period === 'today' ? 'day' : period;
        if (window.AniCache && !_trendingCache[periodKey]) {
          const cached = await window.AniCache.get('index:trending_now').catch(()=>null);
          if (cached && cached[periodKey] && cached[periodKey].length) {
            _trendingCache = cached;
          }
        }
        if (_trendingCache[periodKey] && _trendingCache[periodKey].length) {
          trendingData = _trendingCache[periodKey];
          trendingData.forEach((item, i) => item.rank = i + 1);
          const el = document.getElementById('trendingList');
          if (el) el.innerHTML = trendingData.map(s => renderShowCard(s)).join('');
          return;
        }
        
        // Using TMDB + AniList (replacing Jikan)
        let tmdb, anilistTrend;
        
        if(period==='today') { 
          tmdb=await fetchTMDB('/trending/all/day'); 
          anilistTrend=await fetchAniList(`query { Page(page:1, perPage:10) { media(type:ANIME, status:RELEASING, isAdult:false, sort:TRENDING_DESC) { ${ANILIST_ANIME_FIELDS} } } }`); 
        }
        else if(period==='week') { 
          tmdb=await fetchTMDB('/trending/all/week'); 
          anilistTrend=await fetchAniList(`query { Page(page:1, perPage:10) { media(type:ANIME, isAdult:false, sort:TRENDING_DESC) { ${ANILIST_ANIME_FIELDS} } } }`); 
        }
        else { 
          const d=new Date();d.setDate(d.getDate()-30); 
          tmdb=await fetchTMDB('/discover/movie',`primary_release_date.gte=${d.toISOString().split('T')[0]}&sort_by=popularity.desc`); 
          anilistTrend=await fetchAniList(`query { Page(page:1, perPage:10) { media(type:ANIME, isAdult:false, sort:POPULARITY_DESC) { ${ANILIST_ANIME_FIELDS} } } }`); 
        }
        
        // Convert AniList data
        const anilistItems = [];
        if (anilistTrend?.Page?.media) {
          for (const m of anilistTrend.Page.media) {
            if (!m.isAdult) {
              const internal = anilistToInternal(m);
              anilistItems.push({
                id:`anilist-tr-${m.id}`,
                title: internal.title,
                poster: internal.poster,
                type:'Anime',
                score: internal.score,
                genres: internal.genres,
                synopsis: internal.description || '',
                release_date: `${internal.year}` || ''
              });
            }
          }
        }
        
        trendingData = [
          ...(tmdb.results||[]).slice(0,10).map(i => ({
            id:`tmdb-tr-${i.id}`, title:i.title||i.name, poster:tmdbImg(i.poster_path,'w185'),
            type:i.media_type==='movie'?'Movie':'TV', score:(i.vote_average||0).toFixed(1),
            genres:(i.genre_ids||[]).map(id=>GENRE_MAP[id]||id),
            overview:i.overview||'',
            release_date:i.release_date||i.first_air_date||'',
            media_type:i.media_type
          })),
          ...anilistItems
        ].sort((a,b)=>b.score-a.score).slice(0,20);
        trendingData.forEach((item,i)=>item.rank=i+1);
        document.getElementById('trendingList').innerHTML = trendingData.map(s => renderShowCard(s)).join('');
        // Merge all periods and save — 5h TTL
        if (window.AniCache && trendingData.length) {
          const existing = await window.AniCache.get('index:trending_now').catch(()=>null) || {};
          const merged = { ...existing, [periodKey]: trendingData };
          _trendingCache = merged;
          window.AniCache.set({ cacheKey:'index:trending_now', pageSource:'index',
            section:'trending_now', data:merged, itemCount:trendingData.length }).catch(()=>{});
        }
      }
      document.getElementById('trendingTabs').addEventListener('click', e => {
        if(e.target.classList.contains('toggle-tab')) {
          document.querySelectorAll('#trendingTabs .toggle-tab').forEach(t=>t.classList.remove('active'));
          e.target.classList.add('active');
          
          // Move glider to active tab
          moveGlider('trendingTabs', 'trendingGlider', e.target);
          
          loadTrending(e.target.dataset.period);
        }
      });

      /* ── POPULAR (sidebar) — Mix of TMDB + AniList popular ── */
      let popularData = [];
      async function loadPopular() {
        if (window.AniCache) {
          const cached = await window.AniCache.get('index:most_popular').catch(()=>null);
          if (cached && Array.isArray(cached) && cached.length) {
            popularData = cached;
            document.getElementById('popularList').innerHTML = cached.map(s => `
              <a href="${infoUrl(s)}" class="sidebar-list-item" onmouseenter="showPopup(event,'${s.id}')" onmouseleave="window.popupTimer=setTimeout(hidePopup,500)">
                <span class="sidebar-rank">${s.rank}</span>
                <img class="sidebar-poster" src="${s.poster}" onerror="this.style.display='none'">
                <div class="sidebar-info"><h4>${s.title}</h4>
                <div class="side-meta"><i class="fas fa-star" style="color:var(--accent-gold)"></i> ${s.score} &nbsp;·&nbsp;${s.type} &nbsp;·&nbsp;${s.year}</div></div>
              </a>`).join('');
            return;
          }
        }
        
        // Fetch BOTH TMDB and AniList for mixed results
        const [tmdbMovies, tmdbTV, anilistPop] = await Promise.all([
          fetchTMDB('/discover/movie', 'sort_by=vote_count.desc&vote_count.gte=5000&language=en-US&page=1'),
          fetchTMDB('/discover/tv',    'sort_by=vote_count.desc&vote_count.gte=2000&language=en-US&page=1'),
          // AniList: 8 most popular anime
          fetchAniList(`
            query ($perPage: Int) {
              Page(page: 1, perPage: $perPage) {
                media(type: ANIME, isAdult: false, sort: [POPULARITY_DESC]) {
                  ${ANILIST_ANIME_FIELDS}
                }
              }
            }
          `, { perPage: 10 })
        ]);
        
        const allMovies = tmdbMovies.results || [];
        const allTV     = tmdbTV.results || [];

        // TMDB items (movies + TV)
        const tmdbItems = [
          ...allMovies.slice(0, 5).map(i => ({
            id:`tmdb-pop-${i.id}`,
            title: i.title||'Unknown',
            poster: tmdbImg(i.poster_path, 'w185'),
            type: 'Movie',
            score: i.vote_average ? Number(i.vote_average).toFixed(1) : 'N/A',
            year: (i.release_date||'').slice(0,4) || '—',
            certification: 'PG-13',
            duration: i.runtime ? `${i.runtime} min` : '—',
            genres: (i.genre_ids||[]).map(id => GENRE_MAP[id]).filter(Boolean),
            synopsis: i.overview || 'No description available.',
            studio: '—',
          })),
          ...allTV.slice(0, 5).map(i => ({
            id:`tmdb-tvpop-${i.id}`,
            title: i.name||'Unknown',
            poster: tmdbImg(i.poster_path, 'w185'),
            type: 'TV',
            score: i.vote_average ? Number(i.vote_average).toFixed(1) : 'N/A',
            year: (i.first_air_date||'').slice(0,4) || '—',
            certification: 'TV-14',
            duration: '—',
            genres: (i.genre_ids||[]).map(id => GENRE_MAP[id]).filter(Boolean),
            synopsis: i.overview || 'No description available.',
            studio: (i.networks||[])[0]?.name || '—',
          }))
        ];
        
        // AniList items (8 popular anime)
        const anilistItems = [];
        if (anilistPop?.Page?.media) {
          for (const m of anilistPop.Page.media.slice(0, 8)) {
            if (!m.isAdult) {
              const internal = anilistToInternal(m);
              anilistItems.push({
                id: `anilist-pop-${m.id}`,
                title: internal.title,
                poster: internal.poster,
                type: 'Anime',
                score: internal.score,
                year: String(internal.year),
                certification: internal.rating,
                duration: internal.duration,
                genres: internal.genres,
                synopsis: internal.description || 'No description available.',
                studio: internal.studio,
                mal_id: internal.mal_id,
                anilist_id: m.id,
              });
            }
          }
        }

        // Interleave: Anime first, then TMDB, alternating
        // Pattern: Anime, TMDB Movie, Anime, TMDB TV, repeat...
        const merged = [];
        let tmdbIdx = 0, anilistIdx = 0;
        
        while ((tmdbIdx < tmdbItems.length || anilistIdx < anilistItems.length) && merged.length < 13) {
          // Start with Anime on odd positions
          if (anilistIdx < anilistItems.length && (merged.length % 2 === 0)) {
            merged.push(anilistItems[anilistIdx++]);
          } else if (tmdbIdx < tmdbItems.length) {
            merged.push(tmdbItems[tmdbIdx++]);
          } else if (anilistIdx < anilistItems.length) {
            // If TMDB exhausted, add remaining anime
            merged.push(anilistItems[anilistIdx++]);
          }

        const data = dedupById(merged, 'id').slice(0, 13);
