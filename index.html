              mal_id: malId,
              title: n.title,
              poster: n.poster,
              type: n.type === 'MOVIE' ? 'Anime' : (n.type || 'Anime'),
              year: String(n.year),
              score: n.score,
              quality: 'HD'
            };
          });
          anilistItems = resolved.filter(Boolean);
        }

        if (requestId !== _completedRequestId) return;

        // Create items arrays - take enough to fill 6 rows
        // FILTER: Remove items without valid poster!
        const tmdbTvItems = allTmdbTv
          .filter(i => i.poster_path && i.poster_path !== 'null' && i.poster_path !== 'undefined')
          .map(i=>({
            id:`tmdb-comp-${i.id}`,tmdb_id:i.id,title:i.name,poster:tmdbImg(i.poster_path),
            type:'TV',year:(i.first_air_date||'').slice(0,4),
            score:(i.vote_average||0).toFixed(1),quality:'HD'
          }))
          .slice(0, TARGET_SHOWS);

        const tmdbMovieItems = allTmdbMovies
          .filter(i => i.poster_path && i.poster_path !== 'null' && i.poster_path !== 'undefined')
          .map(i=>({
            id:`tmdb-movie-comp-${i.id}`,tmdb_id:i.id,title:i.title,poster:tmdbImg(i.poster_path),
            type:'Movie',year:(i.release_date||'').slice(0,4),
            score:(i.vote_average||0).toFixed(1),quality:'HD'
          }))
          .slice(0, TARGET_SHOWS);

        // Also filter Anilist completed anime without posters
        const anilistItemsFiltered = anilistItems.filter(a =>
          a.poster && a.poster !== '' && a.poster !== 'null' && a.poster !== 'undefined'
        );

        // ── Equal distribution of anime / TV / movies across pages 1 and 2 ──
        // When using the DB endpoint (rcHasDb), split the combined pool so
        // page 1 gets the FIRST half and page 2 gets the SECOND half. This
        // spreads anime+TV+movies evenly across both pages instead of page 1
        // holding everything and page 2 being nearly empty. Page 3+ keeps
        // using the live API calls (which paginate naturally).
        let poolAnime = anilistItemsFiltered;
        let poolTv = tmdbTvItems;
        let poolMovie = tmdbMovieItems;
        if (rcHasDb && (page === 1 || page === 2)) {
          const half = (arr) => {
            const mid = Math.floor(arr.length / 2);
            return page === 1 ? arr.slice(0, mid) : arr.slice(mid);
          };
          poolAnime = half(poolAnime);
          poolTv = half(poolTv);
          poolMovie = half(poolMovie);
        }
        // Interleave in [Anime][TV][Movie] ratio, repeating.
        const interleaved = [];
        const maxLen = Math.max(poolAnime.length, poolTv.length, poolMovie.length);
        for (let i = 0; i < maxLen; i++) {
          if (i < poolAnime.length) interleaved.push(poolAnime[i]);
          if (i < poolTv.length)    interleaved.push(poolTv[i]);
          if (i < poolMovie.length) interleaved.push(poolMovie[i]);
        }
        // Cross-source dedup by id (anime + TV + movies)
        const _seenRC = new Set();
        const dedupedInterleaved = interleaved.filter(s => {
          if (!s.id || _seenRC.has(s.id)) return false;
          _seenRC.add(s.id);
          return true;
        });
        // Cache the full pool so a resize can re-trim instantly without refetching.
        _completedPool = dedupedInterleaved;
        // Render exactly 10 complete rows (no incomplete last row, ever).
        const list = completedFullRows();
        document.getElementById('completedGrid').innerHTML = list.map(s => renderCompletedCard(s)).join('');
        renderPagination(page, false);
      }
      function renderPagination(page, isLoading=false) {
        const total = 10; // Max 10 pages of recently completed anime
        const nav = document.getElementById('completedPagination');
        
        // Responsive: Desktop shows 6 pages, Mobile shows 4 pages
        const isMobile = window.innerWidth <= 768;
        const visiblePages = isMobile ? 4 : 6;
        
        let html = `<button ${(page===1||isLoading)?'disabled':''} id="compPrev">Previous</button><div style="display:flex;gap:4px;flex-wrap:wrap;">`;
        
        // Calculate visible range centered on current page
        const halfRange = Math.floor(visiblePages / 2);
        let start = Math.max(1, page - halfRange);
        let end = Math.min(total, start + visiblePages - 1);
        
        // Adjust start if we're near the end
        if (end - start + 1 < visiblePages) {
          start = Math.max(1, end - visiblePages + 1);
        }
        
        for (let i=start; i<=end; i++) {
          html += `<button class="${i===page?'active':''}" data-page="${i}" ${isLoading?'disabled':''}>${i}</button>`;
        }
        html += `</div><button ${(page>=total||isLoading)?'disabled':''} id="compNext">Next</button>`;
        nav.innerHTML = html;
        nav.classList.toggle('pagination-loading', isLoading);
        if (isLoading) return; // buttons are disabled; skip attaching new handlers until data lands
        document.getElementById('compPrev')?.addEventListener('click', ()=>loadCompleted(page-1));
        document.getElementById('compNext')?.addEventListener('click', ()=>loadCompleted(page+1));
        nav.querySelectorAll('button[data-page]').forEach(b => {
          b.addEventListener('click', ()=>loadCompleted(parseInt(b.dataset.page)));
        });
      }

      // Re-trim + re-render instantly (no refetch) whenever a column
      // breakpoint changes, so the grid always ends on a complete row —
      // even mid-session window resizes.
      let _completedCols = calcCompletedCols();
      window.addEventListener('resize', () => {
        const cols = calcCompletedCols();
        if (cols === _completedCols) return;
        _completedCols = cols;
        if (_completedPool.length > 0) {
          document.getElementById('completedGrid').innerHTML =
            completedFullRows().map(s => renderCompletedCard(s)).join('');
        } else {
          renderCompletedSkeleton(cols * completedRowsForViewport());
        }
      });

      /* ── SHARED CARD RENDERERS ── */
      function renderCompletedCard(s) {
        // Check if poster is valid (not empty, not undefined)
        const hasPoster = s.poster && s.poster !== '' && s.poster !== 'null' && s.poster !== 'undefined';
        const posterStyle = hasPoster ? `background-image:url('${s.poster}');` : 'background:linear-gradient(135deg, #1e293b 0%, #334155 100%);';
        const noImageClass = hasPoster ? '' : 'no-image';
        return `<div class="show-card-grid" style="position:relative;">
          <a href="${infoUrl(s)}" class="show-card-grid" style="position:static;">
            <div class="card-poster ${noImageClass}" style="${posterStyle}">
              <span class="quality-badge">${s.quality||'HD'}</span>
              <div class="play-overlay"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg></div>
            </div>
            <div class="card-info-grid">
              <div class="card-meta-sm">${s.type} · ${s.year||'?'} · <i class="fas fa-star"></i> ${s.score}</div>
              <div class="card-title">${s.title}</div>
            </div>
          </a>
          ${generateCardButtons(s, { compact: true, showBookmark: false, showDetails: false })}
        </div>`;
      }
      function renderShowCard(s) {
        // Trending-only card with expanded inline metadata.
        // Format: ★score · Type · format? · 🔥popularity  (single line, side-by-side)
        // - Anime: format = TV/Movie/OVA/ONA/Special
        // - TMDB TV: format = 'TV-Series'
        // - TMDB Movie: NO format field (skipped entirely)
        // - Popularity uses a fire icon instead of the abbreviated 'Pop' text.
        // Falls back to the simple "★score · type" line when no extra fields.
        const starHtml = '<i class="fas fa-star" style="color:var(--star-icon-color)"></i>';
        const fireHtml = '<i class="fas fa-fire" style="color:var(--fire-icon-color)"></i>';
        const scoreStr = (s.score !== undefined && s.score !== null && s.score !== '')
          ? String(s.score) : 'N/A';
        const parts = [`${starHtml} ${scoreStr}`, s.type || ''];
        // format field: anime (TV/Movie/OVA/...) or TMDB TV ('TV-Series').
        // TMDB movies intentionally have NO format field — skip it.
        if (s.type === 'Anime' && s.format) parts.push(s.format);
        else if (s.type === 'TV' && s.format) parts.push(s.format);
        // Popularity (anime + TMDB) — show as fire icon + rounded number
        if (s.popularity) {
          const popNum = Math.round(Number(s.popularity) || 0);
          if (popNum > 0) parts.push(`${fireHtml} ${popNum}`);
        }
        const metaLine = parts.filter(Boolean).join(' · ');
        return `<div class="sidebar-list-item" style="position:relative;">
          <a href="${infoUrl(s)}" class="sidebar-list-item" style="position:static;" onmouseenter="showPopup(event,'${s.id}')" onmouseleave="_onCardLeave()">
            <span class="sidebar-rank">${s.rank||''}</span>
            <img class="sidebar-poster" src="${s.poster}" onerror="this.style.display='none'">
            <div class="sidebar-info"><h4>${s.title}</h4><div class="side-meta">${metaLine}</div></div>
          </a>
          ${generateCardButtons(s, { compact: true, showBookmark: false, showDetails: false })}
        </div>`;
      }

      /* ── TRENDING ── */
      let trendingData=[];
      let _trendingCache = {};
      async function loadTrending(period='today') {
        const periodKey = period === 'today' ? 'day' : period;
        if (_trendingCache[periodKey] && _trendingCache[periodKey].length) {
          trendingData = _trendingCache[periodKey];
          trendingData.forEach((item, i) => item.rank = i + 1);
          const el = document.getElementById('trendingList');
          if (el) el.innerHTML = trendingData.map(s => renderShowCard(s)).join('');
          return;
        }

        // DAILY: /api/trending-now endpoint (mixed anime+TV+movies pool)
        // WEEK / MONTH: server-side cached live TMDB/AniList calls at
        //   /api/trending-cache/<period> (12h TTL, shared across all users
        //   globally — no per-user localStorage).
        if (period === 'today') {
          await _loadTrendingDaily();
        } else {
          await _loadTrendingFromServerCache(period);
        }
        _trendingCache[periodKey] = trendingData;
        trendingData.forEach((item, i) => item.rank = i + 1);
        document.getElementById('trendingList').innerHTML = trendingData.map(s => renderShowCard(s)).join('');
      }

      // ── Daily: pull from /api/trending-now, distribute 7/7/7 ──
      async function _loadTrendingDaily() {
        const dbTN = await window.getHomeData('trending_now');
        const TRENDING_PER_TYPE = 7; // 7 anime + 7 TV + 7 movies = 21

        // ── Anime ── (V4.8.0: AniList OR Jikan v4 items; ranked by score+popularity+favourites)
        const tnAnimeRaw = dbAnimeList(dbTN);
        const tnAnime = tnAnimeRaw
          .map(m => {
            const n = normalizeAnimeItem(m);
            if (!n || n.isAdult) return null;
            return {
              id: n.source === 'jikan' ? `jikan-tr-${n.mal_id}` : `anilist-tr-${n.anilist_id ?? n.mal_id}`,
              mal_id: n.mal_id,
              anilist_id: n.anilist_id,
              title: n.title,
              poster: n.poster,
              type: 'Anime',
              score: Number(n.score) || 0,
              averageScore: n.source === 'jikan' ? (Number(m.score) || 0) * 10 : (m.averageScore || 0),
              meanScore: n.source === 'jikan' ? (Number(m.score) || 0) * 10 : (m.meanScore || 0),
              popularity: n.source === 'jikan' ? (m.members || m.popularity || 0) : (m.popularity || 0),
              favourites: n.source === 'jikan' ? (m.favorites || 0) : (m.favourites || 0),
              format: n.source === 'jikan' ? (m.type || 'TV') : (m.format || 'TV'),  // anime: TV / Movie / OVA / ONA / Special
              season: n.source === 'jikan' ? (m.season ? String(m.season).toUpperCase() : null) : (m.season || null),
              genres: n.genres || [],
              synopsis: n.description || '',
              release_date: `${n.year && n.year !== '?' ? n.year : ''}`
            };
          })
          .filter(Boolean)
          .sort((a, b) => {
            const sa = (a.averageScore || 0) + (a.popularity / 1000) + (a.favourites / 100);
            const sb = (b.averageScore || 0) + (b.popularity / 1000) + (b.favourites / 100);
            return sb - sa;
          })
          .slice(0, TRENDING_PER_TYPE);

        // ── TMDB TV + Movies ──
        // V4.8.0: the endpoint returns tmdb_tv / tmdb_movie (snake_case,
        // page-keyed objects) — the old tmdbTV/tmdbMovie lookups never matched,
        // so TV shows and movies silently disappeared from this section.
        const tnTvRaw = getTmdbArr(dbTN, 'tv');
        const tnMvRaw = getTmdbArr(dbTN, 'movie');
        const realTvItems = tnTvRaw.filter(i => i.poster_path && (
          i.media_type === 'tv' || (!i.media_type && (i.name || i.first_air_date))
        ));
        const strayMoviesFromTv = tnTvRaw.filter(i => i.poster_path && i.media_type === 'movie');

        const tnTv = realTvItems
          .map(i => ({
            id: `tmdb-tr-tv-${i.id}`,
            tmdb_id: i.id,
            title: i.name || i.original_name || i.title || 'Unknown',
            poster: tmdbImg(i.poster_path, 'w185'),
            type: 'TV',
            score: Number(i.vote_average) || 0,
            averageScore: (Number(i.vote_average) || 0) * 10,
            meanScore: 0,
            popularity: i.popularity || 0,
            favourites: i.vote_count || 0,
            format: 'TV-Series',                 // TMDB TV: always "TV-Series"
            season: null,
            genres: (i.genre_ids || []).map(id => GENRE_MAP[id] || id),
            overview: i.overview || '',
            release_date: i.first_air_date || i.release_date || ''
          }))
          .sort((a, b) => {
            const sa = (a.score || 0) + (a.popularity / 100) + (a.favourites / 1000);
            const sb = (b.score || 0) + (b.popularity / 100) + (b.favourites / 1000);
            return sb - sa;
          })
          .slice(0, TRENDING_PER_TYPE);

        // ── TMDB Movies ── (combine tmdbMovie + stray movies from tmdbTV, deduped)
        const _seenMvIds = new Set();
        const allMovieItems = [...tnMvRaw, ...strayMoviesFromTv].filter(i => {
          if (!i.poster_path) return false;
          if (_seenMvIds.has(i.id)) return false;
          _seenMvIds.add(i.id);
          return true;
        });
        const tnMv = allMovieItems
          .map(i => ({
            id: `tmdb-tr-mv-${i.id}`,
            tmdb_id: i.id,
            title: i.title || i.original_title || i.name || 'Unknown',
            poster: tmdbImg(i.poster_path, 'w185'),
            type: 'Movie',
            score: Number(i.vote_average) || 0,
            averageScore: (Number(i.vote_average) || 0) * 10,
            meanScore: 0,
            popularity: i.popularity || 0,
            favourites: i.vote_count || 0,
            format: null,                        // TMDB movies: NO format field
            season: null,
            genres: (i.genre_ids || []).map(id => GENRE_MAP[id] || id),
            overview: i.overview || '',
            release_date: i.release_date || ''
          }))
          .sort((a, b) => {
            const sa = (a.score || 0) + (a.popularity / 100) + (a.favourites / 1000);
            const sb = (b.score || 0) + (b.popularity / 100) + (b.favourites / 1000);
            return sb - sa;
          })
          .slice(0, TRENDING_PER_TYPE);

        // Cross-source dedup by id (anime + TV + movies)
        const _seenTr = new Set();
        trendingData = [...tnAnime, ...tnTv, ...tnMv].filter(s => {
          if (!s.id || _seenTr.has(s.id)) return false;
          _seenTr.add(s.id);
          return true;
        });
      }

      // ── Week / Month: pull from server-side cache endpoint ──
      // The serverless function at /api/trending-cache/<period> fetches
      // TMDB /trending/all/<day|week> + AniList trending, normalizes to the
      // same shape _loadTrendingDaily produces, and caches the JSON for
      // 12 hours server-side. All users globally see the same cached data
      // until the TTL expires — no per-user localStorage involved.
      async function _loadTrendingFromServerCache(period) {
        try {
          const res = await fetch(`/api/trending-cache/${period}`, { cache: 'no-store' });
          if (!res.ok) {
            console.warn(`[Trending] /api/trending-cache/${period} returned ${res.status}`);
            trendingData = [];
            return;
          }
          const json = await res.json();
          // The server returns a flat array of items already in the
          // internal card shape (id/title/poster/type/score/format/...).
          trendingData = Array.isArray(json?.items) ? json.items : [];
        } catch (e) {
          console.warn(`[Trending] server cache fetch failed for ${period}:`, e.message);
          trendingData = [];
        }
      }
      document.getElementById('trendingTabs').addEventListener('click', e => {
        if(e.target.classList.contains('toggle-tab')) {
          document.querySelectorAll('#trendingTabs .toggle-tab').forEach(t=>t.classList.remove('active'));
          e.target.classList.add('active');
          
          // Move glider to active tab
          moveGlider('trendingTabs', 'trendingGlider', e.target);
          
          loadTrending(e.target.dataset.period);
        }
      });

      /* ── POPULAR (sidebar) — Mix of TMDB + AniList popular ── */
      let popularData = [];
      const POPULAR_MAX_ITEMS = 14; // V4.8.0: mixed total must be within 14
      async function loadPopular() {
        // PRIMARY: /api/most-favourite — combined filter ranks by
        // (score + meanScore + popularity + favourites) for anime and
        // (vote_average + vote_count + popularity) for TMDB. Pick top 14
        // mixed (anime + TV + movies) from the ranked pool.
        // V4.8.0: anime may be AniList OR Jikan v4; tmdb_tv/tmdb_movie are
        // snake_case page-keyed objects.
        const dbMF = await window.getHomeData('most_favourite');

        // ── Anime ── (filter: averageScore + meanScore + popularity + favourites)
        const mfAnimeRaw = dbAnimeList(dbMF);
        const mfAnime = mfAnimeRaw
          .map(m => {
            const n = normalizeAnimeItem(m);
            if (!n || n.isAdult) return null;
            const avg = n.source === 'jikan' ? (Number(m.score) || 0) * 10 : (m.averageScore || 0);
            const mean = n.source === 'jikan' ? (Number(m.score) || 0) * 10 : (m.meanScore || 0);
            const pop = n.source === 'jikan' ? (m.members || m.popularity || 0) : (m.popularity || 0);
            const fav = n.source === 'jikan' ? (m.favorites || 0) : (m.favourites || 0);
            const rankScore = avg + mean + pop / 100 + fav / 10;
            return {
              id: n.source === 'jikan' ? `jikan-pop-${n.mal_id}` : `anilist-pop-${n.anilist_id ?? n.mal_id}`,
              title: n.title,
              poster: n.poster,
              type: 'Anime',
              score: n.score,
              year: String(n.year && n.year !== '?' ? n.year : '—'),
              certification: n.rating,
              duration: n.duration,
              genres: n.genres,
              synopsis: n.description || 'No description available.',
              studio: n.studio,
              mal_id: n.mal_id,
              anilist_id: n.anilist_id,
              _rank: rankScore
            };
          })
          .filter(Boolean)
          .sort((a, b) => b._rank - a._rank);

        // ── TMDB TV ── (filter: vote_average + vote_count + popularity)
        const mfTvRaw = getTmdbArr(dbMF, 'tv');
        const mfTv = mfTvRaw
          .filter(i => i.poster_path)
          .map(i => {
            const rankScore =
              (Number(i.vote_average) || 0) * 10 +
              (Number(i.vote_count) || 0) / 100 +
              (Number(i.popularity) || 0) / 10;
            return {
              id: `tmdb-tvpop-${i.id}`,
              tmdb_id: i.id,
              title: i.name || 'Unknown',
              poster: tmdbImg(i.poster_path, 'w185'),
              type: 'TV',
              score: i.vote_average ? Number(i.vote_average).toFixed(1) : 'N/A',
              year: (i.first_air_date || '').slice(0, 4) || '—',
              certification: 'TV-14',
              duration: '—',
              genres: (i.genre_ids || []).map(id => GENRE_MAP[id]).filter(Boolean),
              synopsis: i.overview || 'No description available.',
              studio: (i.networks || [])?.[0]?.name || '—',
              _rank: rankScore
            };
          })
          .sort((a, b) => b._rank - a._rank);

        // ── TMDB Movies ── (filter: vote_average + vote_count + popularity)
        const mfMvRaw = getTmdbArr(dbMF, 'movie');
        const mfMv = mfMvRaw
          .filter(i => i.poster_path)
          .map(i => {
            const rankScore =
              (Number(i.vote_average) || 0) * 10 +
              (Number(i.vote_count) || 0) / 100 +
              (Number(i.popularity) || 0) / 10;
            return {
              id: `tmdb-pop-${i.id}`,
              tmdb_id: i.id,
              title: i.title || 'Unknown',
              poster: tmdbImg(i.poster_path, 'w185'),
              type: 'Movie',
              score: i.vote_average ? Number(i.vote_average).toFixed(1) : 'N/A',
              year: (i.release_date || '').slice(0, 4) || '—',
              certification: i.adult ? '18+' : 'PG-13',
              duration: i.runtime ? `${i.runtime} min` : '—',
              genres: (i.genre_ids || []).map(id => GENRE_MAP[id]).filter(Boolean),
              synopsis: i.overview || 'No description available.',
              studio: '—',
              _rank: rankScore
            };
          })
          .sort((a, b) => b._rank - a._rank);

        // ── Interleave: Anime, TV, Movie, Anime, TV, Movie… until 14 ──
        const merged = [];
        const maxLen = Math.max(mfAnime.length, mfTv.length, mfMv.length);
        for (let i = 0; i < maxLen && merged.length < POPULAR_MAX_ITEMS; i++) {
          if (i < mfAnime.length && merged.length < POPULAR_MAX_ITEMS) merged.push(mfAnime[i]);
          if (i < mfTv.length && merged.length < POPULAR_MAX_ITEMS)    merged.push(mfTv[i]);
          if (i < mfMv.length && merged.length < POPULAR_MAX_ITEMS)    merged.push(mfMv[i]);
        }

        // Cross-source dedup by id (anime + TV + movies)
        const data = dedupById(merged, 'id').slice(0, POPULAR_MAX_ITEMS);
        data.forEach((item, i) => item.rank = i + 1);
        popularData = data;

        document.getElementById('popularList').innerHTML = data.map(s => `
          <a href="${infoUrl(s)}" class="sidebar-list-item" onmouseenter="showPopup(event,'${s.id}')" onmouseleave="_onCardLeave()">
            <span class="sidebar-rank">${s.rank}</span>
            <img class="sidebar-poster" src="${s.poster}" onerror="this.style.display='none'">
            <div class="sidebar-info">
              <h4>${s.title}</h4>
              <div class="side-meta">
                <i class="fas fa-star" style="color:var(--star-icon-color)"></i> ${s.score}
                &nbsp;·&nbsp;${s.type}
                &nbsp;·&nbsp;${s.year}
              </div>
            </div>
          </a>`).join('');
      }

      /* ── POPUP (FIXED) - Anchored Anti-flicker System (Netflix/Anikoto style) ── */
     
     // Advanced popup state management with card-anchored positioning
     // This positions popup NEXT to the hovered card, not centered on screen!
     window._popupManager = {
       // State
       isVisible: false,
       currentId: null,          // Currently displayed item ID
       hideTimer: null,
       showTimer: null,
       anchorEl: null,           // The card element we're anchored to
       mouseX: 0,                // Track mouse position for gap detection
       mouseY: 0,
       lastMoveDate: 0,          // For detecting mouse movement
       
       // Timing config (tuned for anchored popup with mouse tracking)
       SHOW_DELAY: 80,           // Very small delay before showing (prevents flicker)
       HIDE_DELAY: 500,          // Generous delay - we have mouse tracking now
       POPUP_WIDTH: 340,         // Match CSS width
       MARGIN: 10,               // Gap between card and popup
       GAP_BRIDGE: 50,           // Extra pixels of \"invisible bridge\" toward card
       
       // Initialize
       init: function() {
         this.setupPopupEvents();
         // Track mouse position globally for gap detection
         document.addEventListener('mousemove', (e) => {
           this.mouseX = e.clientX;
           this.mouseY = e.clientY;
           this.lastMoveDate = Date.now();
         }, { passive: true });
         // Reposition on scroll/resize if visible
         window.addEventListener('scroll', () => { if (this.isVisible) this.position(); }, { passive: true });
         window.addEventListener('resize', () => { if (this.isVisible) this.position(); }, { passive: true });
       },
       
       // Setup popup container events
       setupPopupEvents: function() {
         const popup = document.getElementById('popupCard');
         const overlay = document.getElementById('popupOverlay');
         
         if (popup) {
           // Keep alive when hovering over popup itself
           popup.addEventListener('mouseenter', () => {
             this.cancelHide();
             this.isVisible = true;
           });
           
           // Schedule hide when leaving popup
           popup.addEventListener('mouseleave', () => {
             this.scheduleHide();
           });
         }
         
         if (overlay) {
           overlay.addEventListener('click', (e) => {
             if (e.target === overlay) this.hideImmediately();
           });
         }
         
         const closeBtn = document.getElementById('popupClose');
         if (closeBtn) {
           closeBtn.addEventListener('click', () => this.hideImmediately());
         }
       },
       
       // Show popup with anchor element for positioning
       requestShow: function(id, anchorEl) {
         this.cancelHide();
         
         // Store anchor element for positioning
         if (anchorEl) {
           this.anchorEl = anchorEl;
         }
         
         // If same ID already showing, just reposition and keep alive
         if (this.currentId === id && this.isVisible) {
           this.position();
           return;
         }
         
         // Cancel any pending show
         if (this.showTimer) {
           clearTimeout(this.showTimer);
           this.showTimer = null;
         }
         
         // Schedule show with small delay (prevents flicker on fast mouse movement)
         this.showTimer = setTimeout(() => {
           this.doShow(id);
         }, this.SHOW_DELAY);
       },
       
       // Actually show the popup
       doShow: function(id) {
         this.currentId = id;
         this.isVisible = true;
         
         const popup = document.getElementById('popupCard');
         const overlay = document.getElementById('popupOverlay');
         
         if (popup) popup.classList.add('active');
         if (overlay) overlay.style.pointerEvents = 'auto';
         
         // Position next to the anchor element
         this.position();
       },
       
       // Position popup relative to anchor element (the key fix!)
       position: function() {
         const popup = document.getElementById('popupCard');
         if (!popup || !this.anchorEl) return;
         
         const rect = this.anchorEl.getBoundingClientRect();
         const pw = this.POPUP_WIDTH;
         const ph = popup.offsetHeight || 300; // Estimate height if not rendered yet
         const margin = this.MARGIN;
         
         // Default: position to the right of the card
         let left = rect.right + margin;
         let top = rect.top;
         
         // FLIP: If it would overflow the right edge, position to the left instead
         if (left + pw > window.innerWidth - margin) {
           left = rect.left - pw - margin;
         }
         
         // Clamp so it never goes off the left edge either
         if (left < margin) {
           left = Math.max(margin, rect.right + margin);
         }
         
         // VERTICAL: Clamp within viewport bounds
         if (top + ph > window.innerHeight - margin) {
           top = window.innerHeight - ph - margin;
         }
         if (top < margin) {
           top = margin;
         }
         
         // Apply position
         popup.style.left = left + 'px';
         popup.style.top = top + 'px';
       },
       
       // Check if mouse is in the "bridge zone" between card and popup
      isInBridgeZone: function() {
        const popup = document.getElementById('popupCard');
        if (!popup || !this.anchorEl || !this.isVisible) return false;
        
        const cardRect = this.anchorEl.getBoundingClientRect();
        const popupRect = popup.getBoundingClientRect();
        const mx = this.mouseX;
        const my = this.mouseY;
        
        // Create an expanded rectangle that bridges card and popup
        const bridgeLeft = Math.min(cardRect.left, popupRect.left) - this.GAP_BRIDGE;
        const bridgeRight = Math.max(cardRect.right, popupRect.right) + this.GAP_BRIDGE;
        const bridgeTop = Math.min(cardRect.top, popupRect.top) - this.GAP_BRIDGE;
        const bridgeBottom = Math.max(cardRect.bottom, popupRect.bottom) + this.GAP_BRIDGE;
        
        return mx >= bridgeLeft && mx <= bridgeRight && my >= bridgeTop && my <= bridgeBottom;
      },
      
      // Schedule hide with delay and mouse-position safety check
      scheduleHide: function() {
        this.cancelHide();
        
        const attemptHide = () => {
          // CRITICAL: Check if mouse is in bridge zone before hiding
          if (this.isInBridgeZone()) {
            // Mouse is still in the gap area - reschedule and check again
            this.hideTimer = setTimeout(attemptHide, 100);
            return;
          }
          if (!this.isVisible) return;
          this.hideImmediately();
        };
        
        this.hideTimer = setTimeout(attemptHide, this.HIDE_DELAY);
      },
       
       // Cancel pending hide
       cancelHide: function() {
         if (this.hideTimer) {
           clearTimeout(this.hideTimer);
           this.hideTimer = null;
         }
       },
       
       // Hide immediately (no delay)
       hideImmediately: function() {
         this.cancelHide();
         if (this.showTimer) {
           clearTimeout(this.showTimer);
           this.showTimer = null;
         }
         
         this.isVisible = false;
         this.currentId = null;
         this.anchorEl = null;  // Clear anchor
         
         const popup = document.getElementById('popupCard');
         const overlay = document.getElementById('popupOverlay');
         
         if (popup) {
           popup.classList.remove('active');
           // Reset position styles
           popup.style.left = '';
           popup.style.top = '';
         }
         if (overlay) overlay.style.pointerEvents = 'none';
       }
     };
     
     // Initialize popup manager
     window._popupManager.init();

      /* ── POPULAR ANIME (Miruro-style list, sorted by score+popularity+rank) ── */
      async function loadPopularAnime() {
        try {
          // PRIMARY: /api/popular-anime — pre-scored/sorted top-28 list.
          // No filtering or cut-out: show ALL anime returned by the endpoint.
          const dbPopular = (await window.getHomeData('popular_anime'))?.data;
          let top28;

          if (Array.isArray(dbPopular) && dbPopular.length > 0) {
            // Cross-source dedup by AniList id (safety net — endpoint data
            // is already unique, but this guards against any sync duplicates).
            const _seen = new Set();
            top28 = dbPopular.filter(m => {
              const k = m.id || m.idMal;
              if (!k || _seen.has(k)) return false;
              _seen.add(k);
              return true;
            }).slice(0, 28);
          } else {
            // FALLBACK: live AniList (only when endpoint is completely unavailable)
            const [anilistPop, anilistTop] = await Promise.all([
              fetchAniList(`
                query ($perPage: Int) {
                  Page(page: 1, perPage: $perPage) {
                    media(type: ANIME, isAdult: false, sort: [POPULARITY_DESC]) {
                      ${ANILIST_ANIME_FIELDS}
                    }
                  }
                }
              `, { perPage: 30 }),
              fetchAniList(`
                query ($perPage: Int) {
                  Page(page: 1, perPage: $perPage) {
                    media(type: ANIME, isAdult: false, sort: [SCORE_DESC]) {
                      ${ANILIST_ANIME_FIELDS}
                    }
                  }
                }
              `, { perPage: 25 })
            ]);

            const allMedia = [
              ...(anilistPop?.Page?.media || []),
              ...(anilistTop?.Page?.media || [])
            ];

            const seen = new Set();
            const unique = allMedia.filter(m => {
              if (seen.has(m.id)) return false;
              seen.add(m.id);
              return true;
            });

            const scored = unique.map(m => {
              const avgScore    = m.averageScore || 0;
              const popBonus    = m.popularity ? Math.min(100000 / m.popularity, 10) : 0;
              const trendBonus  = m.trending ? m.trending * 0.5 : 0;
              return { ...m, _w: avgScore * 0.7 + popBonus + trendBonus };
            });
            scored.sort((a, b) => b._w - a._w);
            top28 = scored.slice(0, 28);
          }

          const slugify = t => (t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

          const el = document.getElementById('popularAnimeList');
          if (!el) return;

          el.innerHTML = top28.map((m, idx) => {
            const internal = anilistToInternal(m);
            const rank     = idx + 1;
            const rankCls  = rank <= 3 ? ` rank-${rank}` : '';
            const title    = internal.title;
            const slug     = slugify(title);
            // Use mal_id for jikan format: /info/anime/jikan-{mal_id}/slug
            const malId = internal.mal_id || m.idMal || m.id;
            const href     = `/info/anime/jikan-${malId}/${slug}`;
            const poster   = internal.poster;
            const bgImg    = poster;
            const type     = internal.type || 'TV';
            const eps      = String(internal.episodes);
            const score    = internal.score;
            const studio   = internal.studio || '—';
            const genres   = internal.genres?.slice(0,4) || [];

            return `<a href="${href}" class="pa-row${rankCls}" style="--pa-bg:url('${bgImg}')">
              <span class="pa-rank">${rank}</span>
              <img class="pa-poster" src="${poster}" alt="${title.replace(/"/g,'&quot;')}" loading="lazy" onerror="this.style.opacity='0'">
              <div class="pa-info">
                <div class="pa-title">${title}</div>
                <div class="pa-meta">
                  <span class="pa-tag">${type}</span>
                  <span class="pa-tag"><i class="fas fa-play" style="font-size:.5rem"></i> ${eps} eps</span>
                  <span class="pa-score"><i class="fas fa-star"></i> ${score}</span>
                  ${studio !== '—' ? `<span class="pa-tag">${studio}</span>` : ''}
                  ${genres.map(g=>`<span class="pa-tag">${g}</span>`).join('')}
                </div>
              </div>
            </a>`;
          }).join('');
          
          // Save to DB — 5h TTL
        } catch(err) {
          console.warn('[loadPopularAnime] failed:', err);
        }
      }

            <!-- Title section below poster - matches .aniocean-title-section exactly -->
            <div class="aniocean-title-section">
              <!-- Meta line placeholder (type · rating) -->
              <div class="skeleton sk-line w60" style="height:10px;margin-bottom:7px;"></div>

      /* ════════════════════════════════════════════════════════════
         SCHEDULE SECTION - REBUILT (Self-hosted Jikan API)
         Features: Parallel fetch, Week nav, 5-month limit, Show More
         ════════════════════════════════════════════════════════════ */
      
      // Configuration
      const JIKAN_SCHEDULE_BASE = 'https://jikan-api-bohb.onrender.com/v4/schedule';
      const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      const DAY_FULL_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      
      let scheduleData = null;           // { monday: [anime], tuesday: [...], ... }
      let currentDay = null;             // 'monday' ... 'sunday'
      let currentWeekOffset = 0;         // weeks from today's week start
      const MAX_WEEK_OFFSET = 20;        // ~5 months limit (20 weeks)
      const VISIBLE_COUNT = 9;           // Show 9 animes per day initially

      // ---------- Helper: Fetch single day from self-hosted Jikan ----------
      async function fetchDayFromJikan(day) {
        try {
          const url = `${JIKAN_SCHEDULE_BASE}/${day}?sfw=true`;
          console.log(`[Schedule] Fetching: ${url}`);
          
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000); // 12s timeout
          
          const res = await fetch(url, { 
            signal: controller.signal,
            headers: { 'Accept': 'application/json' }
          });
          
          clearTimeout(timeoutId);
          
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          
          const data = await res.json();
          const animeList = data.data || [];
          
          console.log(`[Schedule] ✅ ${day}: ${animeList.length} anime`);
          return animeList;
          
        } catch (err) {
          console.warn(`[Schedule] ⚠️ Failed to fetch ${day}:`, err.message);
          return [];
        }
      }

      // ---------- Helper: Fetch ALL 7 days in parallel (rate-limit safe) ----------
      async function fetchAllDaysParallel() {
        // DB (Neon ani_schedule, one endpoint per day) first — each day is
        // already Jikan-shaped, so it drops straight into the existing
        // renderer. Falls back to the live self-hosted Jikan schedule for
        // any day the DB doesn't have data for (e.g. still syncing).
        // All 7 requests hit the SAME server-side cached column fetch
        // (see api/ani-schedule/[day].js), so this is one real DB query
        // shared across all 7 days, not 7 separate ones.
        console.log('[Schedule] 🚀 Starting parallel fetch of all 7 days...');

        const dbResults = await Promise.allSettled(DAYS.map(day => window.getAniScheduleDay(day)));
        const dbByDay = {};
        DAYS.forEach((day, idx) => {
          const r = dbResults[idx];
          const arr = r.status === 'fulfilled' ? r.value?.data : null;
          if (Array.isArray(arr) && arr.length > 0) {
            // Cross-source dedup by mal_id (safety net for sync duplicates)
            const _seen = new Set();
            dbByDay[day] = arr.filter(a => {
              const k = a.mal_id || a.id;
              if (!k || _seen.has(k)) return false;
              _seen.add(k);
              return true;
            });
          }
        });

        const missingDays = DAYS.filter(day => !dbByDay[day]);

        const jikanResults = missingDays.length
          ? await Promise.allSettled(missingDays.map(day => fetchDayFromJikan(day)))
          : [];

        const data = {};
        let missingIdx = 0;
        DAYS.forEach((day) => {
          if (dbByDay[day]) {
            data[day] = dbByDay[day];
          } else {
            const result = jikanResults[missingIdx++];
            // Also dedup Jikan fallback results
            const raw = result && result.status === 'fulfilled' ? result.value : [];
            const _seen = new Set();
            data[day] = raw.filter(a => {
              const k = a.mal_id || a.id;
              if (!k || _seen.has(k)) return false;
              _seen.add(k);
              return true;
            });
          }
        });
        
        const totalAnime = Object.values(data).reduce((sum, arr) => sum + arr.length, 0);
        console.log(`[Schedule] ✅ Complete! Total: ${totalAnime} anime across 7 days`);
        
        return data;
      }

      // ---------- Enhanced Episode number calculation ----------
      function getEpisodeNumber(anime) {
        // If finished airing, show total episodes
        if (anime.status === 'Finished Airing') return anime.episodes || '?';
        
        const now = new Date();
        const firstAir = anime.aired?.from ? new Date(anime.aired.from) : null;
        
        // Method 1: Calculate from aired_from date (most reliable)
        if (firstAir && !isNaN(firstAir.getTime())) {
          const diffMs = now - firstAir;
          const daysPassed = Math.floor(diffMs / (24 * 60 * 60 * 1000));
          // Most anime air weekly, so estimate episode from weeks
          // Add grace period of 2 days for airing delays
          let episode = Math.floor((daysPassed + 2) / 7) + 1;
          // Cap at total episodes if known
          if (anime.episodes && episode > anime.episodes) {
            episode = anime.episodes;
          }
          // Don't show negative or zero
          if (episode < 1) episode = 1;
          // Only show if anime has started airing
          if (daysPassed >= -7) return episode;
        }
        
        // Method 2: Fallback to episodes count if available
        if (anime.episodes && anime.episodes > 0) {
          // Check if it's currently airing based on status
          if (anime.status === 'Currently Airing') {
            // Estimate: assume ~12-13 week seasons for ongoing
            const estimatedEp = Math.min(anime.episodes, 13);
            return `${estimatedEp}+`;
          }
          return anime.episodes;
        }
        
        // Method 3: Return TBA if we really can't determine
        return 'TBA';
      }

      // ---------- Render schedule for a given day (from scheduleData) ----------
      // ---------- Shared row builder for anime + sidebar TV rows ----------
      function buildScheduleRowHtml({ watchUrl, external, time, poster, title, subtitle, epLabel }) {
        const linkAttrs = external ? ' target="_blank" rel="noopener noreferrer"' : '';
        return `
            <a href="${watchUrl}" class="schedule-row"${linkAttrs}>
              <div class="schedule-time">${time}</div>
              <div class="schedule-poster">
                <img src="${poster}" alt="${escapeHtml(title)}" loading="lazy" 
                     onerror="this.parentElement.style.background='linear-gradient(135deg,#1e293b,#334155)';this.style.display='none';">
              </div>
              <div class="schedule-title-wrap">
                <div class="schedule-title">${escapeHtml(title)}</div>
                ${subtitle ? `<div class="schedule-subtitle">${escapeHtml(subtitle)}</div>` : ''}
              </div>
              <div class="schedule-ep">${epLabel}</div>
            </a>
          `;
      }

      // ---------- Format a Date as YYYY-MM-DD using LOCAL date parts
      //            (not toISOString, which shifts to UTC and can land on
      //            the wrong calendar day depending on timezone) ----------
      function formatDateYMD(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      async function renderScheduleForDay(dayName) {
        const container = document.getElementById('eswBody');
        const animeList = scheduleData?.[dayName] || [];

        // Brief loading state while we fetch this day's TV shows (anime data is
        // already in memory from fetchAllDaysParallel, only TV needs a fetch).
        container.innerHTML = '<div style="text-align:center;padding:24px 10px;color:var(--text-muted);font-size:0.75rem;">Loading…</div>';

        // Resolve the actual calendar date for this day-of-week within the
        // currently selected week (TVMaze needs a real date, unlike Jikan's
        // day-of-week-only schedule).
        const weekDates = buildWeekDates();
        const dateObj = weekDates[DAYS.indexOf(dayName)];
        const dateStr = formatDateYMD(dateObj);

        let tvResult = { shows: [], country: null };
        try {
          // V4.8.0 PRIMARY: server endpoint (multi-country, 24h server-side cache).
          tvResult = await fetchSidebarTVFromEndpoint(dayName, dateStr);
        } catch (e) {
          console.warn('[Sidebar-TVMaze] endpoint failed, falling back to direct TVMaze:', e.message);
          try {
            tvResult = await fetchSidebarTVShowsForDate(dateStr);
          } catch (e2) {
            console.warn('[Sidebar-TVMaze] Failed to fetch TV shows for', dateStr, e2.message);
          }
        }

        if (!animeList.length && !tvResult.shows.length) {
          container.innerHTML = `
            <div style="text-align:center;padding:30px 15px;color:var(--text-muted);">
              <i class="fas fa-calendar-times" style="font-size:2rem;opacity:0.3;margin-bottom:10px;display:block;"></i>
              <div style="font-size:0.85rem;">No episodes scheduled</div>
              <div style="font-size:0.7rem;opacity:0.6;margin-top:4px;">for ${DAY_FULL_NAMES[DAYS.indexOf(dayName)]}</div>
            </div>`;
          return;
        }

        // Build anime row objects
        const animeRows = animeList.map(anime => {
          const episode = getEpisodeNumber(anime);
          const title = anime.title_english || anime.title || 'Unknown Title';
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
          const watchUrl = `/info/anime/jikan-${anime.mal_id}/${slug}`;
          const poster = anime.images?.webp?.large_image_url || 
                         anime.images?.jpg?.large_image_url || 
                         anime.images?.jpg?.image_url || '';
          // Enhanced broadcast time handling - Jikan v4 returns STRING format
          // Format: "Mondays at 00:00 (JST)" or "Tuesdays at 18:30 (JST)"
          let broadcastTime = '—';
          const broadcast = anime.broadcast;
          if (typeof broadcast === 'string' && broadcast.trim()) {
            const timeMatch = broadcast.match(/(\d{1,2}):(\d{2})/);
            if (timeMatch) {
              const h = parseInt(timeMatch[1]).toString().padStart(2, '0');
              const m = timeMatch[2];
              broadcastTime = `${h}:${m}`;
            } else {
              const dayMatch = broadcast.match(/^(\w+)/);
              broadcastTime = dayMatch ? dayMatch[1].slice(0, 3) : '—';
            }
          } else if (broadcast && typeof broadcast === 'object') {
            if (broadcast.time) {
              const timeMatch = broadcast.time.match(/(\d{1,2}):(\d{2})/);
              if (timeMatch) {
                const h = parseInt(timeMatch[1]).toString().padStart(2, '0');
                const m = timeMatch[2];
                broadcastTime = `${h}:${m}`;
              } else {
                broadcastTime = broadcast.time;
              }
            } else if (broadcast.day) {
              broadcastTime = broadcast.day.slice(0, 3);
            }
          }

          return {
            sortKey: broadcastTime,
            html: buildScheduleRowHtml({
              watchUrl, external: false, time: broadcastTime, poster, title,
              subtitle: null, epLabel: `EP ${episode}`
            })
          };
        });

        // Build TV row objects (V4.8.0: shows come from the server endpoint —
        // already-normalized {name, poster, airtime, episode_number, country…} —
        // or, on fallback, raw TVMaze show objects with a nested _episode).
        const tvRows = tvResult.shows.map(show => {
          const isEndpointShape = show._episode === undefined;
          const ep = isEndpointShape
            ? { name: show.episode_name, season: show.season_number, number: show.episode_number, airtime: show.airtime, airstamp: show.airstamp }
            : (show._episode || {});
          const title = show.name || 'Unknown Title';
          const poster = isEndpointShape
            ? (show.poster || '')
            : (show.image?.medium || show.image?.original || '');
          const watchUrl = show.url || '#';
          const time = ep.airtime && ep.airtime.trim() ? ep.airtime : '—';
          const epLabel = (ep.number) ? `E${ep.number}` : 'TV';
          const countryTag = show._sourceCountry || show.country || tvResult.country || '';
          const subtitle = `TV · ${countryTag}`;

          return {
            sortKey: time,
            html: buildScheduleRowHtml({
              watchUrl, external: true, time, poster, title, subtitle, epLabel
            })
          };
        });

        // ── INTERLEAVE PATTERN: [Anime] [TVMaze] [Anime] [TVMaze] … ──
        // User-requested format: alternate between anime and TVMaze shows
        // instead of pure chronological sort. Within each type, still sort by time.
        const sortedAnime = [...animeRows].sort((a, b) => {
          const tA = a.sortKey && a.sortKey !== '—' ? a.sortKey : '99:99';
          const tB = b.sortKey && b.sortKey !== '—' ? b.sortKey : '99:99';
          return tA.localeCompare(tB);
        });
        const sortedTv = [...tvRows].sort((a, b) => {
          const tA = a.sortKey && a.sortKey !== '—' ? a.sortKey : '99:99';
          const tB = b.sortKey && b.sortKey !== '—' ? b.sortKey : '99:99';
          return tA.localeCompare(tB);
        });
        
        // Build [Anime][TV][Anime][TV]... alternating pattern
        const combinedRows = [];
        const maxLen = Math.max(sortedAnime.length, sortedTv.length);
        for (let i = 0; i < maxLen; i++) {
          if (sortedAnime[i]) combinedRows.push(sortedAnime[i]);
          if (sortedTv[i]) combinedRows.push(sortedTv[i]);
        }

        const rowsArray = combinedRows.map(r => r.html);
        const visibleRows = rowsArray.slice(0, VISIBLE_COUNT).join('');
        const hiddenRows = rowsArray.slice(VISIBLE_COUNT).join('');
        const hasMore = rowsArray.length > VISIBLE_COUNT;
        const remainingCount = rowsArray.length - VISIBLE_COUNT;

        container.innerHTML = `
          <div class="schedule-list">
            ${visibleRows}
            ${hasMore ? `<div class="schedule-more-wrapper" style="display:none;">${hiddenRows}</div>` : ''}
            ${hasMore ? `<button type="button" class="schedule-more-btn"><i class="fas fa-chevron-down"></i> Show More (${remainingCount} more)</button>` : ''}
          </div>
        `;

        // Attach enhanced show more handler
        const moreBtn = container.querySelector('.schedule-more-btn');
        if (moreBtn) {
          moreBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const wrapper = container.querySelector('.schedule-more-wrapper');
            if (wrapper) {
              const isHidden = wrapper.style.display === 'none';
              wrapper.style.display = isHidden ? 'block' : 'none';
              
              if (isHidden) {
                moreBtn.classList.add('expanded');
                moreBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Show Less';
              } else {
                moreBtn.classList.remove('expanded');
                moreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> Show More (${remainingCount} more)`;
              }
            }
          });
        }
      }
        

      // ---------- Build week dates (Mon-Sun) ----------
      function buildWeekDates() {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const currentDayOfWeek = today.getDay(); // 0 = Sunday
        let monday = new Date(today);
        const diffToMonday = (currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek);
        monday.setDate(today.getDate() + diffToMonday + currentWeekOffset * 7);
        
        const weekDates = [];
        for (let i = 0; i < 7; i++) {
          const date = new Date(monday);
          date.setDate(monday.getDate() + i);
          weekDates.push(date);
        }
        return weekDates;
      }
      
      // ---------- Get week label for navigation ----------
      function getWeekLabel(weekDates) {
        if (!weekDates || !weekDates.length) return 'This Week';
        const firstDate = weekDates[0];
        const lastDate = weekDates[6];
        
        const fmt = (d) => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        
        if (firstDate <= today && lastDate >= today) {
          return 'This Week';
        }
        return `${fmt(firstDate)} – ${fmt(lastDate)}`;
      }

      // ---------- Update day cards (Vertical Design) ----------
      function updateDaySelector() {
        const weekDates = buildWeekDates();
        const today = new Date();
        const todayStr = today.toDateString();
        const container = document.getElementById('eswDaysRow');
        
        // Update week label
        const weekLabelEl = document.getElementById('eswWeekLabel');
        if (weekLabelEl) weekLabelEl.textContent = getWeekLabel(weekDates);
        
        // Update nav buttons state
        const prevBtn = document.getElementById('eswPrev');
        const nextBtn = document.getElementById('eswNext');
        if (prevBtn) prevBtn.disabled = currentWeekOffset <= -MAX_WEEK_OFFSET;
        if (nextBtn) nextBtn.disabled = currentWeekOffset >= MAX_WEEK_OFFSET;
        
        // Render vertical day cards
        container.innerHTML = weekDates.map((date, idx) => {
          const isToday = date.toDateString() === todayStr;
          const dayIndex = date.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
          const dayKeyIdx = dayIndex === 0 ? 6 : dayIndex - 1; // Convert to Mon=0 index
          const isActive = currentDay === DAYS[dayKeyIdx];
          
          return `
            <div class="esw-day-card ${isToday ? 'today' : ''} ${isActive ? 'active' : ''}" 
                 data-day-index="${idx}" data-day-key="${DAYS[dayKeyIdx]}"
                 title="${DAY_FULL_NAMES[dayKeyIdx]}, ${MONTHS[date.getMonth()]} ${date.getDate()}">
              <span class="esw-dc-month">${MONTHS[date.getMonth()]}</span>
              <span class="esw-dc-day">${date.getDate()}</span>
              <span class="esw-dc-weekday">${DAY_FULL_NAMES[dayKeyIdx].slice(0, 3)}</span>
            </div>
          `;
        }).join('');
        
        // Add click handlers
        container.querySelectorAll('.esw-day-card').forEach(card => {
          card.addEventListener('click', (e) => {
            const dayKey = card.dataset.dayKey;
            if (dayKey) setCurrentDay(dayKey);
          });
        });
      }

      // ---------- Set current day, render ----------
      function setCurrentDay(dayKey) {
        currentDay = dayKey;
        updateDaySelector();
        renderScheduleForDay(currentDay);
      }

      // ---------- Main loader ----------
      async function loadSchedule() {
        // Show a loading indicator immediately so the user never sees
        // "No episodes scheduled" while we're still fetching.
        const loadingHtml = '<div style="text-align:center;padding:30px 10px;color:var(--text-muted);font-size:0.85rem;">'
          + '<div style="display:inline-block;width:24px;height:24px;border:2px solid rgba(255,255,255,.15);'
          + 'border-top-color:var(--btn-primary,#3b82f6);border-radius:50%;'
          + 'animation:schedSpin .8s linear infinite;margin-bottom:10px;"></div>'
          + '<div>Loading schedule…</div></div>';
        // Try to show loading state in the current day's container.
        const body0 = document.getElementById('eswBody');
        if (body0) body0.innerHTML = loadingHtml;

        console.log('[Schedule] 🚀 Fetching all 7 days in parallel...');
        scheduleData = await fetchAllDaysParallel();

        // Expose scheduleData globally for debugging
        window.scheduleData = scheduleData;

        // Determine current day (Monday‑Sunday)
        const now = new Date();
        let dayIndex = now.getDay(); // 0 = Sunday
        if (dayIndex === 0) dayIndex = 7;
        const currentDayKey = DAYS[dayIndex - 1];
        setCurrentDay(currentDayKey);
        updateClock();
        setInterval(updateClock, 1000);
      }

      // Week navigation (with 5-month limit)
      function previousWeek() {
        if (currentWeekOffset > -MAX_WEEK_OFFSET) {
          currentWeekOffset--;
          updateDaySelector();
          setCurrentDay(currentDay);
        }
      }
      function nextWeek() {
        if (currentWeekOffset < MAX_WEEK_OFFSET) {
          currentWeekOffset++;
          updateDaySelector();
          setCurrentDay(currentDay);
        }
      }

      function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US', {
    hour12: true,          // 12‑hour AM/PM format
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    timeZoneName: 'short'
  });
  document.getElementById('eswClockText').textContent = timeStr;
}
      document.getElementById('eswPrev').addEventListener('click', previousWeek);
      document.getElementById('eswNext').addEventListener('click', nextWeek);

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }
      

      /* ── SLIDING TAB GLIDER FUNCTIONALITY ── */
      function moveGlider(tabsContainerId, gliderId, activeTab) {
        const glider = document.getElementById(gliderId);
        if (!glider || !activeTab) return;
        
        // Calculate position and width
        const tabRect = activeTab.getBoundingClientRect();
        const tabsContainer = document.getElementById(tabsContainerId);
        const containerRect = tabsContainer.getBoundingClientRect();
        
        // Set glider width and position relative to container
        const leftOffset = tabRect.left - containerRect.left;
        glider.style.width = `${tabRect.width}px`;
        glider.style.transform = `translateX(${leftOffset}px)`;
      }
      
      // Initialize gliders on page load and resize
      function initGliders() {
        // Initialize Release Tabs glider
        const releaseActiveTab = document.querySelector('#releaseTabs .toggle-tab.active');
        if (releaseActiveTab) {
          moveGlider('releaseTabs', 'releaseGlider', releaseActiveTab);
        }
        
        // Initialize Trending Tabs glider
        const trendingActiveTab = document.querySelector('#trendingTabs .toggle-tab.active');
        if (trendingActiveTab) {
          moveGlider('trendingTabs', 'trendingGlider', trendingActiveTab);
        }
      }
      
      // Re-initialize on window resize (with debounce)
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(initGliders, 100);
      });

      function init() {
        console.log('═══════════════════════════════════════════════════════════');
        console.log('  🚀 Rowana Optimized Loading System v2.0');
        console.log('  • Scroll-based lazy loading enabled');
        console.log('  • API queue throttling (max 3 concurrent)');
        console.log('  • Automatic retry with exponential backoff');
        console.log('═══════════════════════════════════════════════════════════');
        
        // Step 1: Show skeletons immediately for instant visual feedback
        injectSkeletons();
        
        // Step 2: Initialize the lazy loader observer
        lazyLoader.init();
        
        // Step 3: Register sections with priority-based loading
        // ─── IMMEDIATE LOAD (Above fold / Critical) ──────────────
        lazyLoader.register('heroSlider', loadHero, { 
          immediate: true, 
          delay: 0,
          priority: 1 
        });
        
        // ─── PRIORITY LOAD (Visible after hero) ──────────────────
        lazyLoader.register('topAiringSection', loadTopAiring, { 
          immediate: true, 
          delay: 400,  // Start after hero begins loading
          priority: 2 
        });
        
        // ─── LAZY LOAD (When scrolled into view) ─────────────────
        // These sections load when they're ~200px from viewport
        lazyLoader.register('newReleasesGrid', loadNewReleases, {
          immediate: false,
          priority: 3
        });
        
        lazyLoader.register('newAnioceanGrid', loadNewAniocean, {
          immediate: false,
          priority: 4
        });
        
        lazyLoader.register('upcomingSection', loadUpcoming, {
          immediate: false,
          priority: 5
        });
        
        lazyLoader.register('completedGrid', () => loadCompleted(1), {
          immediate: false,
          priority: 6
        });
        
        lazyLoader.register('trendingList', () => loadTrending('today'), {
          immediate: false,
          priority: 7
        });
        
        lazyLoader.register('popularList', loadPopular, {
          immediate: false,
          priority: 8
        });
        
        lazyLoader.register('popularAnimeList', loadPopularAnime, {
          immediate: false,
          priority: 9
        });
        
        // Schedule is HEAVIEST (7 parallel day fetches + TVMaze)
        // Load last to avoid blocking other sections!
        lazyLoader.register('eswWidget', loadSchedule, {
          immediate: false,
          priority: 10
        });
        
        // Step 4: Initialize UI components that don't need data
        initGliders();
        
        // Step 5: Safety net - if user scrolls very fast, load all after 8s
        setTimeout(() => {
          const status = lazyLoader.getStatus();
          if (status.pendingSections.length > 0) {
            console.log(`[Safety Net] ⏱️ 8s elapsed, force-loading ${status.pendingSections.length} remaining sections...`);
            lazyLoader.loadAllRemaining();
          }
        }, 8000);
        
        // Debug: Log system status every 5 seconds (dev only)
        setInterval(() => {
          const queueStatus = apiQueue.getStatus();
          const loaderStatus = lazyLoader.getStatus();
          
          if (queueStatus.activeCount > 0 || loaderStatus.pendingSections.length > 0) {
            console.log('[System Status]', {
              apiQueue: queueStatus,
              lazyLoader: loaderStatus
            });
          }
        }, 5000);
      }
      
      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
