<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/BvwTjXgv/image-359e594e.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  
  <!-- Minimal fallback title (enhanced by shared.js MetadataManager for hybrid site) -->
  <title>Ruristream · Watch Anime, Movies & TV Shows Online Free in HD</title>
  
  <!-- Scripts (shared.js auto-injects full SEO metadata) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:opsz,wght@14..32,400..700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-body: #0a1929;
      --bg-header: #0f2440;
      --bg-card: #132f4c;
      --bg-surface: #1a3a5c;
      --bg-popup: #102a44;
      --text-primary: #ffffff;
      --text-secondary: #b0c7e3;
      --text-muted: #94a3b8;
      --text-widget-title: #a2c4de;
      --btn-primary: #2b6cb0;
      --btn-primary-hover: #1d4e89;
      --btn-primary-text: #ffffff;
      --btn-secondary: #334e68;
      --btn-secondary-hover: #243b53;
      --popup-btn: #5c6ac4;
      --popup-btn-text: #ffffff;
      --popup-btn-hover: #4955b5;
      --genre-tag-bg: #4c51bf;
      --link-accent: #ed64a6;
      --accent-gold: #ecc94b;
      --star-icon-color: #f5b942;
      --fire-icon-color: #e0622e;
      --accent-blue: #4299e1;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.16);
      --font-title: 'Archivo Black', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-meta: 'Poppins', sans-serif;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --radius-circle: 50%;
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
      --transition-fast: 0.18s ease;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-body);
      font-family: var(--font-body);
      color: var(--text-primary);
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    img { max-width: 100%; display: block; }
    button, .btn-heart, .btn-watch { cursor: pointer; font-family: inherit; }

    /* ── HERO SLIDER ── */
    .hero-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    .slides-container {
      display: flex;
      transition: transform 0.55s ease-in-out;
      height: 100%;
    }
    .slide {
      min-width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 0 5%;
      overflow: hidden;
      animation: kenburns 12s ease-in-out infinite alternate;
      /* Sharpen images for better clarity on desktop */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    /* Special handling for anime poster images - focus on upper portion */
    .slide[data-anime="true"] {
      background-position: center 20%;
    }
    
    /* ════════════════════════════════════════════════════════════
       ANILIST BANNER DISPLAY - Default Size (No Stretch!)
       Anilist banners are ~1000x380px (wide but short)
       Show at natural aspect ratio, no vertical stretching
       ════════════════════════════════════════════════════════════ */
    .slide[data-image-source*="anilist"] {
      background-size: auto 100%;        /* Fit width, maintain aspect ratio */
      background-repeat: no-repeat;
      background-position: center top;   /* Align to top */
      animation: kenburns-banner 14s ease-in-out infinite alternate;
    }
    
    /* Gradient overlay for area below Anilist banner (fills empty space) */
    .slide[data-image-source*="anilist"]::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60%;  /* Cover lower portion where banner doesn't reach */
      background: linear-gradient(
        to top,
        var(--bg-body) 0%,
        rgba(10, 25, 41, 0.95) 30%,
        rgba(10, 25, 41, 0.7) 60%,
        transparent 100%
      );
      z-index: 1;
      pointer-events: none;
    }
    
    /* Subtle Ken Burns effect for banners (horizontal pan only) */
    @keyframes kenburns-banner {
      0%   { background-size: auto 100%; transform: translateX(0); }
      100% { background-size: auto 105%; transform: translateX(-2%); }  /* Gentle right pan */
    }
    
    /* Anime slide enhancement for non-Anilist sources (TMDB/Jikan fallback) */
    .slide-anime:not([data-image-source*="anilist"]) {
      filter: contrast(1.05) saturate(1.1);
    }
    .slide::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(to top, var(--bg-body) 0%, transparent 22%),
        linear-gradient(to right, rgba(10,25,41,0.55) 0%, rgba(10,25,41,0.15) 45%, rgba(10,25,41,0.55) 100%);
      z-index: 1;
    }
    @keyframes kenburns {
      0%   { background-size: cover; transform: scale(1); }
      100% { background-size: cover; transform: scale(1.05); }
    }
    .slide-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin-bottom: 6%;
      background: rgba(15, 36, 64, 0.38);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-lg);
      padding: clamp(14px, 2.5vw, 28px);
      box-shadow: var(--shadow-lg);
    }
    .slide-title {
      font-family: var(--font-title);
      font-size: clamp(18px, 4.5vw, 38px);
      margin-bottom: 6px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      /* ── Plain white title (no gradient) ──
         White reads on every backdrop — bright, dark, saturated, or muted.
         Same choice Netflix / Hulu / Crunchyroll make for their hero titles.
         text-shadow gives contrast over bright anime key art without
         needing per-image color logic. */
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .slide-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }
    .meta-badge {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: clamp(0.55rem, 1.4vw, 0.72rem);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(4px);
    }
    .slide-synopsis {
      font-size: clamp(0.55rem, 1.4vw, 0.82rem);
      color: rgba(255,255,255,0.78);
      margin-bottom: 14px;
      line-height: 1.45;
      max-height: 80px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      text-overflow: ellipsis;
    }
    .slide-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-watch {
      background: var(--btn-primary);
      color: #fff;
      padding: clamp(8px, 1.5vw, 12px) clamp(14px, 2.5vw, 26px);
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all var(--transition-fast);
    }
    .btn-watch:hover {
      background: var(--btn-primary-hover);
      transform: scale(1.02);
    }
    .btn-heart-slide {
      width: clamp(32px, 5vw, 44px);
      height: clamp(32px, 5vw, 44px);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-medium);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      color: #fff;
      font-size: clamp(0.8rem, 2vw, 1.2rem);
    }
    .btn-heart-slide:hover {
      background: rgba(255,255,255,0.2);
    }
    
    /* ── Card Action Buttons (for sections) ── */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .btn-bookmark-slide {
      width: clamp(32px, 5vw, 44px);
      height: clamp(32px, 5vw, 44px);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-medium);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      color: #fff;
      font-size: clamp(0.75rem, 1.8vw, 1.1rem);
    }
    .btn-bookmark-slide:hover {
      background: rgba(255,255,255,0.2);
      color: var(--accent-gold);
    }
    
    .btn-details {
      background: transparent;
      color: var(--text-secondary);
      padding: clamp(6px, 1.2vw, 10px) clamp(12px, 2vw, 20px);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: clamp(0.65rem, 1.3vw, 0.85rem);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
    }
    .btn-details:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--btn-primary);
      color: var(--btn-primary);
    }

    /* ── Compact Overlay Actions (for horizontal cards) ── */
    .card-actions-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 30px 10px 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .show-card-horiz:hover .card-actions-overlay,
    .show-card-grid:hover .card-actions-overlay {
      opacity: 1;
    }
    
    .action-btns-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    
    .action-btn {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: var(--btn-primary);
      border-color: var(--btn-primary);
      transform: scale(1.1);
    }
    .action-watch:hover { background: #22c55e; border-color: #22c55e; }
    .action-heart:hover { background: #ec4899; border-color: #ec4899; }
    .action-bookmark:hover { background: var(--accent-gold); border-color: var(--accent-gold); }
    .action-details:hover { background: #3b82f6; border-color: #3b82f6; }
    .slider-nav {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 4px 16px;
      z-index: 5;
      border: 1px solid var(--border-subtle);
    }
    .slider-arrow {
      background: none;
      border: none;
      color: #fff;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .slider-arrow:hover {
      color: var(--btn-primary);
    }
    .slide-counter {
      font-size: clamp(0.65rem, 1.5vw, 0.85rem);
      color: rgba(255,255,255,0.85);
    }
    .slider-dots {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 5;
    }
    .dot {
      width: clamp(5px, 0.8vw, 7px);
      height: clamp(5px, 0.8vw, 7px);
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      cursor: pointer;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* ── GRID & CARD ── */
    .card-title {
      font-size: 0.875rem; font-weight:600; color:#fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .card-meta-sm { font-size:0.75rem; font-weight:500; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-info-grid .card-title { font-size:0.85rem; }
    .card-info-grid .card-meta-sm { font-size:0.7rem; }
    .badge { font-size:0.625rem; font-weight:700; text-transform:uppercase; }
    /* Status badge - PINK color - TOP LEFT POSITION */
    .poster-status-badge { position:absolute; top:6px; left:6px; background:linear-gradient(135deg, rgba(236,72,153,0.9), rgba(244,114,182,0.9)); color:#fff; font-size:0.6rem; padding:2px 6px; border-radius:3px; z-index:2; font-weight:600; backdrop-filter:blur(4px); }
    
    /* Genre tags on cards */
    .card-genres { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
    .genre-tag { font-size:0.55rem; padding:1px 5px; border-radius:3px; background:rgba(99,102,241,0.18); color:#a5b4fc; border:1px solid rgba(99,102,241,0.25); white-space:nowrap; font-weight:500; }
    .genre-tag:nth-child(n+5) { display:none; } /* Max 4 genres visible */
    .poster-rating-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:var(--star-icon-color); font-size:0.6rem; padding:2px 5px; border-radius:3px; z-index:2; display:flex; align-items:center; gap:3px; }

    /* ── LAYOUT (scrolls together) ── */
    .main-layout { display:flex; gap:20px; max-width:1920px; margin:0 auto; align-items:flex-start; }
    .main-content { flex:1; min-width:0; padding:0 20px 20px; max-width:calc(100% - 380px); }
    .sidebar-right { flex:0 0 420px; width:420px; padding:0 12px 0 0; position:relative; }
    @media (min-width:1600px) {
      .sidebar-right { flex:0 0 460px; width:460px; }
      .main-content { max-width:calc(100% - 480px); }
    }
    .section { margin:30px 0; }
    .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
    .section-title { font-family:var(--font-title); font-size:1.35rem; color:var(--text-widget-title); }
    .section-controls { display:flex; align-items:center; gap:8px; }
    .view-all { font-size:0.75rem; font-weight:600; color:var(--link-accent); border:1px solid var(--link-accent); border-radius:var(--radius-pill); padding:5px 12px; white-space:nowrap; transition:all var(--transition-fast); }
    .view-all:hover { background:rgba(237,100,166,0.15); }
    .scroll-arrow { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid var(--border-medium); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:1rem; }
    .scroll-arrow-disabled, .scroll-arrow:disabled { opacity:0.3; cursor:default; pointer-events:none; }
    .scroll-arrow:hover { background:rgba(255,255,255,0.14); }
    @media (max-width:1024px) { .scroll-arrow { display:none; } }

    .horizontal-scroll { display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:8px; }
    .horizontal-scroll::-webkit-scrollbar { display:none; }
    .show-card-horiz { flex:0 0 auto; width:165px; cursor:pointer; transition:transform var(--transition-fast); }
    .show-card-horiz:hover { transform:translateY(-4px); }
    .card-poster { width:100%; aspect-ratio:3/4.5; background-size:cover; background-position:center; border-radius:var(--radius-md); position:relative; overflow:hidden; margin-bottom:6px; background-color:var(--bg-card); }
    .play-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity var(--transition-fast); border-radius:var(--radius-md); }
    .play-overlay svg { width:36px; height:36px; fill:#fff; }
    .show-card-horiz:hover .play-overlay, .show-card-grid:hover .play-overlay { opacity:1; }
    .ranking-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); color:#fff; font-weight:700; font-size:0.7rem; padding:2px 7px; border-radius:4px; z-index:2; }
    .quality-badge { position:absolute; top:6px; left:6px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.62rem; padding:2px 5px; border-radius:3px; z-index:2; font-weight:600; }
    .score-badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:var(--star-icon-color); font-size:0.65rem; padding:2px 5px; border-radius:3px; z-index:2; font-weight:600; display:flex; align-items:center; gap:3px; }
    
    /* No Image placeholder - vertically stacked text */
    .card-poster.no-image::before { content:'No'; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); color:#94a3b8; font-size:0.75rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; z-index:1; user-select:none; }
    .card-poster.no-image::after { content:'Image'; position:absolute; top:55%; left:50%; transform:translate(-50%,-50%); color:#94a3b8; font-size:0.7rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; z-index:1; user-select:none; }

    /* NEW ON ANIOCEAN SECTION - 3-Row Horizontal Scroll Shelf (Netflix-style), computer only */
    .new-aniocean-shelf {
      /* Use CSS Grid for true 3-row horizontal scroll.
         Column count + width are set inline by JS (nrAnioceanLayout) based on
         the actual container width, so columns fit exactly with no partial
         8th column bleeding in. JS also caps total columns to
         Math.ceil(items/3) so the scrollWidth matches the actual content —
         no overscroll past the last column. */
      display: grid;
      /* Placeholder values; JS overrides these on layout. */
      grid-template-columns: repeat(10, 165px);
      grid-template-rows: repeat(3, auto);
      grid-auto-flow: column;
      grid-auto-columns: 165px;
      gap: 12px;
      /* Horizontal scroll only */
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      /* Height for 3 full rows: poster(~248px) + info(~75px) + 2 gaps.
         Will be overridden by JS to match the actual computed card height. */
      height: calc(((165px * 4.5 / 3) + 75px) * 3 + 24px);
      max-height: 1000px;
      /* Hide scrollbar like other sections */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .new-aniocean-shelf::-webkit-scrollbar { display: none; }

    /* Upcoming Shows — desktop-only 2-row grid: row 1 = anime, row 2 = movies+TV.
       Same column-flow pattern as .new-aniocean-shelf but rows are assigned
       explicitly per-card in JS (grid-row 1/2) instead of relying on
       auto-flow, since the two rows hold different content types rather
       than an even split of one list. */
    /* Upcoming section - single interleaved row [TV] [Anime] [Movie] */
    #upcomingScroll {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 8px;
    }
    #upcomingScroll::-webkit-scrollbar { display: none; }
    #upcomingScroll .show-card-horiz { 
      flex: 0 0 auto; 
      width: 165px; 
    }
    
    /* Card sizing for grid */
    .new-aniocean-shelf .aniocean-card {
      width: 165px;
      min-width: 165px;
      max-width: 165px;
      /* No flex properties needed - grid controls layout */
    }

    .aniocean-card {
      position: relative;
      cursor: pointer;
      transition: transform var(--transition-fast);
      display: flex;
      flex-direction: column;
    }
    .aniocean-card:hover {
      transform: translateY(-4px);
    }
    .aniocean-poster {
      position: relative;
      aspect-ratio: 3/4.5;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
    }
    .aniocean-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Score Badge - Top Right */
    .aniocean-badge-score {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      color: var(--star-icon-color, #f5b942);
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .aniocean-badge-score i {
      font-size: 0.65rem;
    }
    
    /* Sub/Dub Badges Container - Bottom Left */
    .aniocean-badge-lang {
      position: absolute;
      bottom: 6px;
      left: 6px;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    
    /* Individual Language Badge */
    .aniocean-lang-badge {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.66rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      letter-spacing: 0.2px;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    }
    .aniocean-lang-badge i {

    /* Sub Badge — brand primary blue, solid (no blur) for reliable

      color: #ffffff;

    /* Dub Badge — brand indigo (matches genre-tag/popup-btn hues already
       used elsewhere on the site), clearly distinct from sub-badge's blue */

      border: 1px solid rgba(255, 255, 255, 0.25);

    /* Title Section - Below Poster (not overlaid) */
    .aniocean-title-section {
      padding: 8px 4px 2px;
      text-align: center;
    }
    .aniocean-meta {
      font-size: 0.62rem;
      color: var(--text-muted, #94a3b8);
      margin-bottom: 3px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .aniocean-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Grid containers with balanced rows - New Releases section */
    .grid-container { 
      display:grid; 
      grid-template-columns:repeat(7, 1fr); 
      gap:14px;
    }
    /* Large desktop (>1800px): 7 cols × 6 rows = 42 shows */
    @media (max-width:1800px) { .grid-container { grid-template-columns:repeat(7, 1fr); gap:12px; } }
    /* Desktop (1400-1800px): 6 cols × 6 rows = 36 shows */
    @media (max-width:1600px) { .grid-container { grid-template-columns:repeat(6, 1fr); } }
    /* Medium desktop (1200-1400px): 6 cols */
    @media (max-width:1400px) { .grid-container { grid-template-columns:repeat(6, 1fr); } }
    /* Small desktop/large tablet (992-1200px): 5 cols */
    @media (max-width:1200px) { .grid-container { grid-template-columns:repeat(5, 1fr); } }
    /* Tablet (768-992px): 4 cols */
    @media (max-width:992px) { .grid-container { grid-template-columns:repeat(4, 1fr); gap:10px; } }
    /* Tablet portrait (600-768px): 3 cols */
    @media (max-width:768px) { .grid-container { grid-template-columns:repeat(3, 1fr); gap:10px; } }
    /* Mobile landscape (520-600px): 3 cols */
    @media (max-width:600px) and (orientation:landscape) { .grid-container { grid-template-columns:repeat(3, 1fr); } }
    /* Mobile landscape (<520px): 2 cols */
    @media (max-width:520px) and (orientation:landscape) { .grid-container { grid-template-columns:repeat(2, 1fr); } }
    /* Mobile portrait (<520px): 2 cols */
    @media (max-width:520px) and (orientation:portrait) { .grid-container { grid-template-columns:repeat(2, 1fr); } }
    @media (max-width:520px) { .grid-container { grid-template-columns:repeat(2, 1fr); } }
    .show-card-grid { border-radius:var(--radius-md); overflow:hidden; cursor:pointer; transition:transform var(--transition-fast); position:relative; }
    .show-card-grid:hover { transform:translateY(-3px); }
    .show-card-grid .card-poster {
      aspect-ratio: 3/4.5;
      border-radius: 0;
      margin-bottom: 0;
    }
    .card-info-grid {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 8px 8px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      color: #fff;
      pointer-events: none;
    }

    /* Sliding Toggle Tabs with Glider Effect */
    .toggle-tabs {
      display: flex;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: var(--radius-pill, 50px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      gap: 0;
    }
    .toggle-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 16px;
      border-radius: var(--radius-pill, 50px);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s ease-in-out;
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-secondary, #94a3b8);
      white-space: nowrap;
    }
    .toggle-tab:hover {
      color: #e2e8f0;
    }
    .toggle-tab.active {
      color: #ffffff;
      font-weight: 600;
    }
    /* Glider/Slider Background */
    .tabs-glider {
      position: absolute;
      height: 32px;
      background: linear-gradient(135deg, var(--btn-primary, #3b82f6), rgba(59, 130, 246, 0.85));
      border-radius: var(--radius-pill, 50px);
      z-index: 1;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }
    /* Responsive tabs scaling */
    @media (max-width: 768px) {
      .toggle-tabs {
        transform: scale(0.9);
        transform-origin: right center;
      }
      /* Fix: Keep tabs inline with title on mobile - prevent wrapping */
      .section-header:has(.toggle-tabs) {
        flex-wrap: nowrap !important;
        gap: 6px !important;
      }
      .section-header:has(.toggle-tabs) .section-title {
        font-size: 1.1rem !important;
        white-space: nowrap !important;
        flex-shrink: 1 !important;
        min-width: 0 !important;
      }
      .section-header:has(.toggle-tabs) .toggle-tabs {
        flex-shrink: 0 !important;
      }
      /* #releaseTabs opts out of the transform-scale approach below —
         CSS transform: scale() distorts the box that getBoundingClientRect()
         reports, and since the glider is a child of the same scaled element,
         its width/position get scaled a second time. That's what causes the
         glider to land in the wrong spot in mobile portrait. Sizing directly
         via padding/font instead keeps the glider math 1:1 at every width. */
      #releaseTabs.toggle-tabs {
        transform: none !important;
      }
      #releaseTabs .toggle-tab {
        padding: 0 11px;
        font-size: 0.7rem;
        height: 29px;
      }
      #releaseTabs .tabs-glider {
        height: 29px;
      }
    }
    @media (max-width: 480px) {
      .toggle-tabs {
        transform: scale(0.78);
        transform-origin: right center;
      }
      .toggle-tab {
        padding: 0 10px;
        font-size: 0.65rem;
        height: 26px;
      }
      .tabs-glider {
        height: 26px;
      }
      /* Extra compact for very small screens */
      .section-header:has(.toggle-tabs) .section-title {
        font-size: 1rem !important;
      }
      /* Drop icons at the smallest breakpoint — text + count stay legible */
      #releaseTabs .toggle-tab i { display: none; }
      #releaseTabs .toggle-tab { gap: 4px; }
      /* Same reasoning as the 768px override above — keep #releaseTabs
         un-transformed so the glider's rect math stays accurate. */
      #releaseTabs.toggle-tabs { transform: none !important; }
      #releaseTabs .toggle-tab { padding: 0 9px; font-size: 0.62rem; height: 25px; }
      #releaseTabs .tabs-glider { height: 25px; }
    }

    /* ════════════════════════════════════════════════════════════
       NEW RELEASES — enhanced tabs, spotlight card, badges, actions
       (scoped to #releaseTabs / #newReleasesGrid so no other
       section's shared classes are affected)
       ════════════════════════════════════════════════════════════ */

    /* Tabs: icon + live count pill */
    #releaseTabs .toggle-tab { gap: 6px; }
    #releaseTabs .toggle-tab i { font-size: 0.72em; opacity: 0.85; }
    #releaseTabs .tab-count {
      font-size: 0.62em;
      font-weight: 700;
      background: rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 1px 6px;
      min-width: 16px;
      text-align: center;
      line-height: 1.5;
    }
    #releaseTabs .toggle-tab.active .tab-count {
      background: rgba(255,255,255,0.28);
    }
    #releaseTabs .tab-count:empty { display: none; }

    /* Section actions row: View All beside tabs */
    .nr-header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }

    /* Keep "View All" beside the tabs on narrow screens instead of it
       wrapping onto its own row — collapse to an icon-only circular
       button, same footprint as the section's scroll-arrow controls. */
    @media (max-width: 768px) {
      #nrViewAll {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        min-width: 30px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      #nrViewAll .nr-viewall-text { display: none; }
    }
    @media (max-width: 480px) {
      #nrViewAll { width: 26px; height: 26px; min-width: 26px; font-size: 0.65rem; }
    }

    /* ── Mobile PORTRAIT only: title + View All share row 1, tabs move to
       their own centered row 2 below. Landscape mobile keeps the single-row
       layout above (icon-only View All) since that already renders fine. ── */
    @media (max-width: 768px) and (orientation: portrait) {
      .section-header:has(.nr-header-controls) {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "nr-title nr-viewall"
          "nr-tabs  nr-tabs";
        row-gap: 12px;
        column-gap: 10px;
        align-items: center;
        flex-wrap: unset;
      }
      .section-header:has(.nr-header-controls) .section-title {
        grid-area: nr-title;
      }
      /* Let the tabs + View All join the grid directly as their own items,
         instead of staying nested inside .nr-header-controls */
      .nr-header-controls {
        display: contents;
      }
      #releaseTabs.toggle-tabs {
        grid-area: nr-tabs;
        justify-self: center;
        transform: none !important;
      }
      /* Restore the full "View All" pill — plenty of room now the tabs
         have their own row */
      #nrViewAll {
        grid-area: nr-viewall;
        justify-self: end;
        width: auto;
        height: auto;
        min-width: 0;
        padding: 6px 14px;
        gap: 5px;
      }
      #nrViewAll .nr-viewall-text {
        display: inline;
      }
    }

    /* Grid fade-transition on tab switch */
    .new-releases-grid { transition: opacity 0.18s ease; }
    .new-releases-grid.nr-fading { opacity: 0; }

    /* Type accent dot — color-coded by content type (matches site's existing token colors) */
    .nr-type-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:middle; flex-shrink:0; }
    .nr-type-dot.nr-anime  { background: var(--genre-tag-bg, #4c51bf); box-shadow:0 0 6px rgba(76,81,191,0.7); }

    /* ── Spotlight / featured card — first item in "All" view ── */
    .new-releases-grid .nr-featured {

    .new-releases-grid .nr-featured .card-poster {

    .nr-featured-ribbon {

    @media (max-width: 600px) {

      .new-releases-grid .nr-featured .card-info-grid { padding: 24px 8px 8px; }

    /* ── Action buttons: Play = primary/filled, Heart = secondary/outline ── */
    #newReleasesGrid .action-btn.action-watch {

    /* ════════════════════════════════════════════════════════════
       NEW RELEASES — "All" tab, desktop-only 3-row horizontal layout
       Row 1: anime · Row 2: TMDB TV · Row 3: TMDB movies. Column count
       adapts to screen width; chevrons + keyboard arrows scroll by one
       full page of columns so edges are always exactly aligned.
       ════════════════════════════════════════════════════════════ */
    .nr-scroll-controls { display: none; align-items: center; gap: 8px; }
    /* Only show the chevrons once JS confirms the horizontal layout is active */
    .nr-header-controls.nr-horiz-active .nr-scroll-controls { display: flex; }
    @media (max-width: 1024px) {
      .nr-scroll-controls { display: none !important; }
    }

    #newReleasesGrid.nr-horizontal {
      display: grid;
      /* Reset the explicit column tracks set by .grid-container (repeat(7,1fr) etc.)
         so ONLY grid-auto-columns governs sizing — mixing the two caused the
         next column to bleed partially into view instead of staying off-screen. */
      grid-template-columns: none;
      grid-auto-flow: column;
      grid-template-rows: repeat(3, auto);
      grid-auto-columns: var(--nr-col-width, 200px);
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
    }
    #newReleasesGrid.nr-horizontal::-webkit-scrollbar { display: none; }
    #newReleasesGrid.nr-horizontal .show-card-grid {
      scroll-snap-align: start;
      width: 100%;
    }
    /* Featured spotlight card only makes sense in the vertical grid —
       never let it span rows/cols here, or it breaks the anime/other split */
    #newReleasesGrid.nr-horizontal .nr-featured {
      grid-column: auto;
      grid-row: auto;
    }

    /* ════════════════════════════════════════════════════════════
       NEW RELEASES — vertical 3-row smooth-scroll layout
       Active on: desktop, mobile-landscape, mobile-desktop view modes
       (i.e. whenever width > 1024 OR orientation:landscape with width > 768).
       NOT active on mobile-portrait (which keeps the regular grid-container).
       Three rows of cards are visible at once; user scrolls vertically by
       one full page (3 rows) per chevron click. No visible scrollbar.
       ════════════════════════════════════════════════════════════ */
    .nr-scroll-controls-v { display: none; align-items: center; gap: 8px; }
    .nr-header-controls.nr-vert-active .nr-scroll-controls-v { display: flex; }
    /* Hide the horizontal chevrons whenever the vertical layout is active,
       so only the up/down arrows appear next to the View All button. */
    .nr-header-controls.nr-vert-active .nr-scroll-controls:not(.nr-scroll-controls-v) { display: none !important; }
    /* Vertical chevrons still need to be visible below the 1024 breakpoint
       where the global .scroll-arrow rule normally hides them — but only
       when the vertical layout is actually active (landscape mobile etc.). */
    @media (max-width: 1024px) {
      .nr-header-controls.nr-vert-active .nr-scroll-controls-v .scroll-arrow { display: flex !important; }
    }

    #newReleasesGrid.nr-vertical-3row {
      display: grid;
      grid-template-columns: none;
      /* 3 explicit rows; each row is exactly one card height.
         --nr-row-height is computed by JS (nrLayoutColumns) so it matches
         the actual card height (poster + info) at the current width. */
      grid-template-rows: repeat(3, var(--nr-row-height, 360px));
      grid-auto-flow: column;
      grid-auto-columns: var(--nr-col-width, 200px);
      gap: 14px;
      /* Vertical scroll only — hide horizontal overflow, no scrollbar */
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      /* Total height = 3 rows + 2 gaps. This is what makes only 3 rows visible. */
      height: calc(var(--nr-row-height, 360px) * 3 + 14px * 2);
      padding-right: 4px;
    }
    #newReleasesGrid.nr-vertical-3row::-webkit-scrollbar { display: none; }
    #newReleasesGrid.nr-vertical-3row .show-card-grid {
      width: 100%;
      /* Card height fills its grid row exactly, no awkward gaps */
      height: 100%;
    }
    /* No featured/hero card in this layout — always a normal card */
    #newReleasesGrid.nr-vertical-3row .nr-featured {
      grid-column: auto;
      grid-row: auto;
    }
    /* The grid-container class sets repeat(N,1fr) columns — must be reset
       here so grid-auto-columns is the only sizing track. */
    #newReleasesGrid.nr-vertical-3row.grid-container {
      grid-template-columns: none;
      display: grid;
    }

    /* ── "Hidden" tab: 3 always-horizontal-scroll rows, grouped by country ──
       Unlike All/Anime/Movie/Series (which switch between grid/horizontal by
       screen width), this tab is horizontal-scroll on every device, matching
       how Top Airing / New on Aniumi already behave responsively. */
    .nr-hidden-rows { display:flex; flex-direction:column; gap:22px; margin-top:4px; }
    .nr-hidden-row-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:8px;
    }
    .nr-hidden-row-label {
      font-size:0.78rem; font-weight:600; color:var(--text-muted, #94a3b8);
      letter-spacing:0.2px;
    }
    /* These rows are always horizontal-scroll (not gated behind .nr-horiz-active
       like the "All" tab's chevrons), so show them unconditionally on desktop —
       .scroll-arrow's own @media rule already hides them under 1024px. */
    .nr-hidden-row-header .nr-scroll-controls { display:flex; }
    .nr-hidden-scroll { padding-bottom:8px; }
    .nr-hidden-scroll .show-card-grid {
      flex: 0 0 auto;
      width: 200px;
      scroll-snap-align: start;
    }
    .nr-hidden-scroll { scroll-snap-type: x mandatory; }
    @media (max-width: 1024px) {
      .nr-hidden-scroll .show-card-grid { width: 165px; }
    }
    @media (max-width: 640px) {
      .nr-hidden-scroll .show-card-grid { width: 140px; }
      .nr-hidden-rows { gap:16px; }
    }

    /* ── Top Airing: match New Releases / Recently Completed / Upcoming

    #topAiringScroll .action-btn.action-watch {

    .pa-list {

    /* RIGHT SIDE: actual bg image — visible on right, fades left */
    .pa-row::before {
      content:''; position:absolute; inset:0;
      background-image:var(--pa-bg);
      background-size:cover; background-position:center 20%;
      filter:blur(1.5px) brightness(0.35) saturate(1.4);
      transition:filter .3s ease;
      z-index:0;
    }
    /* LEFT SIDE: dark overlay that fades to transparent right — Miruro look */
    .pa-row::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to right,
        var(--bg-card,#0f1923) 0%,
        var(--bg-card,#0f1923) 38%,
        rgba(10,18,28,0.72) 62%,
        rgba(10,18,28,0.0) 100%);
      z-index:1;
      transition:opacity .3s ease;

    .pa-row:hover::after  { opacity:0.82; }

      .new-aniocean-shelf {
        /* 60 columns × 2 rows = 120 cells — comfortably covers the up-to-100
           items the API can return, so nothing overflows into shrunken
           implicit columns (see grid-auto-columns fallback below too). */
        grid-template-columns: repeat(60, 150px);
        grid-template-rows: repeat(2, auto);
        grid-auto-columns: 150px;
        height: calc(((150px * 4.5 / 3) + 70px) * 2 + 12px);
        max-height: 600px;

      .new-aniocean-shelf { 
        gap: 8px;
        /* Mobile: 2 cards visible per "page" of the scroll, 2 rows tall.
           60 columns × 2 rows = 120 cells — was only 20 columns (40 cells)
           before, so cards past #40 (the API can return up to 100) fell into
           implicit columns sized by grid-auto-columns:auto and shrank to
           almost nothing. That's the "cards get tiny after scrolling" bug. */
        grid-template-columns: repeat(60, calc((100vw - 32px - 8px) / 2));

      /* ── INFO URL GENERATOR (SEO-Friendly) ──
       * Generates info page URLs with proper format:
       * - Anime: /info/anime/jikan-{mal_id}/slug
       * - TMDB Movie: /info/movie/tmdb-movie-{tmdb_id}/slug
       * - TMDB TV: /info/tv/tmdb-tv-{tmdb_id}/slug-season-{season_number}
       */
      function infoUrl(show, season = 1) {
        const id = show.id;
        const title = (show.title || '').trim();
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

        // Anime (Jikan/AniList) → /info/anime/jikan-{mal_id}/slug
        if (id.startsWith('jikan-') || id.startsWith('anilist-') || show.mal_id) {
          const malId = show.mal_id || id.replace(/^jikan-(?:air-|up-|comp-|tr-|pop-|anilist-)?/, '').replace(/^anilist-(?:air-|up-|comp-|tr-|pop-)?/, '');
          const base = `/info/anime/jikan-${malId}`;
          return slug ? `${base}/${slug}` : base;
        }

        // Check explicit type FIRST — avoids id-prefix collisions
        // (e.g. "tmdb-up-tv-123" starting with "tmdb-up-" being
        // misread as a movie id even though show.type === 'TV')
        if (show.type === 'TV' || show.type === 'tv') {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:tv|tvpop|comp|uptv|up-tv)-/, '');
          const base = `/info/tv/tmdb-tv-${numeric}`;
          const seasonSuffix = season ? `-season-${season}` : '';
          return slug ? `${base}/${slug}${seasonSuffix}` : base;
        }

        if (show.type === 'Movie' || show.type === 'movie') {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:mv|movie|up)-/, '');
          const base = `/info/movie/tmdb-movie-${numeric}`;
          return slug ? `${base}/${slug}` : base;
        }

        // Fallback: id-prefix guessing (only used when show.type is missing)
        if (id.startsWith('tmdb-mv-') || id.startsWith('tmdb-movie-') || id.startsWith('tmdb-up-')) {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:mv|movie|up)-/, '');
          const base = `/info/movie/tmdb-movie-${numeric}`;
          return slug ? `${base}/${slug}` : base;
        }

        if (id.startsWith('tmdb-tv-') || id.startsWith('tmdb-tvpop-') || id.startsWith('tmdb-comp-') || id.startsWith('tmdb-uptv-')) {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:tv|tvpop|comp|uptv)-/, '');
          const base = `/info/tv/tmdb-tv-${numeric}`;
          const seasonSuffix = season ? `-season-${season}` : '';
          return slug ? `${base}/${slug}${seasonSuffix}` : base;
        }

        // Numeric ID fallback (treat as anime)
        if (/^\d+$/.test(id)) {
          const base = `/info/anime/jikan-${id}`;
          return slug ? `${base}/${slug}` : base;
        }

        // Final fallback
        return `/info/${id}`;
      }

      /* ── WATCH URL GENERATOR (SEO-Friendly) ──
       * Generates watch page URLs with proper format:
       * - Anime: /watch/anime/jikan-{mal_id}/slug/episode/{episode_number}

      function watchUrl(show, season = 1, episode = 1) {
        const id = show.id;
        const title = (show.title || '').trim();
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

        // Anime (Jikan/AniList) → /watch/anime/jikan-{mal_id}/slug/episode/{episode}

          const base = `/watch/anime/jikan-${malId}`;
          const slugPart = slug ? `/${slug}` : '';
          return `${base}${slugPart}/episode/${episode}`;
        }

        // Check explicit type FIRST — avoids id-prefix collisions
        if (show.type === 'TV' || show.type === 'tv') {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:tv|tvpop|comp|uptv|up-tv)-/, '');
          const base = `/watch/tv/tmdb-tv-${numeric}`;
          const slugPart = slug ? `/${slug}` : '';
          return `${base}${slugPart}/season/${season}/episode/${episode}`;
        }

        if (show.type === 'Movie' || show.type === 'movie') {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:mv|movie|up)-/, '');
          const base = `/watch/movie/tmdb-movie-${numeric}`;
          return slug ? `${base}/${slug}` : base;
        }

        // Fallback: id-prefix guessing (only used when show.type is missing)
        if (id.startsWith('tmdb-mv-') || id.startsWith('tmdb-movie-') || id.startsWith('tmdb-up-')) {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:mv|movie|up)-/, '');
          const base = `/watch/movie/tmdb-movie-${numeric}`;
          return slug ? `${base}/${slug}` : base;
        }

        if (id.startsWith('tmdb-tv-') || id.startsWith('tmdb-tvpop-') || id.startsWith('tmdb-comp-') || id.startsWith('tmdb-uptv-')) {
          const numeric = show.tmdb_id || id.replace(/^tmdb-(?:tv|tvpop|comp|uptv)-/, '');

        // Fallback

      }

      async function fetchJikan(endpoint, params='', retries=2) {
        const qs = params ? `?${params}` : '';
        // 1) Universal proxy — cached 5 min at CF edge, absorbs 429s server-side
        try {
          const res = await fetch(`${ROWANA_PROXY}/jikan/${endpoint}${qs}`, {
            headers: { Accept: 'application/json' },
            signal: AbortSignal.timeout(10000)
          });
          if (res.ok) return await res.json();
          if (res.status === 429) {
            // Proxy also rate-limited — wait and retry once via proxy
            await new Promise(r => setTimeout(r, 2000));
            try {
              const r2 = await fetch(`${ROWANA_PROXY}/jikan/${endpoint}${qs}`, {
                headers: { Accept: 'application/json' },
                signal: AbortSignal.timeout(10000)
              });
              if (r2.ok) return await r2.json();
            } catch(e) {}
          }
        } catch(e) { /* proxy down — fall through to direct */ }
        // 2) Direct Jikan with retry (safety net — longer backoff to respect rate limits)
        const directUrl = `${JIKAN_BASE}/${endpoint}${qs}`;
        for (let attempt = 1; attempt <= retries; attempt++) {
          try {
            const res = await fetch(directUrl, { signal: AbortSignal.timeout(12000) });
            if (res.ok) return await res.json();
            if (res.status === 429) {
              await new Promise(r => setTimeout(r, attempt * 2500));
              continue;
            }
            return { data: [] };
          } catch(e) {
            if (attempt === retries) { return { data: [] }; }
            await new Promise(r => setTimeout(r, attempt * 2000));
          }
        }
        return { data: [] };
      }

      function anilistToInternal(media) {

          year: media.startDate?.year || '?',

          episodes: media.episodes || '?',
          duration: media.duration ? `${media.duration}m` : '?',

          studio: media.studios?.nodes?.[0]?.name || '?',
          studios: media.studios?.nodes?.map(s => s.name) || [],
          status: mapAniListStatus(media.status),

      function mapAniListStatus(status) {

          'NOT_YET_RELEASED': 'Upcoming',

      /* ════════════════════════════════════════════════════════════════
         UNIVERSAL ANIME NORMALIZER (V4.8.0)
         The automation stores RAW data — AniList objects when it used the
         AniList proxy, Jikan v4 objects (36 fields) when it fell back to
         the self-hosted Jikan. The sections below must render BOTH.

         normalizeAnimeItem() detects the source of a raw anime object and
         converts it to the same "internal" shape anilistToInternal()
         produces, so every card builder / infoUrl / watchUrl keeps working
         regardless of which source filled the DB this cycle.

         Detection logic:
           - AniList : `title` is an OBJECT {romaji, english, native}
           - Jikan   : `title` is a STRING + mal_id/images/aired/broadcast
           - Anikoto : `title` is a STRING + slug/poster/is_sub (DB
                       new_on_ruri shape) — passed through with light mapping
         ════════════════════════════════════════════════════════════════ */
      function stripHtmlTags(str) {
        return String(str || '').replace(/<[^>]*>/g, '').replace(/&[^;\s]+;/g, ' ').trim();
      }
      function detectAnimeSource(m) {
        if (!m || typeof m !== 'object') return 'unknown';
        if (m.title && typeof m.title === 'object') return 'anilist';
        if (m.slug && (m.poster || m.terms_by_type)) return 'anikoto';
        if (typeof m.title === 'string' &&
            (m.images || m.mal_id !== undefined || m.aired || m.broadcast)) return 'jikan';
        if (m.coverImage) return 'anilist';
        return 'unknown';
      }
      function jikanTypeToInternal(t) {
        const map = { TV: 'TV', Movie: 'MOVIE', OVA: 'OVA', ONA: 'ONA', Special: 'SPECIAL', Music: 'MUSIC' };
        return map[t] || t || 'TV';
      }
      function mapJikanStatus(status) {
        const map = {
          'Currently Airing': 'Airing',
          'Finished Airing': 'Completed',
          'Not yet aired': 'Upcoming'
        };
        return map[status] || status || 'Unknown';
      }
      function jikanYearOf(m) {
        if (m.year) return m.year;
        if (m.aired?.prop?.from?.year) return m.aired.prop.from.year;
        if (m.premiered) {
          const y = parseInt(String(m.premiered).slice(-4), 10);
          if (!isNaN(y)) return y;
        }
        return '?';
      }
      function jikanDurationOf(m) {
        // "24 min per ep" → "24m"
        const match = String(m.duration || '').match(/(\d+)\s*min/);
        return match ? `${match[1]}m` : '?';
      }
      function jikanIsAdult(m) {
        if (m.rated === 'Rx - Hentai' || (m.rating || '').toLowerCase().startsWith('rx')) return true;
        if (m.r18) return true;
        const genres = [...(m.genres || []), ...(m.explicit_genres || [])];
        return genres.some(g => (g.name || '').toLowerCase().includes('hentai'));
      }
      function jikanPosterOf(m) {
        const imgs = m.images || {};
        return imgs.webp?.large_image_url || imgs.jpg?.large_image_url ||
               imgs.webp?.image_url  || imgs.jpg?.image_url  || m.image_url || '';
      }
      function jikanBannerOf(m) {
        // Jikan has no banner field — the trailer's max-res YouTube
        // thumbnail is the closest widescreen image available.
        return m.trailer?.images?.maximum_image_url || '';
      }
      function coerceMalId(v) {
        // The DB sometimes stores mal_id as a numeric STRING — coerce to a
        // real number so id-keyed dedup and URL building stay consistent.
        if (v == null || v === '') return null;
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }

      /**
       * Universal raw-anime → internal converter.
       * Returns the SAME field set anilistToInternal() emits (plus `source`
       * set to 'anilist' | 'jikan' | 'anikoto') so all section renderers can
       * treat the result identically.
       */
      function normalizeAnimeItem(m) {
        if (!m || typeof m !== 'object') return null;
        const src = detectAnimeSource(m);

        if (src === 'jikan') {
          const title = m.title_english || m.title || m.title_japanese || 'Unknown';
          return {
            mal_id: coerceMalId(m.mal_id),
            anilist_id: null,
            title,
            title_jp: m.title_japanese || '',
            title_en: m.title_english || m.title || '',
            slug: (m.title || m.title_english || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''),
            poster: jikanPosterOf(m),
            banner: jikanBannerOf(m),
            score: (m.score != null && m.score > 0) ? Number(m.score).toFixed(1) : 'N/A',
            type: jikanTypeToInternal(m.type),
            rating: m.rating ? String(m.rating).split(' ')[0] : (jikanIsAdult(m) ? 'R18+' : 'PG-13'),
            description: stripHtmlTags(m.synopsis).slice(0, 500) || 'No description available.',
            year: jikanYearOf(m),
            season: m.season ? String(m.season).toUpperCase() : undefined,
            episodes: m.episodes || '?',
            duration: jikanDurationOf(m),
            genres: (m.genres || []).map(g => g.name).filter(Boolean),
            studio: (m.studios || [])[0]?.name || '?',
            studios: (m.studios || []).map(s => s.name).filter(Boolean),
            status: mapJikanStatus(m.status),
            popularity: m.members || m.popularity || 0,
            trending: undefined,
            nextEpisode: undefined,
            isAdult: jikanIsAdult(m),
            source: 'jikan'
          };
        }

        if (src === 'anikoto') {
          return {
            mal_id: coerceMalId(m.mal_id),
            anilist_id: null,
            title: m.title || 'Unknown',
            title_jp: '',
            title_en: m.title || '',
            slug: m.slug || (m.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''),
            poster: m.poster || '',
            banner: '',
            score: m.score || 'N/A',
            type: m.terms_by_type?.type?.[0] || 'TV',
            rating: m.rating || 'N/A',
            description: stripHtmlTags(m.description).slice(0, 500) || 'No description available.',
            year: m.year || '?',
            season: undefined,
            episodes: '?',
            duration: m.duration ? `${m.duration}m` : '?',
            genres: m.terms_by_type?.genre || [],
            studio: m.terms_by_type?.studios?.[0] || '?',
            studios: m.terms_by_type?.studios || [],
            status: 'Unknown',
            popularity: 0,
            trending: undefined,
            nextEpisode: undefined,
            isAdult: false,
            is_sub: m.is_sub || 0,
            is_dub: m.is_dub || 0,
            source: 'anikoto'
          };
        }

        // AniList (or unknown-but-AniList-like) — delegate to the existing
        // converter so both paths share one code path.
        if (m.title && typeof m.title === 'object') {
          const internal = anilistToInternal(m);
          return { ...internal, source: 'anilist' };
        }
        return null;
      }

      /* ════════════════════════════════════════════════════════════════
         DB PAYLOAD HELPERS (V4.8.0)
         The /api/<column> endpoints return the RAW jsonb exactly as the
         automation stored it:
           - Anime      : array (AniList or Jikan items) — or, defensively,
                          a Jikan page object { data: [...], pagination }
           - tmdb_tv    : { "1": [...], "2": [...] }  (page-keyed)
                          or { "US": [...], "GB": [...] } (region-keyed)
           - tmdb_movie : same shape as tmdb_tv
         These helpers safely extract flat arrays from every shape ever
         stored, for both the current and legacy key spellings.
         ════════════════════════════════════════════════════════════════ */
      function dbAnimeList(home) {
        let arr = home?.Anime ?? home?.anime ?? home?.data ?? [];
        // Defensive: a Jikan-style page object instead of a plain array
        if (arr && typeof arr === 'object' && !Array.isArray(arr)) {
          arr = Array.isArray(arr.data) ? arr.data : [];
        }
        return Array.isArray(arr) ? arr : [];
      }
      function flattenTmdbMap(obj) {
        if (Array.isArray(obj)) return obj;
        if (!obj || typeof obj !== 'object') return [];
        const flat = [];
        for (const val of Object.values(obj)) {
          if (Array.isArray(val)) {
            flat.push(...val);
          } else if (val && Array.isArray(val.results)) {
            flat.push(...val.results); // raw TMDB page object defensively
          }
        }
        return flat;
      }
      function getTmdbArr(home, kind) {
        // kind: 'tv' | 'movie' — checks every key spelling ever used
        if (!home || typeof home !== 'object') return [];
        const keys = kind === 'tv'
          ? ['tmdb_tv', 'tmdbTV', 'TMDB_TV', 'TMDB_TV_DATA']
          : ['tmdb_movie', 'tmdbMovie', 'TMDB_Movie', 'TMDB_MOVIE', 'TMDB_MV'];
        for (const k of keys) {
          const v = home[k];
          if (v && ((Array.isArray(v) && v.length) || (!Array.isArray(v) && typeof v === 'object' && Object.keys(v).length))) {
            return flattenTmdbMap(v);
          }
        }
        return [];
      }

      /* Deduplicate anime by mal_id across all sources */
      // ── Global hentai filter for all Jikan data ─────────────────────
      const _HENTAI_GENRE_IDS = new Set([12, 49]); // 12=Hentai, 49=Erotica
      function isHentai(a) {
        if (!a) return false;
        const r = (a.rating || '').toLowerCase();
        if (r.includes('rx') || r.includes('hentai') || r === 'r18') return true;
        const genres = [...(a.genres || []), ...(a.explicit_genres || [])];
        return genres.some(g =>
          _HENTAI_GENRE_IDS.has(Number(g.mal_id)) ||
          (g.name || '').toLowerCase().includes('hentai') ||
          (g.name || '').toLowerCase().includes('erotica')
        );
      }
      function cleanJikan(arr) { return (arr || []).filter(a => !isHentai(a)); }

      function dedupById(items, idKey='id') {
        const seen = new Set();
        return items.filter(item => {
          const key = item[idKey];
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      /* ══════════════════════════════════════════════════════════════
         MAL ID BACKFILL — for AniList anime missing idMal
         Used when AniList returns an anime with no MAL mapping (idMal
         is null), so we can still build a valid /jikan-{mal_id}/ link
         instead of dropping the anime from a section entirely.

         Strategy: search the self-hosted Jikan title-search endpoint,
         paginating through results, and only accept a match that is
         BOTH a strong title match AND plausible on year/episode count.
         Requiring all of these avoids attaching the wrong mal_id to
         an anime (e.g. matching a same-titled remake, spin-off, or
         unrelated show with a similar name).

         RATE LIMITING: this self-hosted Jikan instance scrapes MAL
         directly, so hammering it risks getting IP-blocked/rate-limited
         by MAL itself. A single shared throttle gate serializes every
         request this module makes — including across concurrent
         mapWithConcurrency workers — to a minimum spacing, regardless
         of how many anime are being backfilled at once.
         ══════════════════════════════════════════════════════════════ */
      const JIKAN_SEARCH_BASE = 'https://jikan-api-bohb.onrender.com/v4/anime';
      const _malBackfillCache = new Map(); // session cache: "title::year" -> mal_id | null
      const MAL_BACKFILL_MAX_PAGES = 4;    // safety cap — stop paginating after this many pages
      const MAL_BACKFILL_MIN_SIMILARITY = 0.88; // title must be at least this close (0-1) to accept

      // ── Shared request throttle (protects the self-hosted Jikan/MAL scraper) ──
      const JIKAN_BACKFILL_MIN_INTERVAL_MS = 1500; // minimum gap between ANY two requests to this endpoint
      let _lastJikanBackfillRequestTs = 0;
      let _jikanBackfillQueue = Promise.resolve(); // serializes throttle checks across concurrent callers
      function _throttleJikanBackfill() {
        // Chain onto a shared promise so concurrent mapWithConcurrency workers
        // queue up in order rather than racing each other's setTimeout — two
        // workers reading _lastJikanBackfillRequestTs at the same instant
        // would otherwise both think they're clear to fire immediately.
        _jikanBackfillQueue = _jikanBackfillQueue.then(async () => {
          const now = Date.now();
          const elapsed = now - _lastJikanBackfillRequestTs;
          const wait = JIKAN_BACKFILL_MIN_INTERVAL_MS - elapsed;
          if (wait > 0) await new Promise(r => setTimeout(r, wait));
          _lastJikanBackfillRequestTs = Date.now();
        });
        return _jikanBackfillQueue;
      }

      // Levenshtein-based similarity, 0 (no match) to 1 (identical) —
      // standard DP implementation (initializes each row correctly,
      // unlike a naive single-array version that under-scores matches)
      function _titleSimilarity(a, b) {
        const s1 = (a || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const s2 = (b || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!s1 || !s2) return 0;
        if (s1 === s2) return 1;
        const m = s1.length, n = s2.length;
        const dp = Array.from({ length: m + 1 }, (_, i) => {
          const row = new Array(n + 1).fill(0);
          row[0] = i;
          return row;
        });
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
            dp[i][j] = Math.min(
              dp[i - 1][j] + 1,      // deletion
              dp[i][j - 1] + 1,      // insertion
              dp[i - 1][j - 1] + cost // substitution
            );
          }
        }
        const maxLen = Math.max(m, n);
        return maxLen === 0 ? 1 : 1 - dp[m][n] / maxLen;
      }

      /**
       * Search the self-hosted Jikan API for a mal_id matching an AniList
       * media object. Paginates using the endpoint's own pagination info
       * (has_next_page / last_visible_page) up to MAL_BACKFILL_MAX_PAGES,
       * throttled to one request at a time across the whole page (see
       * _throttleJikanBackfill above). Returns a mal_id (number) on a
       * confident match, or null.
       */
      async function findMalIdByTitle(anilistMedia) {
        const candidateTitles = [
          anilistMedia.title?.english,
          anilistMedia.title?.romaji,
          anilistMedia.title?.native
        ].filter(Boolean);
        if (!candidateTitles.length) return null;

        const primaryTitle = candidateTitles[0];
        const targetYear = anilistMedia.startDate?.year || anilistMedia.seasonYear || null;
        const targetEpisodes = anilistMedia.episodes || null;
        const cacheKey = `${primaryTitle.toLowerCase()}::${targetYear || ''}`;

        if (_malBackfillCache.has(cacheKey)) return _malBackfillCache.get(cacheKey);

        // Build the "+"-separated query the self-hosted Jikan search expects
        const query = encodeURIComponent(primaryTitle).replace(/%20/g, '+');

        let bestMalId = null;
        let bestScore = 0;

        try {
          for (let page = 1; page <= MAL_BACKFILL_MAX_PAGES; page++) {
            await _throttleJikanBackfill(); // rate-limit gate — waits its turn before every request
            const res = await fetch(`${JIKAN_SEARCH_BASE}?q=${query}&page=${page}&limit=10`, {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(10000)
            });
            if (!res.ok) break;
            const json = await res.json();
            const results = json.data || [];
            if (!results.length) break;

            for (const c of results) {
              // Gather every title variant Jikan gives us for this candidate
              const cTitles = [
                c.title, c.title_english, c.title_japanese,
                ...((c.titles || []).map(t => t.title))
              ].filter(Boolean);

              // Best similarity across every (AniList title) x (Jikan title) pair
              let sim = 0;
              for (const at of candidateTitles) {
                for (const ct of cTitles) {
                  const s = _titleSimilarity(at, ct);
                  if (s > sim) sim = s;
                }
              }

              // Year plausibility: if both known, allow only ±1 year
              // (covers regional broadcast date differences)
              const cYear = c.year || c.aired?.prop?.from?.year || null;
              const yearOk = !(targetYear && cYear) || Math.abs(cYear - targetYear) <= 1;

              // Episode plausibility: if both known, allow small variance
              // (covers recap/OVA episode-count discrepancies)
              const cEpisodes = c.episodes || null;
              const epOk = !(targetEpisodes && cEpisodes) ||
                Math.abs(cEpisodes - targetEpisodes) <= Math.max(2, targetEpisodes * 0.15);

              if (sim >= MAL_BACKFILL_MIN_SIMILARITY && yearOk && epOk && sim > bestScore) {
                bestScore = sim;
                bestMalId = c.mal_id;
              }
            }

            // Very confident match — no need to keep paginating (and no
            // need to burn another rate-limited request against MAL)
            if (bestScore >= 0.97) break;

            const pag = json.pagination;
            if (!pag || !pag.has_next_page) break;
          }
        } catch (e) {
          console.warn(`[MAL Backfill] Search failed for "${primaryTitle}":`, e.message);
        }

        const result = bestMalId || null;
        _malBackfillCache.set(cacheKey, result);
        if (result) {
          console.log(`[MAL Backfill] ✅ "${primaryTitle}" -> mal_id ${result} (confidence ${(bestScore * 100).toFixed(0)}%)`);
        } else {
          console.log(`[MAL Backfill] ❌ No confident match for "${primaryTitle}" — will be skipped`);
        }
        return result;
      }

      /** Run an async mapper over items with a max concurrency limit.
       *  Concurrency is now mostly a formality for pacing since the shared
       *  throttle above serializes actual network requests either way, but
       *  keeping it modest (3) avoids piling up dozens of queued/waiting
       *  fetches at once when a section has many missing mal_ids. */
      async function mapWithConcurrency(items, limit, fn) {
        const results = new Array(items.length);
        let idx = 0;
        async function worker() {
          while (idx < items.length) {
            const current = idx++;
            results[current] = await fn(items[current], current);
          }
        }
        await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
        return results;
      }

      /* ═════════════════════════════════════════════════════════════════════
         OPTIMIZED API QUEUE SYSTEM v2.0
         - Scroll-based lazy loading (IntersectionObserver)
         - Request throttling (max 3 concurrent)
         - Automatic retry with exponential backoff
         - Respectful delays between requests
         ═════════════════════════════════════════════════════════════════════ */

      // ─── GLOBAL CONFIGURATION ─────────────────────────────────────────────
      const API_QUEUE_CONFIG = {
        maxConcurrent: 3,          // Max simultaneous API calls
        delayBetweenMs: 800,       // Delay between request batches
        retryMaxAttempts: 3,       // Max retries per failed request
        retryBaseDelayMs: 1000,    // Initial retry delay (doubles each attempt)
        lazyLoadRootMargin: '200px', // Start loading 200px before visible
        prioritySections: {
          hero: { priority: 1, immediate: true },       // Load immediately
          topAiring: { priority: 2, delay: 300 },       // After hero + 300ms
          newReleases: { priority: 3, lazy: true },     // When visible
          newAniocean: { priority: 4, lazy: true },     // When visible
          upcoming: { priority: 5, lazy: true },        // When visible
          completed: { priority: 6, lazy: true },       // When visible
          trending: { priority: 7, lazy: true },       // When visible
          popular: { priority: 8, lazy: true },        // When visible
          popularAnime: { priority: 9, lazy: true },   // When visible
          schedule: { priority: 10, lazy: true }       // When visible (heaviest!)
        }
      };

      // ─── API REQUEST QUEUE MANAGER ─────────────────────────────────────────
      class ApiQueueManager {
        constructor() {
          this.queue = [];
          this.activeCount = 0;
          this.isProcessing = false;
          this.requestLog = []; // For debugging
          
          console.log('[API Queue] 🚀 Initialized with maxConcurrent=' + API_QUEUE_CONFIG.maxConcurrent);
        }

        // Add a request to the queue
        async enqueue(fetchFn, options = {}) {
          const {
            id = `req-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
            priority = 5,
            retryCount = 0,
            originalFn = fetchFn
          } = options;

          return new Promise((resolve, reject) => {
            this.queue.push({
              id,
              fetchFn,
              originalFn,
              priority,
              retryCount,
              resolve,
              reject,
              addedAt: Date.now()
            });
            
            // Sort by priority (lower = higher priority)
            this.queue.sort((a, b) => a.priority - b.priority);
            
            this.processQueue();
          });
        }

        // Process the queue with throttling
        async processQueue() {
          if (this.isProcessing) return;
          this.isProcessing = true;

          while (this.queue.length > 0) {
            // Wait for slot availability
            while (this.activeCount >= API_QUEUE_CONFIG.maxConcurrent) {
            await this.delay(API_QUEUE_CONFIG.delayBetweenMs);
            }

            const request = this.queue.shift();
            if (!request) break;

            this.activeCount++;
            const startTime = Date.now();
            
            console.log(`[API Queue] ▶️ [${request.id}] Priority ${request.priority} | Active: ${this.activeCount}/${API_QUEUE_CONFIG.maxConcurrent} | Queue: ${this.queue.length}`);

            // Execute with timeout protection
            try {
              const result = await Promise.race([
                request.fetchFn(),
                new Promise((_, reject) => 
                  setTimeout(() => reject(new Error('REQUEST_TIMEOUT')), 15000)
                )
              ]);
              
              const duration = Date.now() - startTime;
              console.log(`[API Queue] ✅ [${request.id}] Completed in ${duration}ms`);
              
              request.resolve(result);
              this.logRequest(request.id, 'success', duration);
            } catch (error) {
              const duration = Date.now() - startTime;
              console.warn(`[API Queue] ❌ [${request.id}] Failed: ${error.message} (${duration}ms)`);
              
              // Retry logic with exponential backoff
              if (request.retryCount < API_QUEUE_CONFIG.retryMaxAttempts) {
                const retryDelay = API_QUEUE_CONFIG.retryBaseDelayMs * Math.pow(2, request.retryCount);
                console.log(`[API Queue] 🔄 [${request.id}] Retry ${request.retryCount + 1}/${API_QUEUE_CONFIG.retryMaxAttempts} in ${retryDelay}ms...`);
                
                await this.delay(retryDelay);
                
                // Re-enqueue with incremented retry count
                this.queue.push({
                  ...request,
                  retryCount: request.retryCount + 1,
                  priority: request.priority + 0.1 // Slightly lower priority
                });
                
                this.logRequest(request.id, 'retry', duration, request.retryCount + 1);
              } else {
                console.error(`[API Queue] 💀 [${request.id}] All retries exhausted`);
                this.logRequest(request.id, 'failed', duration, -1);
                request.reject(error);
              }
            } finally {
              this.activeCount--;
            }

            // Respectful delay between requests
            if (this.queue.length > 0 && this.activeCount < API_QUEUE_CONFIG.maxConcurrent) {
            await this.delay(API_QUEUE_CONFIG.delayBetweenMs / 2);
            }
          }

          this.isProcessing = false;
        }

        // Utility delay helper
        delay(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Log request for debugging
        logRequest(id, status, duration, retry = 0) {
          this.requestLog.push({
            id,
            status,
            duration,
            retry,
            timestamp: new Date().toISOString()
          });
          
          // Keep only last 50 entries
          if (this.requestLog.length > 50) {
            this.requestLog = this.requestLog.slice(-50);
          }
        }

        // Get queue status for debugging
        getStatus() {
          return {
            queueLength: this.queue.length,
            activeCount: this.activeCount,
            isProcessing: this.isProcessing,
            totalProcessed: this.requestLog.length,
            recentRequests: this.requestLog.slice(-10)
          };
        }
      }

      // Global singleton instance
      const apiQueue = new ApiQueueManager();
      window.apiQueue = apiQueue; // Expose for debugging

      // ─── WRAPPED FETCH FUNCTIONS WITH RETRY ────────────────────────────────
      // These wrap existing fetch functions with automatic queuing and retry

      async function queuedFetchTMDB(endpoint, params) {
        return apiQueue.enqueue(
          () => fetchTMDB(endpoint, params),
          { id: `tmdb-${endpoint.replace('/', '-')}`, priority: 2 }
        );
      }

      async function queuedFetchAniList(query, variables) {
        return apiQueue.enqueue(
          () => fetchAniList(query, variables),
          { id: `anilist-${Date.now() % 10000}`, priority: 3 }
        );
      }

      async function queuedGetTVMazeShows(maxShows, useMultiCountry) {
        return apiQueue.enqueue(
          () => getTVMazeShowsWithTMDBData(maxShows, useMultiCountry),
          { id: `tvmaze-${Date.now() % 10000}`, priority: 4 }
        );
      }

      // ─── SCROLL-BASED LAZY LOADER ─────────────────────────────────────────
      class SectionLazyLoader {
        constructor() {
          this.observer = null;
          this.loadedSections = new Set();
          this.pendingSections = new Map();
          
          console.log('[Lazy Loader] 📜 Initialized');
        }

        init() {
          // Create Intersection Observer with root margin for early triggering
          this.observer = new IntersectionObserver(
            (entries) => this.handleIntersection(entries),
            {
              root: null, // viewport
              rootMargin: API_QUEUE_CONFIG.lazyLoadRootMargin,
              threshold: 0 // Trigger as soon as any part is near viewport
            }
          );
          
          console.log('[Lazy Loader] 👁️ Observer created with rootMargin=' + API_QUEUE_CONFIG.lazyLoadRootMargin);
        }

        // Register a section for lazy loading
        register(sectionId, loadFn, options = {}) {
          const element = document.getElementById(sectionId);
          if (!element) {
            console.warn(`[Lazy Loader] ⚠️ Element #${sectionId} not found`);
            return;
          }

          const config = {
            sectionId,
            loadFn,
            immediate: options.immediate || false,
            delay: options.delay || 0,
            priority: options.priority || 5,
            loaded: false
          };

          if (config.immediate) {
            // Load immediately with optional delay
            if (config.delay > 0) {
              setTimeout(() => this.executeLoad(config), config.delay);
            } else {
              this.executeLoad(config);
            }
          } else {
            // Observe for lazy loading
            this.pendingSections.set(sectionId, config);
            this.observer.observe(element);
            console.log(`[Lazy Loader] 📋 Registered #${sectionId} for lazy loading (priority ${config.priority})`);
          }
        }

        handleIntersection(entries) {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const sectionId = entry.target.id;
              const config = this.pendingSections.get(sectionId);
              
              if (config && !config.loaded) {
                console.log(`[Lazy Loader] 👀 #${sectionId} is visible, loading now...`);
                this.executeLoad(config);
                this.observer.unobserve(entry.target);
              }
            }
          });
        }

        async executeLoad(config) {
          if (this.loadedSections.has(config.sectionId)) return;
          this.loadedSections.add(config.sectionId);
          config.loaded = true;
          
          const startTime = Date.now();
          console.log(`[Lazy Loader] 🚀 Loading #${config.sectionId}...`);
          
          try {
            await config.loadFn();
            const duration = Date.now() - startTime;
            console.log(`[Lazy Loader] ✅ #${config.sectionId} loaded in ${duration}ms`);
          } catch (error) {
            const duration = Date.now() - startTime;
            console.error(`[Lazy Loader] ❌ #${config.sectionId} failed after ${duration}ms:`, error);
            
// Show error state in section
            this.showErrorState(config.sectionId, error.message);
          }
        }

        showErrorState(sectionId, message) {
          // Find container and show error/retry UI
          const containers = {
            topAiringList: 'topAiringScroll',
            newReleasesList: 'newReleasesGrid',
            upcomingList: 'upcomingScroll',
            popularAnimeList: 'popularAnimeList'
          };
          
          const containerId = containers[sectionId] || `${sectionId}Container`;
          const container = document.getElementById(containerId) || document.getElementById(sectionId);
          
          if (container) {
