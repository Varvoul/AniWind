      /**
       * Bridge TVMaze show to TMDB using external IDs (IMDb/TheTVDB)
       * Falls back to title search if no external ID available
       * @param {Object} tvmazeShow - TVMaze show object
       * @returns {Object|null} TMDB TV show object or null
       */
      async function bridgeTVMazeToTMDB(tvmazeShow) {
        const externals = tvmazeShow.externals || {};
        const showName = tvmazeShow.name;
        
        // Strategy 1: Try IMDb ID bridge (most reliable!)
        if (externals.imdb) {
          try {
            const result = await fetchTMDB(`/find/${externals.imdb}`, `external_source=imdb_id`);
            if (result?.tv_results?.length > 0) {
              const tmdbShow = result.tv_results[0];
              console.log(`[TVMaze→TMDB] ✅ IMDb bridge: "${showName}" → TMDB:${tmdbShow.id}`);
              return tmdbShow;
            }
          } catch (e) {
            console.warn(`[TVMaze→TMDB] ⚠️ IMDb bridge failed for "${showName}":`, e.message);
          }
        }
        
        // Strategy 2: Try TheTVDB ID bridge
        if (externals.thetvdb) {
          try {
            const result = await fetchTMDB(`/find/${externals.thetvdb}`, `external_source=tvdb_id`);
            if (result?.tv_results?.length > 0) {
              const tmdbShow = result.tv_results[0];
              console.log(`[TVMaze→TMDB] ✅ TheTVDB bridge: "${showName}" → TMDB:${tmdbShow.id}`);
              return tmdbShow;
            }
          } catch (e) {
            console.warn(`[TVMaze→TMDB] ⚠️ TheTVDB bridge failed for "${showName}":`, e.message);
          }
        }
        
        // Strategy 3: Fallback to TMDB search (with pagination for accuracy)
        console.log(`[TVMaze→TMDB] 🔍 No external ID for "${showName}" - trying search...`);
        return await searchTMDBFallback(showName, tvmazeShow.premiered);
      }
      
      /**
       * TMDB Search fallback - searches by name with pagination to find correct show
       * Validates match by comparing premiere year
       * @param {string} showName - Name of the show to search
       * @param {string} premiered - Premiere date from TVMaze (for validation)
       * @param {number} maxPages - Maximum pages to search (default: 3)
       * @returns {Object|null} Best matching TMDB show or null
       */
      async function searchTMDBFallback(showName, premiered, maxPages = 3) {
        try {
          // Extract year from premiered for validation
          const premierYear = premiered ? new Date(premiered).getFullYear() : null;
          
          for (let page = 1; page <= maxPages; page++) {
            const result = await fetchTMDB('/search/tv', `query=${encodeURIComponent(showName)}&page=${page}`);
            
            if (!result?.results || result.results.length === 0) break;
            
            // Find best match in this page
            for (const candidate of result.results) {
              const candidateYear = candidate.first_air_date 
                ? new Date(candidate.first_air_date).getFullYear() 
                : null;
              
              // Exact name match (case-insensitive) is best
              if (candidate.name.toLowerCase() === showName.toLowerCase()) {
                console.log(`[TVMaze→TMDB] ✅ Search exact match: "${showName}" → TMDB:${candidate.id}`);
                return candidate;
              }
              
              // Same premiere year = likely correct show
              if (premierYear && candidateYear && Math.abs(premierYear - candidateYear) <= 1) {
                console.log(`[TVMaze→TMDB] ✅ Search year match: "${showName}" (${premierYear}) → TMDB:${candidate.id} (${candidateYear})`);
                return candidate;
              }
            }
          }
          
          // If we searched all pages and found results but no good match, take first result
          const firstResult = await fetchTMDB('/search/tv', `query=${encodeURIComponent(showName)}&page=1`);
          if (firstResult?.results?.length > 0) {
            console.log(`[TVMaze→TMDB] ⚠️ Using first search result for "${showName}" → TMDB:${firstResult.results[0].id}`);
            return firstResult.results[0];
          }
          
          console.log(`[TVMaze→TMDB] ❌ No TMDB match found for "${showName}"`);
          return null;
        } catch (e) {
          console.error(`[TVMaze→TMDB] ❌ Search error for "${showName}":`, e.message);
          return null;
        }
      }
      
      /**
       * Main function: Get TVMaze shows (multi-country!) enriched with TMDB data
       * Uses smart multi-country fallback to maximize scripted content!
       * Filters out non-scripted content and bridges to TMDB for rich data
       * @param {number} maxShows - Maximum shows to process (default: 20)
       * @param {boolean} useMultiCountry - Use multi-country fetch? (default: true)
       * @returns {Array} Array of objects with both TVMaze and TMDB data
       */
      async function getTVMazeShowsWithTMDBData(maxShows = 20, useMultiCountry = true) {
        console.log('[TVMaze] 🚀 Starting TVMaze + TMDB bridge pipeline...');
        
        // Step 1: Fetch TVMaze schedule (multi-country or single country)
        let tvmazeShows;
        
        if (useMultiCountry) {
          // 🔄 ROTATING SINGLE COUNTRY: each page load fetches ONE country from the
          // rotation list (Western + America + South Korea + Turkey + Pakistan + India +
          // China + Singapore + Indonesia + Vietnam + Myanmar). NO Japan (AniList covers that).
          const rotationResult = await getTVMazeShowsRotatingCountry(null);
          
          tvmazeShows = rotationResult.shows;
          console.log(`[TVMaze-🔄] Rotation result: ${tvmazeShows.length} shows from "${rotationResult.country}"`);
        } else {
          // Single country (original behavior)
          tvmazeShows = await fetchTVMazeSchedule('US');
          
          // Filter to scripted/animation content only
          const validTypes = ['Scripted', 'Animation', 'Mini-Series', 'Documentary'];
          tvmazeShows = tvmazeShows.filter(show => {
            const type = show.type || 'Unknown';
            if (!validTypes.includes(type)) {
              console.log(`[TVMaze] ⏭️ Skipping ${type}: "${show.name}"`);
              return false;
            }
            return true;
          });
        }
        
        console.log(`[TVMaze] 📊 Total shows to bridge: ${tvmazeShows.length}`);
        
        // Step 2: Bridge each show to TMDB (with rate limit awareness - batch of 5 concurrent)
        const BATCH_SIZE = 5;
        const bridgedShows = [];
        const targetShows = tvmazeShows.slice(0, maxShows);  // Limit to maxShows
        
        for (let i = 0; i < targetShows.length; i += BATCH_SIZE) {
          const batch = targetShows.slice(i, i + BATCH_SIZE);
          const batchResults = await Promise.allSettled(
            batch.map(async (show) => {
              const tmdbData = await bridgeTVMazeToTMDB(show);
              return {
                tvmaze: show,
                tmdb: tmdbData,
                hasTMDB: !!tmdbData
              };
            })
          );
          
          for (const result of batchResults) {
            if (result.status === 'fulfilled' && result.value.hasTMDB) {
              bridgedShows.push(result.value);
            }
          }
          
          // Small delay between batches to respect rate limits
          if (i + BATCH_SIZE < targetShows.length) {
            await new Promise(resolve => setTimeout(resolve, 250));
          }
        }
        
        console.log(`[TVMaze] ✅ Successfully bridged ${bridgedShows.length}/${targetShows.length} shows to TMDB`);
        return bridgedShows;
      }

      async function loadHero() {

        // ═══════════════════════════════════════════════════════════════════
        const seenTmdb = new Set();

        freshTmdbShows.sort((a, b) => (b.popularity||0) - (a.popularity||0));

        // ═══════════════════════════════════════════════════════════════════
        // ANIME: dedup + bannerImage → coverImage.extraLarge fallback

        //   - AniList items: bannerImage, fallback coverImage.extraLarge/large
        //   - Jikan items  : no banner field — trailer max-image, then the

        //   - Banner-missing (no usable hero image at all) anime are filtered out
        //   - Anime without a resolvable mal_id are dropped (broken info links)
        // ═══════════════════════════════════════════════════════════════════
        const seenAnime = new Set();
        const uniqueAnime = [];
        for (const a of dbHSAnime) {
          const n = normalizeAnimeItem(a);
          if (!n) continue;
          if (n.isAdult) continue;
          const key = n.mal_id || n.anilist_id || n.title;
          if (!key || seenAnime.has(key)) continue;
          seenAnime.add(key);
          uniqueAnime.push({ raw: a, n });
        }
        // Keep anime that have a usable hero image. AniList: banner OR
        // coverImage; Jikan: any image (large poster / trailer thumb).
        // Anything with NO image at all is filtered out (banner-missing rule).
        const animeWithImage = uniqueAnime.filter(({ raw, n }) => {
          if (n.source === 'jikan') {
            return !!(raw.images?.webp?.large_image_url || raw.images?.jpg?.large_image_url ||
                      raw.images?.webp?.image_url || raw.images?.jpg?.image_url ||
                      raw.trailer?.images?.maximum_image_url);

        })
        .filter(({ n }) => !!n.mal_id) // no mal_id → /info/anime/jikan-null link — drop
        .map(({ raw, n }) => ({ raw, n }))
        .sort((a, b) => {
          const timeA = a.raw.nextAiringEpisode?.timeUntilAiring ?? (a.n.status === 'Airing' ? 1e9 : Infinity);
          const timeB = b.raw.nextAiringEpisode?.timeUntilAiring ?? (b.n.status === 'Airing' ? 1e9 : Infinity);
          if (timeA !== timeB) return timeA - timeB;
          const pa = (parseFloat(a.n.score) || 0) * (Math.log10(a.n.popularity + 10) || 0);
          const pb = (parseFloat(b.n.score) || 0) * (Math.log10(b.n.popularity + 10) || 0);
          return pb - pa;
        });
        const topAnilistAnime = animeWithImage.slice(0, HERO_CONFIG.anilistTargetCount);
        console.log(`[Hero] 🎌 Anime with banner→extraLarge fallback: ${topAnilistAnime.length} ready (${topAnilistAnime.filter(x => x.n.source === 'jikan').length} jikan / ${topAnilistAnime.filter(x => x.n.source === 'anilist').length} anilist)`);

        const sourceType = 'Endpoint + dynamic year filter';
        console.log(`[Hero] 🎬 Fetched ${topTmdbShows.length} TV (${sourceType}) + ${topAnilistAnime.length} airing anime`);

        // ═══════════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════════

        // ── Helper: Calculate string similarity (for TMDB validation) ──
        const calculateSimilarity = (str1, str2) => {
          const s1 = str1.toLowerCase().replace(/[^a-z0-9]/g, '');
          const s2 = str2.toLowerCase().replace(/[^a-z0-9]/g, '');
          if (!s1 || !s2) return 0;
          const longer = s1.length > s2.length ? s1 : s2;
          const shorter = s1.length > s2.length ? s2 : s1;
          if (longer.length === 0) return 1;
          const costs = Array(shorter.length + 1).fill(0).map((_, i) => i);
          for (let i = 1; i <= longer.length; i++) {
            let prev = i;
            for (let j = 1; j <= shorter.length; j++) {
              const cost = longer[i-1] !== shorter[j-1] ? 1 : 0;
              prev = Math.min(prev + 1, costs[j] + 1, costs[j-1] + cost);
              costs[j] = prev;
            }
          }
          return (1 - costs[shorter.length] / longer.length);
        };

        // ── Step 1: Fetch Anilist Banner by mal_id (PRIMARY SOURCE) ────
        const fetchAnilistBanner = async (malId, fallbackTitle) => {

              // Title similarity check (must be >80% confident)

              if (titleSim < 0.8) continue;
              
              // Episode count validation (if we have episode data)

        }));

      /* ── NEW ON ANIUMI - 3-Row Horizontal Scroll ── */
      (function initNewAnioceanScroll() {
        const container = document.getElementById('newAnioceanGrid');
        const leftBtn = document.getElementById('newAnioceanLeft');
        const rightBtn = document.getElementById('newAnioceanRight');
        if (!container || !leftBtn || !rightBtn) return;

        /* ── Layout function: compute exact column count + width from container ──
           This fixes two issues:
           1) "8th column shows incomplete" — old code hardcoded 40 × 165px columns,
              so if the container width could fit 7.5 cards, the 8th bled in half-visible.
              Now we compute visible cols = floor((containerWidth + gap) / (cardWidth + gap))
              and set grid-template-columns to exactly that many columns. The 8th column
              is then off-screen until the user scrolls.
           2) "Overscroll past last card" — old code reserved 40 columns regardless of
              how many cards existed. Now we cap total columns to Math.ceil(items/3)
              so the scrollWidth equals the actual content width.
           Card width is responsive: 165px desktop, 150px tablet, 2-per-row on mobile. */
        function layoutShelf() {
          if (!container) return;
          const items = container.querySelectorAll('.aniocean-card').length;
          if (items === 0) return;

          // Determine card width based on current breakpoint (matches CSS @media rules)
          const w = window.innerWidth;
          let cardWidth = 165;   // desktop default
          let gap = 12;
          let rows = 3;
          if (w <= 1100) { cardWidth = 150; gap = 12; rows = 2; }      // tablet
          if (w <= 768)  {
            // Mobile: 2 cards per visible page, 2 rows
            cardWidth = Math.floor((w - 32 - 8) / 2); // matches CSS calc
            gap = 8;
            rows = 2;
          }

          // Visible columns = how many full cards fit in the container width
          const containerWidth = container.clientWidth;
          const visibleCols = Math.max(1, Math.floor((containerWidth + gap) / (cardWidth + gap)));

          // Total columns needed = ceil(items / rows). If items don't fill a full column,
          // we still need that column to exist (so partial last column is intentional and visible).
          const totalCols = Math.ceil(items / rows);

          // Set the grid-template-columns to exactly visibleCols columns of cardWidth each.
          // grid-auto-columns matches so any overflow (when totalCols > visibleCols, which is
          // the normal case) also uses the same cardWidth — no shrinking.
          container.style.gridTemplateColumns = `repeat(${visibleCols}, ${cardWidth}px)`;
          container.style.gridAutoColumns = `${cardWidth}px`;

          // Override the total scrollable width to exactly totalCols columns + gaps.
          // This is the key fix for the overscroll bug: instead of letting CSS Grid
          // lay out implicit columns forever, we explicitly cap by setting a max-width
          // on the content via a wrapper-like technique. But CSS Grid doesn't have a
          // "max columns" property — the cleanest way is to leave grid-auto-flow:column
          // alone (it'll only create as many columns as needed to hold all items) and
          // trust that scrollWidth will then equal items * cardWidth / rows.
          // No additional cap needed — grid-auto-flow:column with N items and 3 rows
          // naturally produces Math.ceil(N/3) columns.

          // Update container height to match the actual card height at the new cardWidth.
          // Poster aspect-ratio is 3/4.5, so poster height = cardWidth * 4.5 / 3.
          const posterH = cardWidth * 4.5 / 3;
          const infoH = (w <= 768) ? 60 : 75;
          const rowH = posterH + infoH;
          const totalH = rowH * rows + gap * (rows - 1) + 16; // +16 padding buffer
          container.style.height = totalH + 'px';
          if (w <= 768) {
            container.style.maxHeight = 'none';
          } else if (w <= 1100) {
            container.style.maxHeight = '600px';
          } else {
            container.style.maxHeight = '1000px';
          }

          // Store the computed values for the scroll-amount function to use
          container.dataset.cardWidth = String(cardWidth);
          container.dataset.gap = String(gap);
          container.dataset.visibleCols = String(visibleCols);

          updateEndState();
        }

        // Expose layoutShelf globally so renderAnimeList can call it after data loads
        window.layoutAnioceanShelf = layoutShelf;

        function getScrollAmount() {
          const cardWidth = parseInt(container.dataset.cardWidth || '165', 10);
          const gap = parseInt(container.dataset.gap || '12', 10);
          const visibleCols = parseInt(container.dataset.visibleCols || '5', 10);
          // Scroll by visible columns minus 1 (to show overlap for context)
          return Math.max(1, visibleCols - 1) * (cardWidth + gap);

        function isAtEnd() {
          return container.scrollLeft + container.clientWidth >= container.scrollWidth - 2;
        }

          const atStart = isAtStart();
          const atEnd = isAtEnd();

          leftBtn.classList.toggle('scroll-arrow-disabled', atStart);
          rightBtn.disabled = atEnd;
          rightBtn.classList.toggle('scroll-arrow-disabled', atEnd);

          if (isAtStart()) return;
          container.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
        });
        rightBtn.addEventListener('click', () => {

              if (e.key === 'ArrowRight' && isAtEnd()) return;

      /* ── NEW RELEASES ── */
      let allReleases = {all:[], anime:[], movie:[], tv:[]};

        /* Card poster uses aspect-ratio: 3/4.5 (matches .card-poster), so poster
           height = colWidth * 4.5 / 3. Add info area (~70px) + a little breathing
           room. Round up to avoid sub-pixel clipping. */
        const posterH = colWidth * 4.5 / 3;
        const infoH = 70;
        const rowHeight = Math.ceil(posterH + infoH);
        grid.style.setProperty('--nr-row-height', rowHeight + 'px');
      }
      function nrGetScrollAmount() {
        const grid = document.getElementById('newReleasesGrid');
        return grid ? grid.clientHeight : 0;
      }
      let _nrResizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(_nrResizeTimer);
        _nrResizeTimer = setTimeout(() => {
          const shouldBeVertical = nrIsVerticalActive();
          const grid = document.getElementById('newReleasesGrid');
          if (!grid) return;
          const isVertical = grid.classList.contains('nr-vertical-3row');
          if (shouldBeVertical !== isVertical) {
            // Crossed the desktop/landscape breakpoint or tab changed layout mode —
            // re-render fully so the right CSS class set is applied.
            renderNewReleases(currentNewReleasesFilter);
          } else if (shouldBeVertical) {
            nrLayoutVertical();
          }
        }, 200);
      });
      let _nrScrollWired = false;
      function nrActiveContainers() {
        if (currentNewReleasesFilter === 'hidden') {
          return ['nrHiddenRow1', 'nrHiddenRow2', 'nrHiddenRow3'].map(id => document.getElementById(id)).filter(Boolean);
        }
        const grid = document.getElementById('newReleasesGrid');
        return grid ? [grid] : [];
      }
      function nrActiveScrollAmount() {
        if (currentNewReleasesFilter === 'hidden') {
          const row = document.getElementById('nrHiddenRow1');
          return row ? getRowScrollAmount(row) : 0;
        }
        return nrGetScrollAmount();
      }
      function nrWireScrollControls() {
        if (_nrScrollWired) return;
        _nrScrollWired = true;
        const leftBtn = document.getElementById('nrScrollLeft');
        const rightBtn = document.getElementById('nrScrollRight');
        const upBtn = document.getElementById('nrScrollUp');
        const downBtn = document.getElementById('nrScrollDown');
        const grid = document.getElementById('newReleasesGrid');
        const section = grid ? grid.closest('.section') : null;
        if (!leftBtn || !rightBtn || !upBtn || !downBtn) return;

        // These header chevrons drive whichever row set is currently on
        // screen — the "All" tab's single horizontal grid, or (when the
        // Hidden tab is active) all 3 country rows scrolling together.
        function refContainer() { return nrActiveContainers()[0] || null; }
        function isAtStart() {
          const c = refContainer();
          if (!c) return true;
          // Vertical layout uses scrollTop; horizontal uses scrollLeft.
          if (c.classList.contains('nr-vertical-3row')) return c.scrollTop <= 1;
          return c.scrollLeft <= 1;
        }
        function isAtEnd() {
          const c = refContainer();
          if (!c) return true;
          if (c.classList.contains('nr-vertical-3row')) {
            return c.scrollTop + c.clientHeight >= c.scrollHeight - 2;
          }
          return c.scrollLeft + c.clientWidth >= c.scrollWidth - 2;
        }
        function updateEdgeState() {
          const atStart = isAtStart(), atEnd = isAtEnd();
          // Horizontal chevrons (still used by the "Hidden" tab rows)
          leftBtn.disabled = atStart;
          leftBtn.classList.toggle('scroll-arrow-disabled', atStart);
          rightBtn.disabled = atEnd;
          rightBtn.classList.toggle('scroll-arrow-disabled', atEnd);
          // Vertical chevrons (used by All/Anime/Movie/Series tabs in vertical mode)
          upBtn.disabled = atStart;
          upBtn.classList.toggle('scroll-arrow-disabled', atStart);
          downBtn.disabled = atEnd;
          downBtn.classList.toggle('scroll-arrow-disabled', atEnd);
        }
        updateEdgeState();

        function scrollActive(dir) {
          const amount = nrActiveScrollAmount();
          const c = refContainer();
          if (!c) return;
          if (c.classList.contains('nr-vertical-3row')) {
            // Vertical layout: scroll on Y axis. Amount = 3 rows = container height.
            c.scrollBy({ top: dir * amount, behavior: 'smooth' });
          } else {
            nrActiveContainers().forEach(cc => cc.scrollBy({ left: dir * amount, behavior: 'smooth' }));
          }
          setTimeout(updateEdgeState, 350); // let the smooth-scroll settle before re-checking
        }
        leftBtn.addEventListener('click', () => { if (!isAtStart()) scrollActive(-1); });
        rightBtn.addEventListener('click', () => { if (!isAtEnd()) scrollActive(1); });
        upBtn.addEventListener('click', () => { if (!isAtStart()) scrollActive(-1); });
        downBtn.addEventListener('click', () => { if (!isAtEnd()) scrollActive(1); });

        // Track scroll on every possible target (all-grid + 3 hidden rows) so
        // whichever one is actually visible keeps the buttons in sync.
        ['newReleasesGrid', 'nrHiddenRow1', 'nrHiddenRow2', 'nrHiddenRow3'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener('scroll', updateEdgeState);
            new MutationObserver(updateEdgeState).observe(el, { childList: true });
          }
        });
        window.addEventListener('resize', updateEdgeState);
        // Tab switch swaps which container is the active reference — re-check shortly after.
        document.getElementById('releaseTabs')?.addEventListener('click', () => setTimeout(updateEdgeState, 60));

        if (section) {
          document.addEventListener('keydown', (e) => {
            const active = nrActiveContainers();
            if (!active.length) return;
            const isVert = grid.classList.contains('nr-vertical-3row');
            const isHoriz = grid.classList.contains('nr-horizontal');
            if (!isVert && !isHoriz && currentNewReleasesFilter !== 'hidden') return;
            const hovering = section.matches(':hover') || active.some(c => c.matches(':hover'));
            // Vertical layout: respond to up/down arrow keys
            if (isVert && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && hovering) {
              if (e.key === 'ArrowUp' && isAtStart()) return;
              if (e.key === 'ArrowDown' && isAtEnd()) return;
              e.preventDefault();
              scrollActive(e.key === 'ArrowUp' ? -1 : 1);
            }
            // Horizontal layout (Hidden tab): respond to left/right arrow keys
            if (!isVert && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && hovering) {
              if (e.key === 'ArrowLeft' && isAtStart()) return;
              if (e.key === 'ArrowRight' && isAtEnd()) return;
              e.preventDefault();
              scrollActive(e.key === 'ArrowLeft' ? -1 : 1);
            }
          });
        }
        // Belt-and-suspenders: recompute column width whenever the container's
        // actual box size changes (sidebar/font/image reflows, not just window resize)
        if (grid && 'ResizeObserver' in window) {
          const ro = new ResizeObserver(() => {
            if (grid.classList.contains('nr-horizontal')) nrLayoutColumns();
            if (grid.classList.contains('nr-vertical-3row')) nrLayoutVertical();
            updateEdgeState();
          });
          ro.observe(grid);
        }
      }

      function renderNewReleases(filter) {
        const grid = document.getElementById('newReleasesGrid');
        const controls = document.getElementById('nrScrollControls')?.closest('.nr-header-controls');
        const useVertical = filter !== 'hidden' && nrIsVerticalActive();
        const useHorizontal = false; // retired — vertical 3-row replaces it
        const data = useVertical
          ? (filter === 'all' ? nrBuildVerticalList() : (allReleases[filter] || []))
          : (allReleases[filter] || []);

        if (!data.length) {
          /* Distinguish "still loading" from "genuinely empty":
             - If loadNewReleases hasn't finished yet (_newReleasesLoaded === false),
               show a skeleton grid (matches the real .show-card-grid layout) so the
               user sees a loading state instead of "No releases available".
             - Once loadNewReleases has finished and a tab is still empty, show the
               real empty-state message. */
          if (!_newReleasesLoaded) {
            grid.classList.remove('nr-vertical-3row', 'nr-horizontal');
            grid.style.removeProperty('--nr-col-width');
            grid.style.removeProperty('--nr-row-height');
            if (controls) {
              controls.classList.remove('nr-horiz-active', 'nr-vert-active');
            }
            const skCols = (window.innerWidth <= 520) ? 4 :
                           (window.innerWidth <= 992) ? 6 :
                           (window.innerWidth <= 1400) ? 8 : 10;
            grid.innerHTML = skGridCards(skCols * 2); // 2 rows of skeletons
            return;
          }
          // Load is done but this tab is empty — show the empty-state.
          grid.classList.remove('nr-horizontal', 'nr-vertical-3row');
          grid.style.removeProperty('--nr-col-width');
          grid.style.removeProperty('--nr-row-height');
          if (controls) {
            controls.classList.remove('nr-horiz-active', 'nr-vert-active');
          }
          grid.innerHTML = `<div class="nr-empty-state">
            <i class="fas fa-inbox"></i>
            <span>No ${filter === 'all' ? 'releases' : filter} available right now</span>
          </div>`;
          return;
        }

        // Toggle layout classes. Vertical-3row takes precedence over horizontal
        // (which is now retired but the class is kept for backward compat).
        grid.classList.toggle('nr-vertical-3row', useVertical);
        grid.classList.toggle('nr-horizontal', useHorizontal);
        if (controls) {
          controls.classList.toggle('nr-vert-active', useVertical);
          controls.classList.toggle('nr-horiz-active', useHorizontal);
        }

        // No hero/featured card in vertical layout — pass featured:false always.
        // The hero card is also removed from the mobile grid layout per spec
        // (point 01: "remove the 1st show card hero card" applies to all layouts).
        grid.innerHTML = data.map(s => buildReleaseCardHTML(s, { featured: false })).join('');

        if (useVertical) {
          nrLayoutVertical();
          nrWireScrollControls();
          grid.scrollTop = 0;
        } else if (useHorizontal) {
          nrLayoutColumns();
          nrWireScrollControls();
          grid.scrollLeft = 0;
        } else {
          grid.style.removeProperty('--nr-col-width');
          grid.style.removeProperty('--nr-row-height');
        }
      }
      /* ══════════════════════════════════════════════════════════════════
         "HIDDEN" TAB — country-grouped Movies+TV, TMDB /discover
         Row 1: South Korea + Japan   Row 2: Pakistan + India   Row 3: Turkey
         ══════════════════════════════════════════════════════════════════ */
      const nrHiddenSleep = (ms) => new Promise(r => setTimeout(r, ms));
      const NR_HIDDEN_RATE_LIMIT_MS = 350; // gap between sequential t-umi calls

      /**
       * Fetch up to `targetPerType` valid (poster + name/title present) movies
       * AND `targetPerType` valid TV shows for one country, for the CURRENT
       * calendar year — date range is computed from `new Date()` every call,
       * never hardcoded, so it always covers "this year" automatically.
       * Paginates only as far as needed to fill the quota (stops early),
       * and respects rate limits with a delay between every page/call.
       */
      async function fetchCountryMoviesAndTV(countryCode, targetPerType = 20, maxPages = 5) {
        const year = new Date().getFullYear();
        const movies = [], tvShows = [];
        const seenMovieIds = new Set(), seenTvIds = new Set();

        // ── Movies ──
        for (let page = 1; page <= maxPages && movies.length < targetPerType; page++) {
          if (page > 1) await nrHiddenSleep(NR_HIDDEN_RATE_LIMIT_MS);
          let data;
          try {
            data = await fetchTMDB('/discover/movie',
              `with_origin_country=${countryCode}&release_date.gte=${year}-01-01&release_date.lte=${year}-12-31&page=${page}`);
          } catch (e) {
            console.warn(`[Hidden] Movie fetch failed (${countryCode} p${page}):`, e.message);
            break;
          }
          const results = data?.results || [];
          for (const m of results) {
            if (!m.poster_path || !(m.title || m.original_title)) continue;
            if (seenMovieIds.has(m.id)) continue;
            seenMovieIds.add(m.id);
            movies.push(m);
            if (movies.length >= targetPerType) break;
          }
          if (!results.length || page >= (data?.total_pages || 1)) break;
        }

        await nrHiddenSleep(NR_HIDDEN_RATE_LIMIT_MS);

        // ── TV ──
        for (let page = 1; page <= maxPages && tvShows.length < targetPerType; page++) {
          if (page > 1) await nrHiddenSleep(NR_HIDDEN_RATE_LIMIT_MS);
          let data;
          try {
            data = await fetchTMDB('/discover/tv',
              `with_origin_country=${countryCode}&first_air_date.gte=${year}-01-01&first_air_date.lte=${year}-12-31&page=${page}`);
          } catch (e) {
            console.warn(`[Hidden] TV fetch failed (${countryCode} p${page}):`, e.message);
            break;
          }
          const results = data?.results || [];
          for (const t of results) {
            if (!t.poster_path || !(t.name || t.original_name)) continue;
            if (seenTvIds.has(t.id)) continue;
            seenTvIds.add(t.id);
            tvShows.push(t);
            if (tvShows.length >= targetPerType) break;
          }
          if (!results.length || page >= (data?.total_pages || 1)) break;
        }

        console.log(`[Hidden] ${countryCode}: ${movies.length} movies + ${tvShows.length} TV (target ${targetPerType} each)`);
        return { movies, tvShows, country: countryCode };
      }

      // Map raw TMDB results to the same card shape buildReleaseCardHTML/infoUrl/
      // watchUrl already understand — so URLs, hover effects, and buttons are
      // automatically correct with zero extra code.
      function nrHiddenMovieCard(m, countryCode) {
        return {
          id: `tmdb-hd-movie-${m.id}`,
          tmdb_id: m.id,
          title: m.title || m.original_title,
          type: 'Movie',
          poster: tmdbImg(m.poster_path),
          score: (m.vote_average || 0).toFixed(1),
          details: (m.release_date || '').slice(0, 4) || 'TBA',
          cert: m.adult ? '18+' : 'PG-13',
          quality: 'HD',
          country: countryCode
        };
      }
      function nrHiddenTvCard(t, countryCode) {
        return {
          id: `tmdb-hd-tv-${t.id}`,
          tmdb_id: t.id,
          title: t.name || t.original_name,
          type: 'TV',
          poster: tmdbImg(t.poster_path),
          score: (t.vote_average || 0).toFixed(1),
          details: (t.first_air_date || '').slice(0, 4) || 'TBA',
          cert: 'PG-13',
          quality: 'HD',
          country: countryCode
        };
      }

      /** Fetches + builds one row's card list for a group of countries, sequentially.
       *  DB (Neon hidden_tab, country-keyed) first per country; only falls
       *  back to the live TMDB /discover calls for a country the DB doesn't
       *  have data for yet. */
      async function nrFetchHiddenRow(countries, targetPerType = 20) {
        const items = [];
        const dbHidden = await window.getHomeData('hidden_tab');
        // V4.8.0: endpoint returns tmdb_movie / tmdb_tv (snake_case) —
        // the old TMDB_Movie / TMDB_TV lookups never matched → live fetches only.
        const dbMoviesByCountry = dbHidden?.tmdb_movie || dbHidden?.TMDB_Movie || {};
        const dbTvByCountry     = dbHidden?.tmdb_tv    || dbHidden?.TMDB_TV    || {};
        for (let i = 0; i < countries.length; i++) {
          const country = countries[i];
          const dbMoviesRaw = dbMoviesByCountry[country];
          const dbTvRaw     = dbTvByCountry[country];
          const dbMovies = Array.isArray(dbMoviesRaw) ? dbMoviesRaw : flattenTmdbMap(dbMoviesRaw);
          const dbTv     = Array.isArray(dbTvRaw)     ? dbTvRaw     : flattenTmdbMap(dbTvRaw);
          let movies, tvShows;
          if (dbMovies.length || dbTv.length) {
            movies = dbMovies.slice(0, targetPerType);
            tvShows = dbTv.slice(0, targetPerType);
          } else {
            if (i > 0) await nrHiddenSleep(NR_HIDDEN_RATE_LIMIT_MS);
            ({ movies, tvShows } = await fetchCountryMoviesAndTV(country, targetPerType));
          }
          // Interleave movie/TV per country instead of "all movies then all TV"
          const n = Math.max(movies.length, tvShows.length);
          for (let j = 0; j < n; j++) {
            if (movies[j]) items.push(nrHiddenMovieCard(movies[j], country));
            if (tvShows[j]) items.push(nrHiddenTvCard(tvShows[j], country));
          }
        }
        return items;
      }

      function nrHiddenSkeletonRow(containerId) {
        /* Use skHorizCards (matches .show-card-horiz exactly) instead of the
           generic skCards — the real hidden rows render show-card-grid cards
           via buildReleaseCardHTML, which have poster + info overlay. The
           horizontal scroll container is 200px wide per card, so use that
           width here to match the real layout. */
        const el = document.getElementById(containerId);
        if (el) {
          el.innerHTML = Array.from({length: 8}, () => `
            <div class="show-card-grid skeleton-card" style="position:relative;flex:0 0 auto;width:200px;">
              <div class="skeleton card-poster" style="aspect-ratio:3/4.5;border-radius:var(--radius-md);"></div>
              <div class="card-info-grid" style="background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);">
                <div class="skeleton" style="height:9px;width:60%;margin-bottom:4px;border-radius:4px;"></div>
                <div class="skeleton" style="height:11px;width:85%;border-radius:4px;"></div>
              </div>
            </div>`).join('');
        }
      }

      function nrRenderHiddenRow(containerId, items) {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (!items.length) {
          el.innerHTML = `<div class="nr-empty-state"><i class="fas fa-inbox"></i><span>No releases available right now</span></div>`;
          return;
        }
        el.innerHTML = items.map(s => buildReleaseCardHTML(s)).join('');
      }

      /* ── Hidden tab: chevron + arrow-key scroll for each of the 3 rows,
         same left/right pattern as Top Airing / the "All" tab. ── */
      ['nrHiddenRow1', 'nrHiddenRow2', 'nrHiddenRow3'].forEach(rowId => {
        const container = document.getElementById(rowId);
        const leftBtn = document.getElementById(`${rowId}Left`);
        const rightBtn = document.getElementById(`${rowId}Right`);
        if (!container || !leftBtn || !rightBtn) return;
        leftBtn.addEventListener('click', () => container.scrollBy({ left: -getRowScrollAmount(container), behavior: 'smooth' }));
        rightBtn.addEventListener('click', () => container.scrollBy({ left: getRowScrollAmount(container), behavior: 'smooth' }));
        enableArrowKeyScroll(container.closest('.nr-hidden-row'), container);
      });

      let hiddenReleasesLoaded = false;
      let hiddenReleasesLoading = false;
      /** Loads all 3 rows ONE AT A TIME (never in parallel) — spreads out load
       *  on the t-umi proxy and lets the user see content progressively instead
       *  of waiting for everything before anything appears. Only ever runs once
       *  per page visit — switching tabs back and forth after the first load
       *  just re-shows the cached rows, no re-fetching. */
      async function loadHiddenReleases() {
        if (hiddenReleasesLoaded || hiddenReleasesLoading) return;
        hiddenReleasesLoading = true;
        nrHiddenSkeletonRow('nrHiddenRow1');
        nrHiddenSkeletonRow('nrHiddenRow2');
        nrHiddenSkeletonRow('nrHiddenRow3');

        try {
          console.log('[Hidden] Row 1/3: KR + ID + TW...');
          const row1 = await nrFetchHiddenRow(['KR', 'ID', 'TW'], 20);
          nrRenderHiddenRow('nrHiddenRow1', row1);

          await nrHiddenSleep(400);

          console.log('[Hidden] Row 2/3: PK + IN + PH...');
          const row2 = await nrFetchHiddenRow(['PK', 'IN', 'PH'], 20);
          nrRenderHiddenRow('nrHiddenRow2', row2);

          await nrHiddenSleep(400);

          console.log('[Hidden] Row 3/3: TR + CL + TW...');
          const row3 = await nrFetchHiddenRow(['TR', 'CL', 'TW'], 20);
          nrRenderHiddenRow('nrHiddenRow3', row3);

          const totalCount = row1.length + row2.length + row3.length;
          const countEl = document.getElementById('nrCountHidden');
          if (countEl) countEl.textContent = totalCount > 0 ? totalCount : '';

          hiddenReleasesLoaded = true;
          console.log(`[Hidden] ✅ Complete: ${totalCount} total items across 3 rows`);
        } catch (e) {
          console.error('[Hidden] Failed:', e.message);
        } finally {
          hiddenReleasesLoading = false;
        }
      }

      document.getElementById('releaseTabs').addEventListener('click', e => {
        const tabBtn = e.target.closest('.toggle-tab');
        if (tabBtn) {
          // Update active state
          document.querySelectorAll('#releaseTabs .toggle-tab').forEach(t=>t.classList.remove('active'));
          tabBtn.classList.add('active');
          
          // Move glider to active tab
          moveGlider('releaseTabs', 'releaseGlider', tabBtn);
          
          const filter = tabBtn.dataset.filter;
          currentNewReleasesFilter = filter;
          const grid = document.getElementById('newReleasesGrid');
          const hiddenContainer = document.getElementById('newReleasesHidden');
          const label = filter === 'all' ? 'All' : filter === 'anime' ? 'Anime' : filter === 'movie' ? 'Movies' : filter === 'tv' ? 'Series' : 'Hidden';

          if (filter === 'hidden') {
            // Swap to the 3-row country layout; API calls only fire the FIRST
            // time this tab is opened (loadHiddenReleases guards against repeats).
            grid.style.display = 'none';
            hiddenContainer.style.display = '';
            // Header chevrons for the hidden tab are the LEFT/RIGHT (horizontal)
            // pair, gated behind .nr-horiz-active. The vertical (up/down) chevrons
            // must be hidden, so make sure .nr-vert-active is removed.
            const hiddenControls = document.getElementById('nrScrollControls')?.closest('.nr-header-controls');
            if (hiddenControls) {
              hiddenControls.classList.add('nr-horiz-active');
              hiddenControls.classList.remove('nr-vert-active');
            }
            document.getElementById('newReleasesTitle').textContent = 'Latest Hidden';
            const viewAll = document.getElementById('nrViewAll');
            if (viewAll) viewAll.href = '/new-releases?type=hidden';
            loadHiddenReleases();
            return;
          }

          // Any other tab: restore the normal grid, hide the hidden-rows container
          hiddenContainer.style.display = 'none';
          grid.style.display = '';

          // Fade out, swap content, fade in — avoids an abrupt flash on switch
          grid.classList.add('nr-fading');
          setTimeout(() => {
            renderNewReleases(filter);
            document.getElementById('newReleasesTitle').textContent = filter==='all' ? 'New Releases' : `Latest ${label}`;
            const viewAll = document.getElementById('nrViewAll');
            if (viewAll) viewAll.href = filter === 'all' ? '/new-releases' : `/new-releases?type=${filter}`;
            grid.classList.remove('nr-fading');
          }, 160);
        }
      });

      /* ── UPCOMING ── */
      let upcomingShows=[];
      /**
       * Paginated, rate-limited fetch of upcoming Japanese TV/TV_SHORT anime from AniList.
       * - Filters at the API level: countryOfOrigin JP, format TV/TV_SHORT only (no movies/OVAs/etc.)
       * - Fetches sequentially (never concurrently) and stops as soon as `targetCount`
       *   valid (poster + non-adult) results are collected — no wasted requests.
       * - Waits 400ms between pages to stay well within AniList's rate limits.
       * - Hard-capped at `maxPages` as a safety net so a pathological response
       *   (e.g. AniList always claiming hasNextPage) can never loop forever.
       */
      async function fetchUpcomingAnimeAniList(targetCount = 50, maxPages = 4) {
        const collected = [];
        const seenIds = new Set();
        let page = 1;
        let hasNextPage = true;

        while (collected.length < targetCount && page <= maxPages && hasNextPage) {
          if (page > 1) {
            // Rate-limit courtesy: small gap between sequential AniList page requests
            await new Promise(r => setTimeout(r, 400));
          }

          let data;
          try {
            data = await fetchAniList(`
              query ($page: Int, $perPage: Int) {
                Page(page: $page, perPage: $perPage) {
                  pageInfo { hasNextPage }
                  media(
                    type: ANIME,
                    status: NOT_YET_RELEASED,
                    isAdult: false,
                    countryOfOrigin: "JP",
                    format_in: [TV, TV_SHORT],
                    sort: [POPULARITY_DESC]
                  ) {
                    ${ANILIST_ANIME_FIELDS}
                  }
                }
              }
            `, { page, perPage: 50 });
          } catch (err) {
            console.warn(`[Upcoming Anime] AniList page ${page} failed:`, err.message);
            break;
          }

          const media = data?.Page?.media || [];
          hasNextPage = !!data?.Page?.pageInfo?.hasNextPage;

          for (const m of media) {
            if (m.isAdult || seenIds.has(m.id)) continue;
            seenIds.add(m.id);
            collected.push(m);
            if (collected.length >= targetCount) break;
          }

          console.log(`[Upcoming Anime] Page ${page}: +${media.length} raw → ${collected.length}/${targetCount} collected (hasNextPage: ${hasNextPage})`);
          page++;
        }

        return collected;
      }

      /**
       * Format a Date as YYYY-MM-DD (local time) — used for TMDB date-filter params.
       */
      function todayISODate() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      /**
       * Paginated, rate-limited, queue-managed fetch of genuinely upcoming TMDB movies.
       * - Fetches pages SEQUENTIALLY (one at a time), never concurrently — a real queue,
       *   not a burst of 30 simultaneous requests.
       * - Stops as soon as `targetCount` valid results (poster + truly future release_date)
       *   are collected — no wasted requests once we have enough.
       * - Dynamic date filter: release_date >= today (computed fresh every call), not a
       *   hardcoded year string — so a movie released earlier this year but already out
       *   is correctly excluded, and nothing has to change when the year rolls over.
       * - 250ms gap between pages to stay well clear of TMDB's rate limits.
       */
      async function fetchUpcomingMoviesTMDB(targetCount = 50, maxPages = 10) {
        const collected = [];
        const seenIds = new Set();
        const todayStr = todayISODate();
        const todayDate = new Date(todayStr);
        let page = 1;
        let totalPages = maxPages;

        while (collected.length < targetCount && page <= Math.min(maxPages, totalPages)) {
          if (page > 1) await new Promise(r => setTimeout(r, 250));

          let data;
          try {
            data = await fetchTMDB('/movie/upcoming', `page=${page}`);
          } catch (err) {
            console.warn(`[Upcoming Movies] page ${page} failed:`, err.message);
            break;
          }

          const results = data?.results || [];
          if (data?.total_pages) totalPages = data.total_pages;
          if (!results.length) break;

          for (const item of results) {
            if (seenIds.has(item.id)) continue;
            const hasPoster = item.poster_path && item.poster_path !== 'null' && item.poster_path !== 'undefined';
            // Dynamic: genuinely upcoming = release_date is today or later (not "same year")
            const isFuture = item.release_date && new Date(item.release_date) >= todayDate;
            if (!hasPoster || !isFuture) continue;
            seenIds.add(item.id);
            collected.push(item);
            if (collected.length >= targetCount) break;
          }

          console.log(`[Upcoming Movies] page ${page}/${totalPages}: ${results.length} raw → ${collected.length}/${targetCount} collected`);
          page++;
        }

        return collected;
      }

      /**
       * Paginated, rate-limited, queue-managed fetch of genuinely upcoming TMDB TV shows.
       * IMPORTANT FIELD-NAME NOTE: TMDB's TV date field is `first_air_date` (confirmed against
       * TMDB's own docs) — same field used before, so no rename needed there.
       * ENDPOINT CHANGE: switched from /tv/on_the_air to /discover/tv with
       * first_air_date.gte={today}. /tv/on_the_air is "currently airing right now" by
       * definition — its first_air_date is always in the past, so a "future date" filter
       * on it can never return anything. /discover/tv + first_air_date.gte is the correct
       * way to ask TMDB for shows that haven't premiered yet.
       */
      async function fetchUpcomingTVTMDB(targetCount = 50, maxPages = 10) {
        const collected = [];
        const seenIds = new Set();
        const todayStr = todayISODate();
        const todayDate = new Date(todayStr);
        let page = 1;
        let totalPages = maxPages;

        while (collected.length < targetCount && page <= Math.min(maxPages, totalPages)) {
          if (page > 1) await new Promise(r => setTimeout(r, 250));

          let data;
          try {
            data = await fetchTMDB('/discover/tv', `page=${page}&sort_by=popularity.desc&first_air_date.gte=${todayStr}`);
          } catch (err) {
            console.warn(`[Upcoming TV] page ${page} failed:`, err.message);
            break;
          }

          const results = data?.results || [];
          if (data?.total_pages) totalPages = data.total_pages;
          if (!results.length) break;

          for (const item of results) {
            if (seenIds.has(item.id)) continue;
            const hasPoster = item.poster_path && item.poster_path !== 'null' && item.poster_path !== 'undefined';
            const isFuture = item.first_air_date && new Date(item.first_air_date) >= todayDate;
            if (!hasPoster || !isFuture) continue;
            seenIds.add(item.id);
            collected.push(item);
            if (collected.length >= targetCount) break;
          }

          console.log(`[Upcoming TV] page ${page}/${totalPages}: ${results.length} raw → ${collected.length}/${targetCount} collected`);
          page++;
        }

        return collected;
      }

      // exactly, as measured empirically (the late @media (max-width:768px)
      // override in the stylesheet wins over the earlier 3-col rule, so the
      // real column count is 2 at ≤768, never 3):
      //   ≥1601 → 7 | 1201–1600 → 6 | 993–1200 → 5 | 769–992 → 4 | ≤768 → 2
      // If these ever drift apart again, the JS trims to the wrong multiple
      // and the grid shows a partial last row.
      function calcCompletedCols() {
        const w = window.innerWidth;
        if (w <= 768) return 2;
        if (w <= 992) return 4;
        if (w <= 1200) return 5;
        if (w <= 1600) return 6;

      let _completedPool = [];     // full deduped item pool for the current page — lets resize re-trim without refetching

      // Exactly 10 rows on every paginated page, every viewport — trimmed to
      // full rows so the last row is never partial.
      function completedRowsForViewport() {
        return 10;
      }

      // Slice the current pool to an exact multiple of the live column count
      // (capped at 10 rows) so the grid NEVER ends on a partial last row.
      function completedFullRows() {
        const cols = calcCompletedCols();
        const target = completedRowsForViewport() * cols;
        const fullRows = Math.floor(_completedPool.length / cols) * cols;
        const trimTo = Math.min(fullRows, target);
        // Data too sparse to fill a single row (rare API failures): show what
        // exists rather than nothing.
        return _completedPool.slice(0, trimTo > 0 ? trimTo : Math.min(_completedPool.length, target));
      }
